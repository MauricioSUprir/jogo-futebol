<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070e">
<title>GOLAÇO — teste dos menus</title>
<link rel="stylesheet" href="../css/menus.css">
<style>
  html, body { margin: 0; height: 100%; background: #04070e; }
  #fake-game { position: fixed; inset: 0; display: none; place-items: center; font: 600 16px/1.4 Inter, sans-serif; color: #cfe; text-align: center;
    background: repeating-linear-gradient(90deg, #1d5e2e 0 60px, #226a34 60px 120px); }
  #fake-game pre { max-width: 90vw; max-height: 60vh; overflow: auto; text-align: left; background: rgba(0,0,0,.6); padding: 12px; border-radius: 8px; font-size: 11px; }
  #fake-game button { font: inherit; margin: 4px; padding: 8px 14px; }
</style>
</head>
<body>
<!-- página de teste: simula o núcleo (partida falsa) para exercitar todos os menus -->
<div id="fake-game">
  <div>
    <p>Partida em andamento (simulada). <kbd>Esc</kbd> pausa.</p>
    <div>
      <button id="fg-pause">Pausar</button>
      <button id="fg-end">Encerrar com resultado</button>
    </div>
    <pre id="fg-cfg"></pre>
  </div>
</div>
<div id="menus"></div>
<script type="module">
import { initMenus, showMainMenu, showPause, hidePause, showMatchResult } from '../js/menus.js';
import { DEFAULT_SETTINGS } from '../js/config.js';
import { simulateMatch } from '../js/tournament.js';

let settings;
try { settings = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem('golaco.config') || '{}') }; } catch { settings = { ...DEFAULT_SETTINGS }; }
const game = document.getElementById('fake-game');
let cfg = null, paused = false;
window.__cfgs = [];

const audio = { unlock() { console.log('[audio] unlock'); }, setVolumes(v) { window.__vol = v; } };

function pause() {
  if (!cfg || paused) return;
  paused = true;
  showPause({
    onResume: () => { paused = false; },
    onRestart: () => { paused = false; console.log('[jogo] reiniciar'); },
    onQuit: () => { paused = false; cfg = null; game.style.display = 'none'; },
    onSettings: (s) => console.log('[jogo] configurações aplicadas', s.camera),
  });
}
function end(result) {
  game.style.display = 'none';
  const c = cfg; cfg = null;
  showMatchResult(result || simulateMatch(c.home, c.away, { knockout: c.knockout }), { onContinue: () => console.log('[jogo] continuar') });
}
window.__end = end;
window.__pause = pause;

initMenus({
  root: document.getElementById('menus'),
  settings,
  saveSettings: (s) => { try { localStorage.setItem('golaco.config', JSON.stringify(s)); } catch {} },
  onStartMatch: (c) => {
    cfg = c; paused = false;
    window.__cfgs.push(c);
    const view = { ...c, home: c.home.name, away: c.away.name };
    console.log('[onStartMatch]', JSON.stringify(view));
    document.getElementById('fg-cfg').textContent = JSON.stringify(view, null, 2);
    game.style.display = 'grid';
  },
  audio,
});
document.getElementById('fg-pause').onclick = pause;
document.getElementById('fg-end').onclick = () => end();
addEventListener('keydown', (e) => { if (e.key === 'Escape' && cfg && !paused) pause(); });
showMainMenu();
</script>
</body>
</html>
