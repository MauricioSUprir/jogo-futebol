<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLAÇO — teste da torcida 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; color: #fff; background: rgba(0,0,0,.5); padding: 6px 9px; border-radius: 6px; line-height: 1.5; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
// Teste da torcida 3D com o estádio inteiro.
// ?tod=dia|tarde|noite &q=baixa|media|alta|ultra &cam=tv|close|stand|end|away|high
// &react=goal|chance|save|foul &side=home|away &at=segundos após a reação
// &exc=0..1 &pose=0..8 (força uma pose — depuração) &home=#hex &away=#hex &live=1 (animação contínua)
// Teclas (live): G gol casa, A gol visitante, C chance, F falta, S defesa.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { QUALITY } from '../js/config.js';
import { buildStadium } from '../js/stadium.js';

const qs = new URLSearchParams(location.search);
const tod = qs.get('tod') || 'noite';
const qn = qs.get('q') || 'alta';
const quality = QUALITY[qn] || QUALITY.alta;
const camMode = qs.get('cam') || 'tv';

const renderer = new THREE.WebGLRenderer({ antialias: quality.msaa, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio * quality.pixelRatio, quality.maxPR));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);

// tv = mesma câmera de transmissão do jogo; close = ~10 m das primeiras fileiras
const VIEWS = {
  tv: { pos: [0, 17.5, -56], tgt: [0, 0, 4], fov: 21 },
  tvwide: { pos: [0, 24, -66], tgt: [0, 3, 4], fov: 44 },
  close: { pos: [6, 2.4, 31], tgt: [2, 4.2, 46], fov: 42 },
  stand: { pos: [-44, 2.2, -14], tgt: [-63, 5.5, 2], fov: 46 },
  end: { pos: [-40, 4, 0], tgt: [-66, 7, 0], fov: 48 },
  away: { pos: [42, 2.5, 6], tgt: [64, 5, -2], fov: 46 },
  upper: { pos: [10, 12, 30], tgt: [0, 20, 62], fov: 50 },
  high: { pos: [0, 80, -48], tgt: [0, 0, 2], fov: 50 },
};
const v = VIEWS[camMode] || VIEWS.tv;
camera.position.fromArray(v.pos);
controls.target.fromArray(v.tgt);
camera.fov = v.fov;
camera.updateProjectionMatrix();
controls.update();

const homeColor = qs.get('home') || '#111418';   // preto e verde (Atlético Serrano, 2º uniforme)
const awayColor = qs.get('away') || '#f5c400';
const stadium = buildStadium(renderer, scene, { quality, timeOfDay: tod, homeColor, awayColor, wind: { x: 3, z: 1.5 } });
window.__stadium = stadium;
const crowd = stadium.root.getObjectByName('torcida');
if (qs.get('pose')) crowd.userData.debugPose(+qs.get('pose'));

const exc = parseFloat(qs.get('exc') ?? '0.3');
const react = qs.get('react'), side = qs.get('side') || 'home';
const at = parseFloat(qs.get('at') ?? '1.5');
const T0 = parseFloat(qs.get('t') ?? '20');

window.renderAt = (time) => {
  stadium.update(1, time, exc, camera);
  renderer.render(scene, camera);
};

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'g') stadium.crowdReact('goal', 'home');
  if (k === 'a') stadium.crowdReact('goal', 'away');
  if (k === 'c') stadium.crowdReact('chance', 'home');
  if (k === 'f') stadium.crowdReact('foul', 'home');
  if (k === 's') stadium.crowdReact('save', 'home');
});

const hud = document.getElementById('hud');
if (qs.get('hud') === '0') hud.style.display = 'none';

stadium.ready.then(() => {
  let t = T0;
  if (react) { stadium.update(1, t, exc, camera); stadium.crowdReact(react, side); t += at; }
  window.renderAt(t);
  const i = renderer.info.render;
  window.__info = {
    quality: crowd.userData.quality, people: crowd.userData.count, crowdTris: crowd.userData.tris,
    meshes: crowd.children.map((m) => [m.name, m.userData.tris, m.geometry.instanceCount]),
    calls: i.calls, frameTris: i.triangles,
  };
  hud.textContent = `${tod} · ${qn} · ${crowd.userData.count} torcedores · torcida ${(crowd.userData.tris / 1e3).toFixed(0)}k tri · quadro ${(i.triangles / 1e3).toFixed(0)}k tri · ${i.calls} draws`;
  window.__ready = true;
  if (qs.get('live')) {
    const clock = new THREE.Clock();
    (function loop() {
      t += Math.min(clock.getDelta(), 0.05);
      controls.update();
      stadium.update(0.016, t, exc, camera);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    })();
  }
});
</script>
</body>
</html>
