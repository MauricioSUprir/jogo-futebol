<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLAÇO — teste dos fotógrafos</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Teste leve dos fotógrafos (sem estádio): gramado liso, sol/refletor e flashes do fx.js.
// ?q=baixa|media|alta &cam=perto|fila|alto|frente &ball=x,z &t=segundos &flash=1
import * as THREE from 'three';
import { QUALITY } from '../js/config.js';
import { buildPhotographers } from '../js/stadium-photogs.js';
import { StadiumFX } from '../js/fx.js';

const qs = new URLSearchParams(location.search);
const quality = QUALITY[qs.get('q') || 'alta'];
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 120), new THREE.MeshStandardMaterial({ color: 0x2f6b2a, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// linha de fundo
const line = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 68), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
line.rotation.x = -Math.PI / 2; line.position.set(-52.5, 0.01, 0); scene.add(line);
const sun = new THREE.DirectionalLight(0xeef3ff, 2.9);
sun.position.set(30, 100, -42); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 50, bottom: -50, far: 300 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xa9bbdc, 0x2a3a24, 0.8));
const U = { uTime: { value: +(qs.get('t') || 10) } };
const ph = buildPhotographers({ U, quality, shadows: true });
scene.add(ph);
const b = (qs.get('ball') || '-40,0').split(',').map(Number);
ph.userData.uniforms.uBall.value.set(b[0], 0, b[1]);
const fx = new StadiumFX(scene, { quality, isNight: true });
if (qs.get('flash')) { fx.goal('home', ['#111', '#1db954'], -1); }
const cams = {
  perto: [[-52.3, 1.4, 4.0], [-56, 0.8, 10]],
  fila: [[-48, 3.0, -4], [-56, 0.6, -14]],
  alto: [[-30, 12, -40], [-56, 0, -5]],
  frente: [[-50.5, 1.3, 9.5], [-56, 0.9, 9.5]],
  costas: [[-60, 1.8, 11], [-54, 0.9, 9]],
};
const c = cams[qs.get('cam') || 'perto'];
const camera = new THREE.PerspectiveCamera(+(qs.get('fov') || 45), innerWidth / innerHeight, 0.05, 500);
camera.position.set(...c[0]); camera.lookAt(...c[1]);
let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  fx.update(qs.get('flash') ? 0.016 : dt);
  renderer.render(scene, camera);
  window.__info = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, count: ph.userData.count, trisPh: ph.userData.tris };
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
