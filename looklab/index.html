    (criando ? '<div class="field"><label>Repita a senha</label><input class="inp" id="au-senha2" type="password" autocomplete="new-password" /></div>' +
      '<label class="linha"><input type="checkbox" id="au-exemplo" /> Começar com o guarda-roupa de exemplo (para experimentar)</label>' : "") +
    '<button class="btn pri big block" id="au-enviar" type="submit"' + (AUTH.ocupado ? " disabled" : "") + ">" +
    (AUTH.ocupado ? "Aguarde…" : criando ? "Criar conta" : "Entrar") + "</button>" +
    "</form>" +
    (criando ? "" : '<button class="link" id="au-esqueci" style="margin-top:12px">Esqueci minha senha</button>') +
    rodape + "</div>";

  $("#authTema").onclick = giraTema;
  $("#au-tab-entrar").onclick = () => { AUTH = { modo: "entrar", erro: "", ok: "", ocupado: false }; desenhaAuth(); };
  $("#au-tab-criar").onclick = () => { AUTH = { modo: "criar", erro: "", ok: "", ocupado: false }; desenhaAuth(); };
  const esq = $("#au-esqueci");
  if (esq) esq.onclick = () => { AUTH = { modo: "esqueci", erro: "", ok: "", ocupado: false }; desenhaAuth(); };
  $("#au-form").onsubmit = (e) => { e.preventDefault(); enviaAuth(); };
  setTimeout(() => { const f = $(criando ? "#au-nome" : "#au-email"); if (f) f.focus(); }, 40);
}
async function enviaAuth() {
  if (AUTH.ocupado) return;
  const criando = AUTH.modo === "criar";
  const email = ($("#au-email") || {}).value || "";
  const senha = ($("#au-senha") || {}).value || "";
  const falha = (m) => { ocupaAuth(false); avisaAuth(m); };

  if (!emailValido(email)) return falha("Escreva um e-mail válido.");
  if (criando) {
    const nome = ($("#au-nome") || {}).value || "";
    const senha2 = ($("#au-senha2") || {}).value || "";
    if (senha.length < 6) return falha("A senha precisa ter pelo menos 6 caracteres.");
    if (senha !== senha2) return falha("As duas senhas não são iguais.");
    if (achaConta(email)) return falha("Já existe uma conta com esse e-mail neste aparelho.");
    avisaAuth(""); ocupaAuth(true);
    try {
      const r = await criarConta(nome, email, senha, !!($("#au-exemplo") || {}).checked);
      abreApp(r.herdado ? "Conta criada. O guarda-roupa que já estava aqui foi mantido." : "Conta criada. Bem-vindo(a) ao LookLab!");
    } catch (e) { falha("Não consegui criar a conta neste navegador."); }
    return;
  }
  avisaAuth(""); ocupaAuth(true);
  try {
    const ok = await entrar(email, senha);
    if (!ok) return falha("E-mail ou senha não conferem.");
    abreApp("Bem-vindo(a) de volta!");
  } catch (e) { falha("Não consegui verificar a senha neste navegador."); }
}
function abreApp(msg) {
  AUTH = { modo: "entrar", erro: "", ok: "", ocupado: false };
  $("#auth").classList.remove("on");
  $("#auth").innerHTML = "";
  document.body.style.overflow = "";
  aplicaTema();
  ROTA = lerHash();
  render();
  if (msg) toast(msg);
}
function giraTema() {
  const ordem = ["auto", "light", "dark"];
  const t = ordem[(ordem.indexOf(temaAtual()) + 1) % 3];
  CONTAS.ui.theme = t; salvaContas();
  if (DB) { DB.ui.theme = t; save(); }
  aplicaTema();
  if ($("#auth").classList.contains("on")) desenhaAuth();
  else if (ROTA.tab === "perfil") render();
}
const temaAtual = () => (DB && DB.ui && DB.ui.theme) || (CONTAS.ui && CONTAS.ui.theme) || "auto";
</script>

<script>
"use strict";
/* ===================== RENDER ===================== */
function aplicaTema() {
  const t = temaAtual();
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").textContent = t === "light" ? "☀️" : t === "dark" ? "🌙" : "🌗";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === "light" ? "#f6f6f8" : "#0b0b0d";
}
function render() {
  const foco = document.activeElement;
  const fid = foco && foco.id ? foco.id : null;
  const pos = foco && foco.selectionStart != null ? foco.selectionStart : null;

  const p = P();
  $("#whoAv").textContent = p.avatar || "🙂";
  $("#whoNm").textContent = p.nome;
  $("#whoCx").textContent = ehResp() ? "modo responsável" : (p.idade ? p.idade + " anos" : "perfil");
  renderTabs();

  const v = $("#view");
  const t = ROTA.tab;
  v.innerHTML =
    t === "guarda" ? viewGuarda() :
      t === "criar" ? viewCriar() :
        t === "ia" ? viewIA() :
          t === "calendario" ? viewCalendario() :
            t === "tendencias" ? viewTendencias() :
              t === "inspiracoes" ? viewInspiracoes() :
                t === "desejos" ? viewDesejos() :
                  t === "viagens" ? viewViagens() :
                    t === "perfil" ? viewPerfil() :
                      t === "peca" ? viewPeca(ROTA.arg) :
                        t === "look" ? viewLook(ROTA.arg) :
                          viewInicio();

  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (pos != null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch (e) { } } } }
}

/* ===================== AÇÕES ===================== */
function idsDe(el) { return (el.dataset.ids || "").split(",").filter(Boolean); }
function ctxDe(el) { try { return JSON.parse(el.dataset.ctx || "{}"); } catch (e) { return {}; } }

const ACOES = {
  fecharModal: () => fechaModal(),

  /* dashboard / sugestões */
  novaSugestao: () => render(),
  usarHoje: (el) => { const ids = idsDe(el); registraUso(ids); toast("Uso registrado. 👍"); render(); },
  salvarSugestao: (el) => {
    const ids = idsDe(el), c = ctxDe(el);
    const its = ids.map(item).filter(Boolean);
    if (its.length < 2) return;
    const l = { id: uid(), nome: el.dataset.nome || sugereNome(its, c), itens: ids, ocasiao: c.ocasiao || "", estilo: c.estilo || "", clima: c.clima || "", fav: true, criado: hoje(), usos: [] };
    P().looks.push(l); save(); toast("Look salvo nos favoritos ⭐"); render();
  },
  abrirCriar: (el) => {
    const ids = idsDe(el), c = ctxDe(el);
    carregaLookNoBuilder({ id: null, nome: "", ocasiao: c.ocasiao, estilo: c.estilo, clima: c.clima, itens: ids });
    BUILDER.editId = null; ir("criar");
  },
  lookCom: (el) => {
    const it = item(el.dataset.id); if (!it) return;
    const g = geraLooks({ obrigatorios: [it.id] }, 1)[0];
    carregaLookNoBuilder({ id: null, nome: "", ocasiao: "", estilo: "", clima: "", itens: g ? g.its.map((i) => i.id) : [it.id] });
    BUILDER.editId = null; ir("criar");
  },

  /* guarda-roupa */
  limparFiltro: () => { FILTRO = { q: "", slot: "", cor: "", estilo: "", ocasiao: "", status: "ativas", ordem: "recente" }; render(); },
  novaPeca: () => abreFormPeca(null),
  novaPecaFoto: () => {
    abreFormPeca(null);
    setTimeout(() => { const f = $("#fotoInp"); if (f) f.click(); }, 60);
  },
  editarPeca: (el) => abreFormPeca(el.dataset.id),
  salvarPeca: () => salvaPeca(),
  escolherFoto: () => { colheFormPeca(); const f = $("#fotoInp"); if (f) f.click(); },
  tirarFoto: () => { colheFormPeca(); FORM.foto = ""; desenhaFormPeca(); },
  excluirPeca: (el) => {
    const id = el.dataset.id, it = item(id); if (!it) return;
    if (!confirm("Excluir “" + it.nome + "” do guarda-roupa?")) return;
    P().itens = P().itens.filter((x) => x.id !== id);
    P().looks = P().looks.filter((l) => { l.itens = l.itens.filter((x) => x !== id); return l.itens.length >= 2; });
    Object.keys(P().plano || {}).forEach((d) => { if (!look(P().plano[d].lookId)) delete P().plano[d]; });
    save(); fechaModal(); toast("Peça excluída."); ir("guarda");
  },

  /* criador */
  gerarLook: () => {
    const g = geraLooks(BUILDER.ctx, 1)[0];
    if (!g) { toast("Faltam peças para montar. Cadastre mais roupas."); return; }
    const ctx = BUILDER.ctx;
    BUILDER.slots = { outer: "", top: "", bottom: "", shoes: "", acc: "" };
    g.its.forEach(setSlotComItem);
    BUILDER.ctx = ctx; BUILDER.nome = ""; BUILDER.editId = null;
    render(); toast("Look gerado com as suas peças ✨");
  },
  limparBuilder: () => { BUILDER = { slots: { outer: "", top: "", bottom: "", shoes: "", acc: "" }, ctx: { ocasiao: "", estilo: "", clima: "" }, nome: "", editId: null }; render(); },
  salvarLook: () => { const n = $("#nomeLook"); if (n) BUILDER.nome = n.value; const l = salvaLookAtual(); if (l) render(); },
  planejarLook: () => { const n = $("#nomeLook"); if (n) BUILDER.nome = n.value; abrePlanejar(hoje()); },
  tirarSlot: (el) => { BUILDER.slots[el.dataset.slot] = ""; if (MODAL) fechaModal(); render(); },
  escolhePeca: (el) => { const it = item(el.dataset.peca); if (!it) return; setSlotComItem(it); fechaModal(); render(); },

  /* estilista */
  perguntar: () => { const el = $("#perg"); if (!el) return; const q = el.value; el.value = ""; perguntar(q); },

  /* calendário */
  calPrev: () => { CAL.m--; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } render(); },
  calNext: () => { CAL.m++; if (CAL.m > 11) { CAL.m = 0; CAL.y++; } render(); },
  planejarSemana: () => planejaSemana(),
  gerarParaDia: () => {
    const g = geraLooks({ clima: "meia-estação" }, 1)[0];
    if (!g) { toast("Faltam peças para montar."); return; }
    const d = fromISO(PLAN.dia);
    const l = { id: uid(), nome: "Look de " + DOW[d.getDay()] + " " + d.getDate() + "/" + pad2(d.getMonth() + 1), itens: g.its.map((i) => i.id), ocasiao: "", estilo: "", clima: "meia-estação", fav: false, criado: hoje(), usos: [] };
    P().looks.push(l);
    P().plano = P().plano || {}; P().plano[PLAN.dia] = { lookId: l.id, ocasiao: "" };
    save(); desenhaPlanejar(); render(); toast("Look definido para " + dataCurta(PLAN.dia) + ".");
  },
  usarBuilderNoDia: () => {
    const l = salvaLookAtual(); if (!l) return;
    P().plano = P().plano || {}; P().plano[PLAN.dia] = { lookId: l.id, ocasiao: BUILDER.ctx.ocasiao || "" };
    save(); fechaModal(); render(); toast("Planejado para " + dataCurta(PLAN.dia) + ".");
  },
  limparDia: () => { delete P().plano[PLAN.dia]; save(); desenhaPlanejar(); render(); },
  escolheLookDia: (el) => {
    P().plano = P().plano || {};
    P().plano[PLAN.dia] = { lookId: el.dataset.id, ocasiao: (look(el.dataset.id) || {}).ocasiao || "" };
    save(); desenhaPlanejar(); render(); toast("Planejado para " + dataCurta(PLAN.dia) + ".");
  },

  /* tendências e inspirações */
  lookTendencia: (el) => {
    const t = TRENDS.trends.find((x) => x.id === el.dataset.id); if (!t) return;
    const m = t.match || {};
    const g = geraLooks({ cats: m.cats || [], cores: m.colors || [], estilo: (m.styles || [])[0] || "" }, 1)[0];
    if (!g) { toast("Faltam peças para montar."); return; }
    carregaLookNoBuilder({ id: null, nome: t.nome, ocasiao: "", estilo: (m.styles || [])[0] || "", clima: "", itens: g.its.map((i) => i.id) });
    BUILDER.editId = null; ir("criar"); toast("Look montado na linha “" + t.nome + "”.");
  },
  recriar: (el) => {
    const insp = INSPIRACOES.find((i) => i.id === el.dataset.id); if (!insp) return;
    const r = recriaInspiracao(insp);
    if (!r) { toast("Faltam peças parecidas no guarda-roupa."); return; }
    carregaLookNoBuilder({ id: null, nome: insp.titulo, ocasiao: insp.ocasiao, estilo: insp.estilo, clima: insp.clima, itens: r.its.map((i) => i.id) });
    BUILDER.editId = null; ir("criar"); toast("Montei algo parecido com as suas roupas ✨");
  },

  /* desejos */
  addDesejo: () => {
    const nome = ($("#d-nome") || {}).value || "";
    if (!nome.trim()) { toast("Escreva o nome da peça."); return; }
    const d = { id: uid(), nome: nome.trim(), cat: ($("#d-cat") || {}).value || "camiseta", cor: ($("#d-cor") || {}).value || "preto", preco: Number(($("#d-preco") || {}).value || 0), nota: ($("#d-nota") || {}).value || "" };
    P().desejos = P().desejos || []; P().desejos.push(d); save(); render(); toast("Adicionado à lista ❤️");
  },
  delDesejo: (el) => { P().desejos = (P().desejos || []).filter((d) => d.id !== el.dataset.id); save(); render(); },

  /* viagens */
  gerarMala: () => {
    geraMala(($("#v-destino") || {}).value || "Viagem", Math.max(1, Math.min(21, Number(($("#v-dias") || {}).value || 5))),
      ($("#v-tipo") || {}).value || "viagem familiar", ($("#v-clima") || {}).value || "meia-estação");
  },
  delViagem: (el) => { P().viagens = (P().viagens || []).filter((v) => v.id !== el.dataset.id); save(); render(); },

  /* looks */
  abrirLook: (el) => ir("look", el.dataset.id),
  favLook: (el) => { const l = look(el.dataset.id); if (l) { l.fav = !l.fav; save(); render(); toast(l.fav ? "Adicionado aos favoritos ⭐" : "Removido dos favoritos."); } },
  usarLook: (el) => {
    const l = look(el.dataset.id); if (!l) return;
    l.usos = l.usos || []; if (!l.usos.includes(hoje())) l.usos.push(hoje());
    registraUso(l.itens); save(); render(); toast("Uso registrado. 👍");
  },
  variacao: (el) => { const l = look(el.dataset.id); if (l) variacaoDe(l); },
  editarLook: (el) => { const l = look(el.dataset.id); if (l) { carregaLookNoBuilder(l); ir("criar"); } },
  planejarEsse: (el) => abrePlanejar(hoje(), el.dataset.id),
  delLook: (el) => {
    const l = look(el.dataset.id); if (!l) return;
    if (!confirm("Excluir o look “" + l.nome + "”?")) return;
    P().looks = P().looks.filter((x) => x.id !== l.id);
    Object.keys(P().plano || {}).forEach((d) => { if (P().plano[d].lookId === l.id) delete P().plano[d]; });
    save(); ir("criar"); toast("Look excluído.");
  },

  /* perfis e responsáveis */
  trocarPerfil: (el) => { DB.ativo = el.dataset.id; CHAT = []; save(); toast("Agora é o guarda-roupa de " + P().nome + "."); ir("inicio"); },
  novoPerfil: () => abreFormPerfil(null),
  salvarPerfil: (el) => {
    const nome = ($("#pf-nome") || {}).value.trim();
    if (!nome) { toast("Escreva um nome."); return; }
    const idade = Number(($("#pf-idade") || {}).value || 0);
    const av = ($(".chip.on", $("#pf-av")) || {}).textContent || "🙂";
    const id = el.dataset.id;
    if (id) { const p = DB.perfis.find((x) => x.id === id); Object.assign(p, { nome, idade, avatar: av.trim() }); }
    else {
      const p = { id: uid(), nome, idade, avatar: av.trim(), estilos: [], itens: [], looks: [], plano: {}, desejos: [], viagens: [], criado: hoje() };
      DB.perfis.push(p); DB.ativo = p.id;
    }
    save(); fechaModal(); render(); toast("Perfil salvo.");
  },
  delPerfil: (el) => {
    if (DB.perfis.length <= 1) { toast("É preciso ter pelo menos um perfil."); return; }
    const p = DB.perfis.find((x) => x.id === el.dataset.id); if (!p) return;
    if (!confirm("Excluir o perfil de " + p.nome + " e todo o guarda-roupa dele(a)?")) return;
    DB.perfis = DB.perfis.filter((x) => x.id !== p.id);
    if (DB.ativo === p.id) DB.ativo = DB.perfis[0].id;
    save(); render(); toast("Perfil excluído.");
  },
  entrarResp: () => {
    const v = (($("#pin") || {}).value || "").trim();
    if (!/^\d{4}$/.test(v)) { toast("O PIN tem 4 dígitos."); return; }
    if (!DB.resp.pin) { DB.resp.pin = v; DB.modo = "guardian"; save(); render(); toast("PIN criado. Modo responsável ativo."); return; }
    if (v !== DB.resp.pin) { toast("PIN incorreto."); return; }
    DB.modo = "guardian"; save(); render(); toast("Modo responsável ativo.");
  },
  sairResp: () => { DB.modo = "kid"; save(); render(); toast("De volta ao modo do perfil."); },
  sairConta: () => {
    if (!confirm("Sair da conta? Os dados continuam guardados neste aparelho.")) return;
    sair(); toast("Você saiu da conta.");
  },
  trocarSenha: () => {
    const corpo = '<div class="field"><label>Senha atual</label><input class="inp" id="ts-atual" type="password" autocomplete="current-password" /></div>' +
      '<div class="field" style="margin-top:12px"><label>Senha nova</label><input class="inp" id="ts-nova" type="password" autocomplete="new-password" placeholder="mínimo de 6 caracteres" /></div>' +
      '<div class="field" style="margin-top:12px"><label>Repita a senha nova</label><input class="inp" id="ts-nova2" type="password" autocomplete="new-password" /></div>' +
      '<p class="hint" style="margin-top:12px">A senha não é guardada em lugar nenhum — se esquecer, não há como recuperar. ' +
      "Exporte um backup antes, por garantia.</p>";
    abreModal("Trocar senha", corpo,
      '<button class="btn" data-act="fecharModal">Cancelar</button><button class="btn pri" data-act="confirmaSenha">Salvar</button>',
      () => setTimeout(() => { const f = $("#ts-atual"); if (f) f.focus(); }, 40));
  },
  confirmaSenha: async (el) => {
    const atual = ($("#ts-atual") || {}).value || "", nova = ($("#ts-nova") || {}).value || "", nova2 = ($("#ts-nova2") || {}).value || "";
    if (nova !== nova2) { toast("As duas senhas novas não são iguais."); return; }
    el.disabled = true;
    const erro = await trocarSenha(atual, nova);
    el.disabled = false;
    if (erro) { toast(erro); return; }
    fechaModal(); toast("Senha trocada.");
  },
  apagarConta: () => {
    const c = contaAtual(); if (!c) return;
    if (!confirm("Excluir a conta " + c.email + " e TODO o guarda-roupa dela deste aparelho? Isso não tem volta.")) return;
    if (!confirm("Tem certeza mesmo? Exporte um backup antes se quiser guardar os dados.")) return;
    excluirConta(c.id);
    CHAT = [];
    AUTH = { modo: CONTAS.contas.length ? "entrar" : "criar", erro: "", ok: "Conta excluída.", ocupado: false };
    desenhaAuth();
  },
  exportar: () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "looklab-backup-" + hoje() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  importar: () => { const f = $("#fileImp"); if (f) f.click(); },
  resetar: () => {
    if (!confirm("Isso apaga o guarda-roupa desta conta e volta para os perfis de exemplo (Lucas, Marina e Pedro). Continuar?")) return;
    const tema = temaAtual();
    DB = seedDB(); DB.ui.theme = tema; save(); aplicaTema(); ir("inicio"); toast("Recomeçamos do exemplo.");
  },
  limparTudo: () => {
    if (!confirm("Isso apaga todos os perfis, peças e looks desta conta, deixando um perfil vazio. Continuar?")) return;
    const c = contaAtual(), tema = temaAtual();
    DB = dbVazio((c && c.nome) || "Eu"); DB.ui.theme = tema; save(); aplicaTema(); ir("guarda");
    toast("Guarda-roupa vazio. Cadastre as suas peças.");
  },
};

/* chips */
const CHIPS = {
  "f-slot": (v) => { FILTRO.slot = v; render(); },
  insp: (v) => { INSP_FILTRO = v; render(); },
  "b-ocasiao": (v) => { BUILDER.ctx.ocasiao = BUILDER.ctx.ocasiao === v ? "" : v; render(); },
  "b-estilo": (v) => { BUILDER.ctx.estilo = BUILDER.ctx.estilo === v ? "" : v; render(); },
  "b-clima": (v) => { BUILDER.ctx.clima = BUILDER.ctx.clima === v ? "" : v; render(); },
  "m-clima": (v) => { colheFormPeca(); toggle(FORM.climas, v); desenhaFormPeca(); },
  "m-ocasiao": (v) => { colheFormPeca(); toggle(FORM.ocasioes, v); desenhaFormPeca(); },
  "status-peca": (v) => { const it = item(ROTA.arg); if (it) { it.status = v; if (v !== "arquivada") it.destino = ""; save(); render(); } },
  "destino-peca": (v) => { const it = item(ROTA.arg); if (it) { it.destino = it.destino === v ? "" : v; save(); render(); } },
  "estilo-perfil": (v) => { P().estilos = P().estilos || []; toggle(P().estilos, v); save(); render(); },
  tema: (v) => { DB.ui.theme = v; CONTAS.ui.theme = v; salvaContas(); save(); aplicaTema(); render(); },
  perm: (v) => { DB.resp.perms[v] = !DB.resp.perms[v]; save(); render(); },
};
function toggle(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }

/* ===================== EVENTOS ===================== */
document.addEventListener("click", (e) => {
  const alvo = (sel) => e.target.closest(sel);
  const ov = alvo(".ov");
  if (ov && e.target === ov) { fechaModal(); return; }

  const a = alvo("[data-act]");
  if (a) { const fn = ACOES[a.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(a)).catch(() => toast("Algo deu errado nessa ação.")); return; } }

  const c = alvo("[data-chip]");
  if (c) { const fn = CHIPS[c.dataset.chip]; if (fn) { fn(c.dataset.val); return; } }

  const q = alvo("[data-pergunta]");
  if (q) { perguntar(q.dataset.pergunta); return; }

  const dia = alvo("[data-dia]");
  if (dia) { abrePlanejar(dia.dataset.dia); return; }

  const sl = alvo("[data-slot]");
  if (sl) { abrePicker(sl.dataset.slot); return; }

  const pc = alvo("[data-peca]");
  if (pc) { ir("peca", pc.dataset.peca); return; }

  const tb = alvo("[data-tab]");
  if (tb) { ir(tb.dataset.tab); return; }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "busca") { FILTRO.q = el.value; clearTimeout(render._t); render._t = setTimeout(render, 220); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.sel) { FILTRO[el.dataset.sel] = el.value; render(); return; }
  if (el.dataset && el.dataset.f === "cat" && FORM) {   // categoria nova → clima/ocasião padrão
    const antes = FORM.cat;
    colheFormPeca();
    if (antes !== FORM.cat) {
      FORM.climas = defaultClimas(FORM.cat);
      FORM.ocasioes = defaultOcasioes(FORM.cat, FORM.estilo);
      if (FORM._auto) FORM.nome = CATS[FORM.cat].label + " " + corLabel(FORM.cor).toLowerCase();
      desenhaFormPeca();
    }
    return;
  }
  if (el.id === "fotoInp" && el.files && el.files[0]) {
    processaFoto(el.files[0], (dataUrl, cor) => {
      if (!dataUrl) { toast("Não consegui ler essa imagem."); return; }
      FORM.foto = dataUrl;
      if (cor) { FORM.cor = cor; if (!FORM.nome) { FORM.nome = CATS[FORM.cat].label + " " + corLabel(cor).toLowerCase(); FORM._auto = true; } }
      desenhaFormPeca();
      toast(cor ? "Foto adicionada. Sugeri a cor " + corLabel(cor).toLowerCase() + " — confira e ajuste." : "Foto adicionada.");
    });
    return;
  }
  if (el.id === "fileImp" && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const novo = JSON.parse(fr.result);
        if (!novo.perfis || !novo.perfis.length) throw new Error("formato");
        DB = novo; save(); aplicaTema(); ir("inicio"); toast("Backup importado.");
      } catch (err) { toast("Arquivo inválido."); }
    };
    fr.readAsText(el.files[0]);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && MODAL) { fechaModal(); return; }
  if (e.key === "Enter") {
    if (e.target.id === "perg") { const v = e.target.value; e.target.value = ""; perguntar(v); }
    if (e.target.id === "pin") ACOES.entrarResp(e.target);
    if (e.target.id === "nomeLook") { BUILDER.nome = e.target.value; ACOES.salvarLook(); }
  }
});
window.addEventListener("hashchange", () => { const r = lerHash(); if (r.tab !== ROTA.tab || r.arg !== ROTA.arg) { ROTA = r; render(); } });

$("#themeBtn").onclick = () => {
  giraTema();
  toast("Tema: " + { auto: "automático", light: "claro", dark: "escuro" }[temaAtual()]);
};
$("#whoBtn").onclick = () => ir("perfil");

/* ===================== INÍCIO ===================== */
carregaContas();
aplicaTema();
TrendSource.fetch().then((d) => { TRENDS = d; if (DB && ROTA.tab === "tendencias") render(); }).catch(() => { });

(function iniciar() {
  const logado = CONTAS.sessao && contaAtual() && carregaDados(CONTAS.sessao);
  if (logado) {
    DB.ui = DB.ui || { theme: CONTAS.ui.theme || "auto" };
    aplicaTema();
    ROTA = lerHash();
    render();
  } else {
    if (CONTAS.sessao) { CONTAS.sessao = ""; salvaContas(); }   // sessão órfã
    AUTH.modo = CONTAS.contas.length ? "entrar" : "criar";
  }
  const sp = $("#splash");
  let fechado = false;                     // toque + tempo não podem redesenhar duas vezes
  const fim = () => {
    if (fechado) return;
    fechado = true;
    sp.classList.add("gone");
    if (!DB) desenhaAuth();
  };
  sp.addEventListener("click", fim);
  setTimeout(fim, 1500);
})();
</script>
</body>
</html>
