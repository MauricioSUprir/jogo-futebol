<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<title>LookLab — seu estilista digital</title>
<meta name="description" content="Guarda-roupa digital e criador de looks para crianças e adolescentes." />
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="LookLab" />
<style>
  :root{
    color-scheme: light;
    --bg:#f6f6f8; --bg2:#eeeef2; --card:#ffffff; --card2:#fafafc;
    --text:#0b0b0d; --text2:#4b4b55; --muted:#8a8a96;
    --line:#e4e4ea; --line2:#d6d6de;
    --acc:#7c3aed; --acc2:#a855f7; --acc-soft:#f1e9ff; --on-acc:#ffffff;
    --good:#12a150; --warn:#e0a107; --bad:#dc3545;
    --shadow:0 1px 2px rgba(11,11,13,.05), 0 12px 32px rgba(11,11,13,.06);
    --shadow-lg:0 20px 60px rgba(11,11,13,.16);
    --r:18px; --r-sm:12px;
  }
  :root[data-theme="dark"], :root:where(:not([data-theme="light"])){}
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:#0b0b0d; --bg2:#141418; --card:#17171c; --card2:#1e1e24;
      --text:#ffffff; --text2:#c6c6d0; --muted:#83838f;
      --line:#28282f; --line2:#35353e;
      --acc:#a855f7; --acc2:#7c3aed; --acc-soft:#241a3a; --on-acc:#ffffff;
      --good:#2ecc71; --warn:#f5c542; --bad:#ff6b6b;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.45);
      --shadow-lg:0 24px 70px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b0b0d; --bg2:#141418; --card:#17171c; --card2:#1e1e24;
    --text:#ffffff; --text2:#c6c6d0; --muted:#83838f;
    --line:#28282f; --line2:#35353e;
    --acc:#a855f7; --acc2:#7c3aed; --acc-soft:#241a3a; --on-acc:#ffffff;
    --good:#2ecc71; --warn:#f5c542; --bad:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.45);
    --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); line-height:1.5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--acc)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 16px 120px}

  /* ---------- splash ---------- */
  #splash{position:fixed;inset:0;z-index:200;background:#0b0b0d;display:grid;place-items:center;
    gap:20px;grid-auto-flow:row;cursor:pointer;transition:opacity .45s ease,visibility .45s ease}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash img{width:min(46vw,170px);height:auto;border-radius:34px;
    filter:drop-shadow(0 18px 50px rgba(168,85,247,.35)); animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
  #splash .nm{color:#fff;font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0;text-align:center}
  #splash .nm span{color:#c084fc}
  #splash .tag{color:#9b9baa;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:650;text-align:center}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion: reduce){#splash img{animation:none}}

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
  .top .row{max-width:1160px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{width:38px;height:38px;border-radius:11px;display:block;box-shadow:var(--shadow)}
  .brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
  .brand h1 span{color:var(--acc)}
  .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
  .iconbtn:hover{border-color:var(--line2)}
  .who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:4px 12px 4px 4px;box-shadow:var(--shadow);max-width:190px}
  .who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:var(--acc-soft);border:1px solid var(--line)}
  .who .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .cx{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .who .txt{min-width:0;text-align:left;line-height:1.15}

  /* ---------- nav ---------- */
  nav.tabs{position:sticky;top:61px;z-index:39;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
  nav.tabs .in{max-width:1160px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;
    scrollbar-width:none}
  nav.tabs .in::-webkit-scrollbar{display:none}
  nav.tabs button{border:1px solid transparent;background:transparent;color:var(--text2);
    padding:8px 14px;border-radius:11px;font-size:13.5px;font-weight:650;white-space:nowrap;
    display:flex;align-items:center;gap:7px}
  nav.tabs button:hover{background:var(--bg2);color:var(--text)}
  nav.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  nav.tabs button.locked{opacity:.45}

  /* ---------- blocos ---------- */
  .hero{margin:22px 0 18px}
  .hero h2{margin:0;font-size:clamp(24px,5.4vw,34px);font-weight:820;letter-spacing:-.035em}
  .hero p{margin:5px 0 0;color:var(--muted);font-size:14px}
  .sec{margin:26px 0 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .sec h3{margin:0;font-size:17px;font-weight:780;letter-spacing:-.02em}
  .sec p{margin:0;color:var(--muted);font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:900px){.g4,.g5{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.g4,.g5,.g3{grid-template-columns:repeat(2,1fr)}}
  .split{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
  @media(max-width:880px){.split{grid-template-columns:1fr}}

  /* stat tiles */
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:26px;font-weight:820;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat .d{font-size:11.5px;color:var(--muted);margin-top:2px}

  /* botoes */
  .btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 15px;
    font-size:13.5px;font-weight:680;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  .btn:hover{border-color:var(--line2)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
  .btn.pri:hover{filter:brightness(1.07)}
  .btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
  .btn.big{padding:14px 22px;font-size:15px;border-radius:14px}
  .btn.block{width:100%;justify-content:center}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}

  /* chips */
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;
    font-size:12.5px;font-weight:650;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--line2);color:var(--text)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
  .chip.on.soft{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 32%,transparent)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:680;padding:3px 9px;
    border-radius:999px;background:var(--bg2);color:var(--text2);border:1px solid var(--line)}
  .tag.acc{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 28%,transparent)}
  .tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
  .tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}

  /* form */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:680;color:var(--text2)}
  .inp, select.inp, textarea.inp{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:14px;width:100%;outline:none}
  .inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  textarea.inp{resize:vertical;min-height:76px}
  .hint{font-size:11.5px;color:var(--muted)}

  /* peca (card de roupa) */
  .piece{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;text-align:left;padding:0}
  .piece:hover{border-color:var(--line2);transform:translateY(-2px);transition:transform .15s ease}
  .thumb{aspect-ratio:1/1;display:grid;place-items:center;font-size:44px;position:relative;overflow:hidden;
    background:var(--bg2)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .swatch{position:absolute;left:9px;bottom:9px;width:16px;height:16px;border-radius:5px;
    border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.28)}
  .thumb .badge{position:absolute;right:8px;top:8px;font-size:10px;font-weight:750;padding:3px 8px;
    border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);
    backdrop-filter:blur(6px)}
  .piece .info{padding:10px 12px 12px}
  .piece .nm{font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .piece .mt{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  .piece.mini .thumb{font-size:30px}
  .piece.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}

  /* look card */
  .look{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .look .strip{display:flex;gap:0;background:var(--bg2)}
  .look .strip .sl{flex:1;aspect-ratio:1/1;display:grid;place-items:center;font-size:32px;
    border-right:1px solid var(--line);position:relative;overflow:hidden}
  .look .strip .sl:last-child{border-right:0}
  .look .strip .sl img{width:100%;height:100%;object-fit:cover}
  .look .bd{padding:13px 14px}
  .look h4{margin:0 0 3px;font-size:15px;font-weight:760;letter-spacing:-.02em}
  .look .why{font-size:12.5px;color:var(--text2);margin:8px 0 0;line-height:1.45}

  /* barras de avaliacao */
  .scores{display:flex;flex-direction:column;gap:9px}
  .score .lb{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:10px}
  .score .lb b{font-weight:680}
  .score .lb i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:999px;background:var(--acc)}

  /* paleta */
  .pal{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .pal span{display:block;height:100%}
  .pal-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:11px;font-size:12px;color:var(--text2)}
  .pal-legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:6px;
    border:1px solid var(--line);vertical-align:-1px}

  /* calendario */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
  .cal .day{aspect-ratio:.86;border:1px solid var(--line);background:var(--card2);border-radius:12px;
    padding:6px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;font-size:11px}
  .cal .day:hover{border-color:var(--acc)}
  .cal .day.off{opacity:.32;pointer-events:none}
  .cal .day.today{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 20%,transparent)}
  .cal .day .n{font-weight:750;font-size:12px}
  .cal .day .mini{font-size:15px;line-height:1.05;letter-spacing:-1px}
  .cal .day .oc{font-size:9.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal .day .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}

  /* trend */
  .trend{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .trend:last-child{border-bottom:0}
  .trend .ic{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:19px;flex:none}
  .trend .mid{flex:1;min-width:0}
  .trend .nm{font-size:13.5px;font-weight:720}
  .trend .sub{font-size:11.5px;color:var(--muted)}
  .meter{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:-.5px;color:var(--acc)}

  /* mensagens do estilista */
  .msgs{display:flex;flex-direction:column;gap:12px}
  .msg{max-width:min(680px,92%);padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.5}
  .msg.me{align-self:flex-end;background:var(--acc);color:var(--on-acc);border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;
    box-shadow:var(--shadow);max-width:min(760px,100%);width:100%}
  .msg.ai .hdr{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;color:var(--acc);margin-bottom:8px}

  /* modal */
  .ov{position:fixed;inset:0;z-index:150;background:rgba(6,6,10,.62);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  @media(min-width:700px){.ov{align-items:center;padding:24px}}
  .modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:620px;max-height:92vh;
    overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg)}
  @media(min-width:700px){.modal{border-radius:22px}}
  .modal .mh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
    padding:15px 18px;display:flex;align-items:center;gap:12px;z-index:2}
  .modal .mh h3{margin:0;font-size:16px;font-weight:780;letter-spacing:-.02em;flex:1}
  .modal .mb{padding:16px 18px}
  .modal .mf{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:13px 18px;display:flex;gap:9px;justify-content:flex-end}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:300;opacity:0;
    background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;
    font-weight:680;box-shadow:var(--shadow-lg);transition:.25s ease;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* misc */
  .empty{text-align:center;padding:38px 18px;color:var(--muted)}
  .empty .em{font-size:38px;margin-bottom:8px}
  .empty h4{margin:0 0 5px;font-size:15px;color:var(--text);font-weight:740}
  .empty p{margin:0 auto;font-size:13px;max-width:380px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .list{display:flex;flex-direction:column}
  .li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .li .em{width:38px;height:38px;border-radius:11px;background:var(--bg2);display:grid;place-items:center;
    font-size:19px;flex:none;overflow:hidden}
  .li .em img{width:100%;height:100%;object-fit:cover}
  .li .t{flex:1;min-width:0}
  .li .t b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .t span{font-size:11.5px;color:var(--muted)}
  .li .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .note{background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 22%,transparent);
    border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--text2);line-height:1.5}
  .note b{color:var(--text)}
  .ach{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
  .ach.off{opacity:.5}
  .ach .e{font-size:22px}
  .ach .t b{display:block;font-size:13px;font-weight:730}
  .ach .t span{font-size:11.5px;color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- login ---------- */
  #auth{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;overflow:auto;
    padding:max(28px,env(safe-area-inset-top)) 18px 40px}
  #auth.on{display:block}
  .auth{max-width:420px;margin:0 auto}
  .auth .mark{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px;text-align:center}
  .auth .mark img{width:72px;height:72px;border-radius:20px;box-shadow:var(--shadow)}
  .auth .mark h1{margin:0;font-size:26px;font-weight:820;letter-spacing:-.035em}
  .auth .mark h1 span{color:var(--acc)}
  .auth .mark p{margin:0;font-size:13px;color:var(--muted)}
  .auth .seg2{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:4px;margin-bottom:16px}
  .auth .seg2 button{flex:1;border:0;background:transparent;color:var(--text2);padding:9px;border-radius:10px;font-size:13.5px;font-weight:700}
  .auth .seg2 button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
  .auth form{display:flex;flex-direction:column;gap:12px}
  .auth .erro{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid color-mix(in srgb,var(--bad) 34%,transparent);
    color:var(--bad);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600}
  .auth .ok{background:color-mix(in srgb,var(--good) 12%,transparent);border:1px solid color-mix(in srgb,var(--good) 34%,transparent);
    color:var(--good);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600}
  .auth .linha{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2)}
  .auth .linha input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
  .auth .rodape{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55;text-align:center}

<script>
"use strict";
/* ===================== utilidades ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const BRL = (n) => "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const BRL0 = (n) => "R$ " + Math.round(Number(n) || 0).toLocaleString("pt-BR");
const MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const MES3 = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const DOW = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const hoje = () => iso(new Date());
const fromISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const diasEntre = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 86400000);
const plural = (n, s, p) => n + " " + (n === 1 ? s : (p || s + "s"));
function dataCurta(s) { const d = fromISO(s); return d.getDate() + " " + MES3[d.getMonth()]; }
function dataLonga(s) { const d = fromISO(s); return d.getDate() + " de " + MES[d.getMonth()] + " de " + d.getFullYear(); }
function haQuanto(s) {
  if (!s) return "nunca usada";
  const d = diasEntre(s, hoje());
  if (d <= 0) return "hoje";
  if (d === 1) return "ontem";
  if (d < 30) return "há " + d + " dias";
  if (d < 60) return "há 1 mês";
  return "há " + Math.round(d / 30) + " meses";
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400);
}
function rngFrom(seed) { let s = seed; return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }
const pick = (arr, r) => arr[Math.floor((r ? r() : Math.random()) * arr.length) % arr.length];
function shuffle(arr, r) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((r ? r() : Math.random()) * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ===================== cores ===================== */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
const COLOR_HSL = {};
COLOR_KEYS.forEach((k) => { COLOR_HSL[k] = rgb2hsl(...hex2rgb(COLORS[k].hex)); });
const isNeutro = (k) => COLORS[k] && COLORS[k].kind === "neutro";
function hueDist(a, b) { const d = Math.abs(COLOR_HSL[a][0] - COLOR_HSL[b][0]) % 360; return d > 180 ? 360 - d : d; }

/* Harmonia entre um conjunto de cores: 0..100 + explicação.
   Regras: neutros combinam com tudo; cores próximas (análogas) ou opostas

function harmoniaCores(keys) {

    const temOuter = its.some((i) => slotOf(i) === "outer");
    if (precisaCasaco(ctx.clima) && !temOuter) { cl = Math.max(15, cl - 30); }
    if (proibeCasaco(ctx.clima) && temOuter) { cl = Math.max(15, cl - 25); }
    clTxt = cl >= 85 ? "As peças combinam com o clima " + ctx.clima + "."
      : precisaCasaco(ctx.clima) && !temOuter ? "Está frio e falta uma peça de agasalho por cima."
        : proibeCasaco(ctx.clima) && temOuter ? "Está quente para usar casaco."
          : "Algumas peças não são as ideais para esse clima.";
  }
  const geral = Math.round((h.nota + hp + oc + cl) / 4);
  return {
    geral,
    itens: [
      { k: "🎨 Combinação de cores", v: h.nota, txt: h.txt },
      { k: "👕 Harmonia das peças", v: hp, txt: hpTxt },
      { k: "🎯 Adequado à ocasião", v: oc, txt: ocTxt },
      { k: "🌤️ Adequado ao clima", v: cl, txt: clTxt },
    ],
  };
}
const nivelTxt = (v) => (v >= 88 ? "ótima" : v >= 72 ? "boa" : v >= 55 ? "razoável" : "difícil");

/* Explicação curta do look, em linguagem simples */
function explicaLook(its, ctx) {
  const cores = [...new Set(coresDoLook(its))];
  const h = harmoniaCores(cores);
  const partes = [h.txt];
  if (ctx && ctx.ocasiao) partes.push("Para " + OCCASIONS[ctx.ocasiao].label.toLowerCase() + ", as peças escolhidas são confortáveis e fáceis de usar o dia todo.");
  if (ctx && ctx.clima === "frio") partes.push("O casaco garante o agasalho para o frio.");
  if (ctx && ctx.clima === "quente") partes.push("São peças leves, boas para o calor.");
  if (ctx && ctx.clima === "chuva") partes.push("O calçado fechado ajuda em dia de chuva.");
  const esquecida = its.find((i) => { const u = ultimoUso(i); return !u || diasEntre(u, hoje()) > 30; });
  if (esquecida) partes.push("Aproveita para usar " + primeiraMinuscula(esquecida.nome) + ", que estava parada faz tempo.");
  return partes.join(" ");
}
const primeiraMinuscula = (s) => (s ? s[0].toLowerCase() + s.slice(1) : s);

/* Gera N looks distintos a partir do guarda-roupa */
function geraLooks(ctx, n) {
  ctx = ctx || {}; n = n || 3;
  const disp = itens().filter((i) => i.status !== "arquivada");
  const porSlot = { outer: [], top: [], bottom: [], shoes: [], acc: [], full: [] };
  disp.forEach((i) => { const s = slotOf(i); if (porSlot[s]) porSlot[s].push(i); });
  const ordena = (arr) => arr.map((i) => ({ i, s: pontuaItem(i, ctx) + Math.random() * 8 })).sort((a, b) => b.s - a.s);
  const topN = (arr, k) => ordena(arr).slice(0, k).map((x) => x.i);

  const tops = topN(porSlot.top, 7), bottoms = topN(porSlot.bottom, 7);
  const fulls = topN(porSlot.full, 3), shoes = topN(porSlot.shoes, 5);
  const outers = topN(porSlot.outer, 4), accs = topN(porSlot.acc, 5);

  const bases = [];
  tops.forEach((t) => bottoms.forEach((b) => bases.push([t, b])));
  fulls.forEach((f) => bases.push([f]));
  if (!bases.length) return [];

  const cands = [];
  bases.forEach((base) => {
    (shoes.length ? shoes : [null]).forEach((sh) => {
      const combos = [[]];
      if (!proibeCasaco(ctx.clima)) outers.slice(0, precisaCasaco(ctx.clima) ? 3 : 2).forEach((o) => combos.push([o]));
      if (precisaCasaco(ctx.clima) && outers.length) combos.shift();
      combos.forEach((extra) => {
        const semAcc = base.concat(sh ? [sh] : [], extra);
        const opcoesAcc = [null].concat(accs.slice(0, 3));
        opcoesAcc.forEach((ac) => {
          const its = ac ? semAcc.concat([ac]) : semAcc;
          if (its.length < 2) return;
          const av = avaliaLook(its, ctx);
          const base2 = its.reduce((a, i) => a + pontuaItem(i, ctx), 0) / its.length;
          cands.push({ its, av, score: av.geral * 1.5 + base2 * 0.7 + (ac ? 3 : 0) + Math.random() * 4 });
        });
      });
    });
  });
  cands.sort((a, b) => b.score - a.score);

  const out = [];
  for (const c of cands) {
    if (out.length >= n) break;
    const ids = new Set(c.its.map((i) => i.id));
    const repetido = out.some((o) => {
      const oi = new Set(o.its.map((i) => i.id));
      let comum = 0; ids.forEach((x) => { if (oi.has(x)) comum++; });
      return comum >= Math.min(ids.size, oi.size) - 1;
    });
    if (!repetido) out.push(c);
  }
  return out;
}

/* “Combina melhor com” — melhores parceiras de uma peça */
function combinaCom(it, k) {
  const alvo = itens().filter((o) => o.id !== it.id && slotVisual(o) !== slotVisual(it));
  const scored = alvo.map((o) => {
    const h = harmoniaCores([it.cor, it.cor2, o.cor, o.cor2].filter(Boolean));
    let s = h.nota;
    if (o.estilo === it.estilo) s += 14;
    const oc = (it.ocasioes || []).filter((x) => (o.ocasioes || []).includes(x)).length;
    s += Math.min(12, oc * 3);
    const cl = (it.climas || []).filter((x) => (o.climas || []).includes(x)).length;
    s += Math.min(8, cl * 3);
    if (slotOf(o) === "acc") s -= 6;
    return { o, s };
  }).sort((a, b) => b.s - a.s);
  const vistos = new Set(); const out = [];
  for (const x of scored) {
    const sl = slotVisual(x.o);
    if (out.filter((y) => slotVisual(y.o) === sl).length >= 2) continue;
    if (vistos.has(x.o.id)) continue;
    vistos.add(x.o.id); out.push(x);
    if (out.length >= (k || 4)) break;
  }
  return out.map((x) => x.o);
}

/* Quantas peças do guarda-roupa combinam com uma peça hipotética (lista de desejos) */
function combinaComHipotetica(d) {
  const fake = { id: "_", cor: d.cor, cor2: "", cat: d.cat, estilo: d.estilo || "casual", ocasioes: defaultOcasioes(d.cat, d.estilo), climas: defaultClimas(d.cat) };
  const alvo = itens().filter((o) => slotVisual(o) !== slotVisual(fake));
  return alvo.filter((o) => harmoniaCores([fake.cor, o.cor, o.cor2].filter(Boolean)).nota >= 80).length;
}
function parecidasCom(d) {
  return itens().filter((o) => o.cat === d.cat && o.cor === d.cor);
}

/* Lacunas do guarda-roupa */
function analisaLacunas() {
  const its = itens();
  const porSlot = {};
  SLOT_ORDER.concat(["full"]).forEach((s) => (porSlot[s] = 0));
  its.forEach((i) => { porSlot[slotOf(i)] = (porSlot[slotOf(i)] || 0) + 1; });
  const out = [];
  const nTop = porSlot.top + porSlot.full, nBot = porSlot.bottom + porSlot.full;
  if (nTop && nBot && nTop > nBot * 2.5) out.push({ tipo: "equilíbrio", txt: "Você tem " + plural(nTop, "peça de cima", "peças de cima") + " para " + plural(nBot, "peça de baixo", "peças de baixo") + ". Mais uma peça de baixo neutra multiplicaria as combinações." });
  if (!porSlot.outer) out.push({ tipo: "falta", txt: "Não há nenhuma peça de agasalho cadastrada. Uma jaqueta neutra fecha os looks de frio." });
  else if (porSlot.outer === 1) out.push({ tipo: "falta", txt: "Só há um agasalho no guarda-roupa. Um segundo em cor neutra daria mais variedade nos dias frios." });
  if (porSlot.shoes < 2) out.push({ tipo: "falta", txt: "Com só " + plural(porSlot.shoes, "calçado") + ", quase todo look repete o mesmo pé. Um tênis neutro resolveria." });
  const neutros = its.filter((i) => isNeutro(i.cor)).length;
  if (its.length >= 8 && neutros / its.length < 0.35) out.push({ tipo: "cor", txt: "A maior parte das peças é colorida. Peças em tom neutro (preto, branco, bege, jeans) combinam com o que você já tem e criam muitos looks novos." });
  const arrumadas = its.filter((i) => dressyDoItem(i) >= 2).length;
  if (arrumadas === 0) out.push({ tipo: "ocasião", txt: "Não há peça mais arrumada cadastrada. Uma camisa ou um sapato resolveria festa, igreja e restaurante." });
  if (!out.length) out.push({ tipo: "ok", txt: "O guarda-roupa está equilibrado: dá para montar looks para todas as ocasiões cadastradas sem comprar nada agora." });
  return out;
}

/* Paleta de cores do guarda-roupa */
function paleta() {
  const its = itens(); const m = {};
  its.forEach((i) => { if (i.cor) m[i.cor] = (m[i.cor] || 0) + 1; });
  const total = Object.values(m).reduce((a, b) => a + b, 0) || 1;
  return Object.keys(m).map((k) => ({ k, n: m[k], pct: Math.round((m[k] / total) * 100) })).sort((a, b) => b.n - a.n);
}
function esquecidas(dias) {
  const lim = dias || 30;
  return itens().filter((i) => { const u = ultimoUso(i); return !u || diasEntre(u, hoje()) >= lim; })
    .sort((a, b) => { const ua = ultimoUso(a) || "0000-00-00", ub = ultimoUso(b) || "0000-00-00"; return ua < ub ? -1 : 1; });
}

function calculaDesafios() {

<script>
"use strict";
/* ===================== GUARDA-ROUPA ===================== */
let FILTRO = { q: "", slot: "", cor: "", estilo: "", ocasiao: "", status: "ativas", ordem: "recente" };
function filtraItens() {
  let arr = todosItens();
  arr = arr.filter((i) => (FILTRO.status === "todas" ? true : FILTRO.status === "arquivadas" ? i.status === "arquivada" : i.status !== "arquivada"));
  if (FILTRO.slot) arr = arr.filter((i) => (FILTRO.slot === "full" ? slotOf(i) === "full" : slotVisual(i) === FILTRO.slot));
  if (FILTRO.cor) arr = arr.filter((i) => i.cor === FILTRO.cor || i.cor2 === FILTRO.cor);
  if (FILTRO.estilo) arr = arr.filter((i) => i.estilo === FILTRO.estilo);
  if (FILTRO.ocasiao) arr = arr.filter((i) => (i.ocasioes || []).includes(FILTRO.ocasiao));
  if (FILTRO.q) {
    const q = FILTRO.q.toLowerCase();
    arr = arr.filter((i) => (i.nome + " " + i.marca + " " + i.cat + " " + corLabel(i.cor)).toLowerCase().includes(q));
  }
  const ord = {
    recente: (a, b) => (b.criado || "").localeCompare(a.criado || ""),
    uso: (a, b) => (ultimoUso(b) || "").localeCompare(ultimoUso(a) || ""),
    esquecidas: (a, b) => (ultimoUso(a) || "0").localeCompare(ultimoUso(b) || "0"),
    nome: (a, b) => a.nome.localeCompare(b.nome, "pt-BR"),
  };
  return arr.sort(ord[FILTRO.ordem] || ord.recente);
}
function viewGuarda() {
  const arr = filtraItens();
  const total = itens().length;
  const slotChips = { "": { label: "Tudo", emoji: "🗂" }, top: { label: "Cima", emoji: "👕" }, bottom: { label: "Baixo", emoji: "👖" }, full: { label: "Peça única", emoji: "👗" }, outer: { label: "Casacos", emoji: "🧥" }, shoes: { label: "Calçados", emoji: "👟" }, acc: { label: "Acessórios", emoji: "🧢" } };
  return '' +
    '<section class="hero"><h2>Guarda-roupa</h2><p>' + plural(total, "peça") + " ativa" + (total === 1 ? "" : "s") +
    (todosItens().length - total ? " · " + (todosItens().length - total) + " arquivada(s)" : "") + "</p></section>" +

    '<div class="row" style="margin-bottom:12px">' +
    (podeCadastrar() ? '<button class="btn pri" data-act="novaPeca">＋ Adicionar peça</button>' +
      '<button class="btn" data-act="novaPecaFoto">📸 Adicionar por foto</button>' : '<span class="hint">O cadastro de peças está com o responsável.</span>') +
    '<div class="spacer" style="flex:1"></div>' +
    '<input class="inp" id="busca" placeholder="Buscar peça…" value="' + esc(FILTRO.q) + '" style="max-width:220px" />' +
    "</div>" +

    '<div class="chips" style="margin-bottom:8px">' + chipsHTML(slotChips, FILTRO.slot, "f-slot") + "</div>" +
    '<div class="row" style="gap:8px;margin-bottom:14px">' +
    '<select class="inp" data-sel="cor" style="max-width:150px"><option value="">Todas as cores</option>' +
    COLOR_KEYS.map((k) => '<option value="' + k + '"' + (FILTRO.cor === k ? " selected" : "") + ">" + COLORS[k].label + "</option>").join("") + "</select>" +
    '<select class="inp" data-sel="estilo" style="max-width:150px"><option value="">Todos os estilos</option>' +
    STYLE_KEYS.map((k) => '<option value="' + k + '"' + (FILTRO.estilo === k ? " selected" : "") + ">" + STYLES[k].label + "</option>").join("") + "</select>" +
    '<select class="inp" data-sel="ocasiao" style="max-width:160px"><option value="">Todas as ocasiões</option>' +
    OCC_KEYS.map((k) => '<option value="' + k + '"' + (FILTRO.ocasiao === k ? " selected" : "") + ">" + OCCASIONS[k].label + "</option>").join("") + "</select>" +
    '<select class="inp" data-sel="ordem" style="max-width:170px">' +
    [["recente", "Cadastradas recentemente"], ["uso", "Usadas recentemente"], ["esquecidas", "Esquecidas primeiro"], ["nome", "Nome (A–Z)"]]
      .map((o) => '<option value="' + o[0] + '"' + (FILTRO.ordem === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" +
    '<select class="inp" data-sel="status" style="max-width:140px">' +
    [["ativas", "No armário"], ["arquivadas", "Arquivadas"], ["todas", "Todas"]]
      .map((o) => '<option value="' + o[0] + '"' + (FILTRO.status === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select>" +
    "</div>" +

    (arr.length
      ? '<div class="grid g5">' + arr.map((i) => pecaCard(i, { uso: true })).join("") + "</div>"
      : vazio("🔍", "Nada por aqui", "Nenhuma peça com esses filtros. Tente limpar a busca ou trocar a categoria.",
        '<button class="btn" data-act="limparFiltro">Limpar filtros</button>'));
}

/* ===================== PÁGINA DA PEÇA ===================== */
function viewPeca(id) {
  const it = item(id);
  if (!it) return vazio("❓", "Peça não encontrada", "Ela pode ter sido removida.", '<button class="btn" data-tab="guarda">Voltar ao guarda-roupa</button>');
  const usosLooks = looks().filter((l) => l.itens.includes(it.id));
  const parceiras = combinaCom(it, 4);
  const u = ultimoUso(it);
  const cnt = (it.usos || []).length;
  return '' +
    '<div class="row" style="margin:18px 0 12px"><button class="btn sm ghost" data-tab="guarda">← Guarda-roupa</button></div>' +
    '<div class="split">' +
    '<div class="card" style="overflow:hidden">' +
    '<div style="aspect-ratio:4/3;background:color-mix(in srgb,' + corHex(it) + ' 12%, var(--bg2));display:grid;place-items:center;font-size:88px;position:relative">' +
    (it.foto ? '<img src="' + it.foto + '" alt="" style="width:100%;height:100%;object-fit:cover" />' : emojiOf(it)) + "</div>" +
    '<div class="pad">' +
    '<h2 style="margin:0;font-size:24px;font-weight:820;letter-spacing:-.03em">' + esc(it.nome || CATS[it.cat].label) + "</h2>" +
    '<div class="chips" style="margin-top:10px">' +
    '<span class="tag acc">' + emojiOf(it) + " " + CATS[it.cat].label + "</span>" +
    '<span class="tag"><i style="width:9px;height:9px;border-radius:3px;background:' + corHex(it) + ';display:inline-block"></i> ' + corLabel(it.cor) + "</span>" +
    (it.cor2 ? '<span class="tag"><i style="width:9px;height:9px;border-radius:3px;background:' + (COLORS[it.cor2] || {}).hex + ';display:inline-block"></i> ' + corLabel(it.cor2) + "</span>" : "") +
    (it.marca ? '<span class="tag">🏷 ' + esc(it.marca) + "</span>" : "") +
    (it.estampa && it.estampa !== "liso" ? '<span class="tag">' + esc(it.estampa) + "</span>" : "") +
    (it.material ? '<span class="tag">' + esc(it.material) + "</span>" : "") +
    (it.tamanho ? '<span class="tag">tam. ' + esc(it.tamanho) + "</span>" : "") +
    '<span class="tag">' + (STYLES[it.estilo] ? STYLES[it.estilo].emoji + " " + STYLES[it.estilo].label : esc(it.estilo)) + "</span>" +
    (it.climas || []).map((c) => '<span class="tag">' + CLIMAS[c].emoji + " " + CLIMAS[c].label + "</span>").join("") +
    "</div>" +
    '<div class="chips" style="margin-top:8px">' + (it.ocasioes || []).map((o) => '<span class="tag">' + (OCCASIONS[o] || {}).emoji + " " + (OCCASIONS[o] || { label: o }).label + "</span>").join("") + "</div>" +
    '<div class="grid g3" style="margin-top:16px">' +
    '<div class="stat"><div class="k">📊 Usada em</div><div class="v">' + usosLooks.length + '</div><div class="d">looks salvos</div></div>' +
    '<div class="stat"><div class="k">🔁 Registros de uso</div><div class="v">' + cnt + '</div><div class="d">' + haQuanto(u) + "</div></div>" +
    (podeVerPrecos() && it.preco ? '<div class="stat"><div class="k">💰 Preço</div><div class="v" style="font-size:20px">' + BRL0(it.preco) + '</div><div class="d">' + (it.compra ? "comprada em " + dataCurta(it.compra) : "") + "</div></div>"
      : '<div class="stat"><div class="k">📅 Comprada</div><div class="v" style="font-size:20px">' + (it.compra ? dataCurta(it.compra) : "—") + '</div><div class="d">' + (it.compra ? fromISO(it.compra).getFullYear() : "sem data") + "</div></div>") +
    "</div>" +
    '<div class="row" style="margin-top:16px">' +
    '<button class="btn pri" data-act="lookCom" data-id="' + it.id + '">✨ Criar look com esta peça</button>' +
    '<button class="btn" data-act="usarHoje" data-ids="' + it.id + '">✅ Usei hoje</button>' +
    (podeCadastrar() ? '<button class="btn" data-act="editarPeca" data-id="' + it.id + '">✏️ Editar</button>' : "") +
    "</div></div></div>" +

    "<div>" +
    '<div class="card pad"><div class="sec" style="margin:0 0 10px"><h3>Combina melhor com</h3></div>' +
    (parceiras.length ? '<div class="grid g2">' + parceiras.map((o) => pecaCard(o, { mini: true })).join("") + "</div>"
      : '<p class="hint">Cadastre mais peças para ver combinações.</p>') + "</div>" +

    '<div class="card pad" style="margin-top:14px"><div class="sec" style="margin:0 0 10px"><h3>Ciclo da peça</h3><p>ativa → pouco usada → arquivada</p></div>' +
    '<div class="chips">' + chipsHTML({ ativa: { label: "Ativa", emoji: "✅" }, "pouco-usada": { label: "Pouco usada", emoji: "🕓" }, arquivada: { label: "Arquivada", emoji: "📦" } }, it.status, "status-peca") + "</div>" +
    (it.status === "arquivada"
      ? '<div style="margin-top:12px"><div class="hint" style="margin-bottom:6px">O que fazer com ela?</div>' +
      '<div class="chips">' + chipsHTML({ doar: { label: "Doar", emoji: "🎁" }, guardar: { label: "Guardar", emoji: "📦" }, passar: { label: "Passar para irmão(ã)", emoji: "👦" }, vender: { label: "Vender", emoji: "🏷" } }, it.destino, "destino-peca", true) + "</div></div>"
      : "") +
    (usosLooks.length ? '<div class="sec" style="margin:18px 0 8px"><h3>Looks com esta peça</h3></div><div class="list">' +
      usosLooks.slice(0, 6).map((l) => '<div class="li"><span class="em">' + (l.fav ? "⭐" : "🧩") + '</span><span class="t"><b>' + esc(l.nome) + "</b><span>" + (l.ocasiao ? OCCASIONS[l.ocasiao].label : "sem ocasião") + "</span></span>" +
        '<button class="btn sm" data-act="abrirLook" data-id="' + l.id + '">Ver</button></div>').join("") + "</div>" : "") +
    (podeCadastrar() ? '<div class="row" style="margin-top:16px"><button class="btn sm danger" data-act="excluirPeca" data-id="' + it.id + '">Excluir peça</button></div>' : "") +
    "</div></div></div>";
}
</script>

<script>
"use strict";
/* ===================== CRIAR LOOK ===================== */
let BUILDER = { slots: { outer: "", top: "", bottom: "", shoes: "", acc: "" }, ctx: { ocasiao: "", estilo: "", clima: "" }, nome: "", editId: null };
const builderItens = () => SLOT_ORDER.map((s) => BUILDER.slots[s]).filter(Boolean).map(item).filter(Boolean);
function setSlotComItem(it) {
  const s = slotVisual(it);
  BUILDER.slots[s] = it.id;
  if (slotOf(it) === "full") BUILDER.slots.bottom = "";
  const topIt = BUILDER.slots.top ? item(BUILDER.slots.top) : null;
  if (s === "bottom" && topIt && slotOf(topIt) === "full") BUILDER.slots.top = "";
}
function carregaLookNoBuilder(l) {
  BUILDER = { slots: { outer: "", top: "", bottom: "", shoes: "", acc: "" }, ctx: { ocasiao: l.ocasiao || "", estilo: l.estilo || "", clima: l.clima || "" }, nome: l.nome || "", editId: l.id };
  l.itens.map(item).filter(Boolean).forEach(setSlotComItem);
}
function viewCriar() {
  const its = builderItens();
  const av = its.length >= 2 ? avaliaLook(its, BUILDER.ctx) : null;
  const nomeAuto = its.length ? sugereNome(its, BUILDER.ctx) : "";
  return '' +
    '<section class="hero"><h2>Criar Look</h2><p>Escolha as peças ou peça para o LookLab montar em um toque.</p></section>' +

    '<div class="card pad" style="margin-bottom:14px">' +
    '<div class="sec" style="margin:0 0 10px"><h3>⚡ Monte meu look</h3><p>usa só o que já está no seu guarda-roupa</p></div>' +
    '<div class="hint" style="margin-bottom:6px">Ocasião</div><div class="chips" style="margin-bottom:10px">' + chipsHTML(OCCASIONS, BUILDER.ctx.ocasiao, "b-ocasiao", true) + "</div>" +
    '<div class="hint" style="margin-bottom:6px">Estilo</div><div class="chips" style="margin-bottom:10px">' + chipsHTML(STYLES, BUILDER.ctx.estilo, "b-estilo", true) + "</div>" +
    '<div class="hint" style="margin-bottom:6px">Clima</div><div class="chips" style="margin-bottom:14px">' + chipsHTML(CLIMAS, BUILDER.ctx.clima, "b-clima", true) + "</div>" +
    '<div class="row"><button class="btn pri big" data-act="gerarLook">✨ GERAR LOOK</button>' +
    '<button class="btn ghost sm" data-act="limparBuilder">Limpar</button></div>' +
    "</div>" +

    '<div class="split">' +
    "<div>" +
    '<div class="card pad">' +
    '<div class="sec" style="margin:0 0 12px"><h3>Montagem</h3><p>toque em cada espaço para escolher a peça</p></div>' +
    '<div class="grid g5">' + SLOT_ORDER.map((s) => {
      const id = BUILDER.slots[s], it = id ? item(id) : null;
      if (it) return '<button class="piece" data-slot="' + s + '">' + thumbHTML(it) +
        '<span class="info"><span class="nm">' + esc(it.nome) + '</span><span class="mt">' + SLOTS[s].label + "</span></span></button>";
      return '<button class="piece" data-slot="' + s + '" style="border-style:dashed">' +
        '<span class="thumb" style="background:transparent"><span style="opacity:.35">' + SLOTS[s].emoji + "</span></span>" +
        '<span class="info"><span class="nm" style="color:var(--muted)">＋ ' + SLOTS[s].label + "</span>" +
        '<span class="mt">' + (SLOTS[s].opt ? "opcional" : "obrigatório") + "</span></span></button>";
    }).join("") + "</div>" +
    (its.length ? '<div class="row" style="margin-top:14px">' +
      '<input class="inp" id="nomeLook" placeholder="' + esc(nomeAuto) + '" value="' + esc(BUILDER.nome) + '" style="max-width:280px" />' +
      '<button class="btn pri" data-act="salvarLook">💾 ' + (BUILDER.editId ? "Salvar alterações" : "Salvar look") + "</button>" +
      '<button class="btn" data-act="usarHoje" data-ids="' + its.map((i) => i.id).join(",") + '">✅ Usar hoje</button>' +
      '<button class="btn" data-act="planejarLook">📅 Planejar</button></div>' : "") +
    "</div>" +

    (av ? '<div class="card pad" style="margin-top:14px">' +
      '<div class="sec" style="margin:0 0 12px"><h3>Avaliação do look</h3><p>nota geral ' + av.geral + "/100</p></div>" +
      scoresHTML(av) +
      '<div class="note" style="margin-top:14px">Avaliamos <b>as roupas</b> — cor, contexto, clima e equilíbrio entre as peças. ' +
      "O LookLab nunca comenta corpo, peso, altura ou aparência de quem veste.</div></div>" : "") +
    "</div>" +

    "<div>" + (its.length
      ? '<div class="look">' + stripHTML(its) + '<div class="bd"><h4>' + esc(BUILDER.nome || nomeAuto) + "</h4>" +
      '<div class="chips" style="margin-top:8px">' +
      (BUILDER.ctx.ocasiao ? '<span class="tag acc">' + OCCASIONS[BUILDER.ctx.ocasiao].emoji + " " + OCCASIONS[BUILDER.ctx.ocasiao].label + "</span>" : "") +
      (BUILDER.ctx.estilo ? '<span class="tag">' + STYLES[BUILDER.ctx.estilo].emoji + " " + STYLES[BUILDER.ctx.estilo].label + "</span>" : "") +
      (BUILDER.ctx.clima ? '<span class="tag">' + CLIMAS[BUILDER.ctx.clima].emoji + " " + CLIMAS[BUILDER.ctx.clima].label + "</span>" : "") + "</div>" +
      '<p class="why">' + esc(explicaLook(its, BUILDER.ctx)) + "</p>" +
      '<div class="list" style="margin-top:10px">' + its.map((i) =>
        '<div class="li"><span class="em">' + (i.foto ? '<img src="' + i.foto + '" alt="">' : emojiOf(i)) + '</span>' +
        '<span class="t"><b>' + esc(i.nome) + "</b><span>" + CATS[i.cat].label + " · " + corLabel(i.cor) + "</span></span>" +
        '<button class="btn sm ghost" data-act="tirarSlot" data-slot="' + slotVisual(i) + '">✕</button></div>').join("") + "</div>" +
      "</div></div>"
      : '<div class="card pad empty"><div class="em">🧩</div><h4>Nenhuma peça escolhida</h4><p>Use o <b>Gerar look</b> ou toque nos espaços para montar do seu jeito.</p></div>') +

    '<div class="card pad" style="margin-top:14px"><div class="sec" style="margin:0 0 10px"><h3>Looks salvos</h3><p>' + plural(looks().length, "look") + "</p></div>" +
    (looks().length ? '<div class="list">' + looks().slice().sort((a, b) => (b.criado || "").localeCompare(a.criado || "")).slice(0, 8).map((l) =>
      '<div class="li"><span class="em">' + (l.fav ? "⭐" : "🧩") + '</span><span class="t"><b>' + esc(l.nome) + "</b><span>" +
      (l.ocasiao ? OCCASIONS[l.ocasiao].label + " · " : "") + plural(l.itens.length, "peça") + "</span></span>" +
      '<button class="btn sm" data-act="abrirLook" data-id="' + l.id + '">Ver</button></div>').join("") + "</div>"
      : '<p class="hint">Nenhum look salvo ainda.</p>') + "</div>" +
    "</div></div>";
}
function sugereNome(its, ctx) {
  if (ctx && ctx.ocasiao) return "Look " + OCCASIONS[ctx.ocasiao].label.toLowerCase();
  const top = its.find((i) => slotVisual(i) === "top");
  if (top) return "Look " + primeiraMinuscula(corLabel(top.cor));
  return "Meu look";
}
function salvaLookAtual(extra) {
  const its = builderItens();
  if (its.length < 2) { toast("Escolha pelo menos duas peças."); return null; }
  const nome = (BUILDER.nome || "").trim() || sugereNome(its, BUILDER.ctx);
  if (BUILDER.editId) {
    const l = look(BUILDER.editId);
    if (l) {
      Object.assign(l, { nome, itens: its.map((i) => i.id), ocasiao: BUILDER.ctx.ocasiao, estilo: BUILDER.ctx.estilo, clima: BUILDER.ctx.clima }, extra || {});
      save(); toast("Look atualizado."); return l;
    }
  }
  const l = Object.assign({
    id: uid(), nome, itens: its.map((i) => i.id), ocasiao: BUILDER.ctx.ocasiao, estilo: BUILDER.ctx.estilo,
    clima: BUILDER.ctx.clima, fav: false, criado: hoje(), usos: [], nota: null,
  }, extra || {});
  P().looks.push(l); BUILDER.editId = l.id; save(); toast("Look salvo.");
  return l;
}

/* ===================== ESTILISTA (STYLE AI) ===================== */
let CHAT = [];
const PERGUNTAS_RAPIDAS = [
  "Que roupa eu uso hoje?",
  "Quero um look para ir ao shopping",
  "Monte um look para a escola",
  "Preciso de um look arrumado para aniversário",
  "Crie 3 looks para dia frio",
  "Quais peças estão paradas no armário?",
  "O que está faltando no meu guarda-roupa?",
];
function viewIA() {
  if (!CHAT.length) {
    CHAT.push({ de: "ai", tipo: "texto", txt: "Oi, " + P().nome + "! Eu sou a <b>Style AI</b>. Eu olho só o que já está no seu guarda-roupa e monto combinações. Pode perguntar do seu jeito — por exemplo: “quero um look para o shopping”, “cria 3 looks com o tênis preto” ou “o que está faltando aqui?”." });
  }
  return '' +
    '<section class="hero"><h2>🤖 Style AI</h2><p>Seu estilista dentro do app — trabalha só com as peças que você tem.</p></section>' +
    '<div class="chips" style="margin-bottom:14px">' + PERGUNTAS_RAPIDAS.map((q) => '<button class="chip" data-pergunta="' + esc(q) + '">' + esc(q) + "</button>").join("") + "</div>" +
    '<div class="msgs" id="msgs">' + CHAT.map(msgHTML).join("") + "</div>" +
    '<div class="card pad" style="position:sticky;bottom:14px;margin-top:16px">' +
    '<div class="row"><input class="inp" id="perg" placeholder="Escreva sua pergunta…" style="flex:1" />' +
    '<button class="btn pri" data-act="perguntar">Enviar</button></div></div>';
}
function msgHTML(m) {
  if (m.de === "me") return '<div class="msg me">' + esc(m.txt) + "</div>";
  let corpo = '<div class="hdr">🤖 Style AI</div><div>' + m.txt + "</div>";
  if (m.looks && m.looks.length) {
    corpo += '<div class="grid ' + (m.looks.length > 1 ? "g3" : "g2") + '" style="margin-top:12px">' + m.looks.map((L, n) =>
      '<div class="look" style="box-shadow:none">' + stripHTML(L.its) +
      '<div class="bd"><h4>' + esc(L.titulo) + "</h4>" +
      '<div class="chips" style="margin:6px 0 0">' + L.its.map((i) => '<span class="tag">' + emojiOf(i) + " " + esc(i.nome) + "</span>").join("") + "</div>" +
      '<p class="why">' + esc(L.porque) + "</p>" +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn sm pri" data-act="salvarSugestao" data-ids="' + L.its.map((i) => i.id).join(",") + '" data-nome="' + esc(L.titulo) + '" data-ctx="' + esc(JSON.stringify(L.ctx || {})) + '">⭐ Salvar</button>' +
      '<button class="btn sm" data-act="abrirCriar" data-ids="' + L.its.map((i) => i.id).join(",") + '" data-ctx="' + esc(JSON.stringify(L.ctx || {})) + '">✏️ Ajustar</button>' +
      "</div></div></div>").join("") + "</div>";
  }
  if (m.pecas && m.pecas.length) {
    corpo += '<div class="grid g4" style="margin-top:12px">' + m.pecas.map((i) => pecaCard(i, { mini: true, uso: true })).join("") + "</div>";
  }
  return '<div class="msg ai">' + corpo + "</div>";
}
/* Interpreta a pergunta e responde usando o guarda-roupa */
function responde(q) {
  const t = q.toLowerCase();
  const acha = (dict, extra) => Object.keys(dict).find((k) => t.includes(k)) || (extra ? Object.keys(extra).find((k) => t.includes(k)) && extra[Object.keys(extra).find((k) => t.includes(k))] : null);
  const ocasiao = acha(OCCASIONS, { colégio: "escola", aula: "escola", niver: "aniversário", missa: "igreja", culto: "igreja", praia: "praia", almoço: "restaurante", jantar: "restaurante", parque: "passeio" });
  const clima = acha(CLIMAS, { calor: "quente", frio: "frio", chovendo: "chuva", chuvoso: "chuva", inverno: "frio", verão: "quente" });
  const estilo = acha(STYLES, { esporte: "esportivo", social: "arrumado", básico: "minimalista", simples: "minimalista" });
  const ctx = { ocasiao: ocasiao || "", clima: clima || "", estilo: estilo || "" };

  // peças citadas pelo nome
  const citadas = itens().filter((i) => {
    const nm = i.nome.toLowerCase();
    if (nm.length > 4 && t.includes(nm)) return true;
    const catL = CATS[i.cat].label.toLowerCase(), corL = corLabel(i.cor).toLowerCase();
    return t.includes(catL) && t.includes(corL);
  });

  if (/falta|faltando|comprar|preciso comprar|lacuna/.test(t)) {
    const l = analisaLacunas();
    return { txt: "Olhei o que você já tem:<br><br>" + l.map((x) => "• " + esc(x.txt)).join("<br>") + "<br><br>A ideia não é comprar mais, e sim comprar o que <b>abre mais combinações</b>." };
  }
  if (/parad|esquecid|não uso|nao uso|pouco usad/.test(t)) {
    const e = esquecidas(30).slice(0, 8);
    return e.length
      ? { txt: "Estas peças estão paradas há um tempo. Que tal usar uma delas nesta semana?", pecas: e }
      : { txt: "Nenhuma peça está parada há mais de 30 dias. Seu guarda-roupa está girando bem! 👏" };
  }
  if (/mala|viagem de|viajar/.test(t)) {
    return { txt: "Posso montar a mala completa — abra a aba <b>🧳 Viagens</b>, diga o destino e quantos dias, e eu separo as peças e os looks de cada dia." };
  }
  if (/combina com|combina/.test(t) && citadas.length) {
    const it0 = citadas[0], parc = combinaCom(it0, 4);
    return { txt: "Estas são as peças que melhor combinam com <b>" + esc(it0.nome) + "</b>:", pecas: parc };
  }
  const quantos = (t.match(/(\d+)\s*looks?/) || [])[1];
  const n = Math.max(1, Math.min(5, Number(quantos) || (ocasiao || clima || estilo ? 3 : 3)));
  const gen = geraLooks(Object.assign({}, ctx, citadas.length ? { obrigatorios: citadas.map((i) => i.id) } : {}), n);
  if (!gen.length) return { txt: "Ainda não consigo montar: falta peça de cima, de baixo ou calçado no guarda-roupa. Cadastre mais algumas e me chama de novo. 🙂" };
  const rotulos = ["Casual", "Streetwear", "Mais arrumado", "Confortável", "Diferente"];
  const looksOut = gen.map((g, i) => ({
    its: g.its,
    titulo: "LOOK " + (i + 1) + " — " + (ctx.estilo ? STYLES[ctx.estilo].label : rotulos[i] || "Opção " + (i + 1)),
    porque: explicaLook(g.its, ctx) + " Nota geral: " + g.av.geral + "/100.",
    ctx,
  }));
  const cab = ocasiao ? "Para <b>" + OCCASIONS[ocasiao].label.toLowerCase() + "</b>" : "Olhando seu guarda-roupa";
  const compl = [clima ? "com clima " + clima : "", estilo ? "no estilo " + STYLES[estilo].label.toLowerCase() : "", citadas.length ? "usando " + citadas.map((c) => "<b>" + esc(c.nome) + "</b>").join(" e ") : ""].filter(Boolean).join(", ");
  return { txt: cab + (compl ? " " + compl : "") + ", montei " + (looksOut.length === 1 ? "esta opção" : looksOut.length + " opções") + ":", looks: looksOut };
}
function perguntar(q) {
  q = (q || "").trim(); if (!q) return;
  CHAT.push({ de: "me", txt: q });
  const r = responde(q);
  CHAT.push(Object.assign({ de: "ai" }, r));
  render();
  setTimeout(() => { const m = $("#msgs"); if (m) m.lastElementChild.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 30);
}
</script>

<script>

/* ===================== CALENDÁRIO ===================== */
let CAL = { y: new Date().getFullYear(), m: new Date().getMonth() };

}
function planejaSemana() {
  const p = P(); const usados = [];
  let ok = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const k = iso(d);
    if ((p.plano || {})[k]) continue;
    const evitar = new Set(usados);
    const g = geraLooks({ clima: "meia-estação", evitar }, 1)[0];
    if (!g) break;
    g.its.forEach((x) => usados.push(x.id));
    const l = { id: uid(), nome: "Look de " + DOW[d.getDay()] + " " + d.getDate() + "/" + pad2(d.getMonth() + 1), itens: g.its.map((x) => x.id), ocasiao: "", estilo: "", clima: "meia-estação", fav: false, criado: hoje(), usos: [] };
    p.looks.push(l);
    p.plano = p.plano || {}; p.plano[k] = { lookId: l.id, ocasiao: "" };
    ok++;
  }
  save();
  toast(ok ? ok + " dia(s) planejados." : "Os próximos 7 dias já estavam planejados.");

/* ===================== TENDÊNCIAS ===================== */
let TRENDS = { updatedAt: "", trends: TRENDS_SAMPLE };
function pecasDaTendencia(t) {
  const m = t.match || {};
  const tem = (k) => m[k] && m[k].length;
  return itens().filter((i) => {
    if (tem("cats")) {
      if (!m.cats.includes(i.cat)) return false;
      if (tem("colors") && !(m.colors.includes(i.cor) || m.colors.includes(i.cor2))) return false;
      if (tem("styles") && !m.styles.includes(i.estilo)) return false;
      return true;
    }
    if (tem("colors")) return m.colors.includes(i.cor) || m.colors.includes(i.cor2);
    if (tem("patterns")) return m.patterns.includes(i.estampa);
    if (tem("styles")) return m.styles.includes(i.estilo);
    return false;
  });
}

    "<div>" + Object.keys(grupos).map((g) =>
      '<div class="card pad" style="margin-bottom:14px"><div class="sec" style="margin:0 0 8px"><h3>' + esc(g) + "</h3></div>" +

/* ===================== INSPIRAÇÕES ===================== */
let INSP_FILTRO = "";
function viewInspiracoes() {
  const grupos = [...new Set(INSPIRACOES.map((i) => i.grupo))];
  const arr = INSP_FILTRO ? INSPIRACOES.filter((i) => i.grupo === INSP_FILTRO) : INSPIRACOES;
  return '' +

    '<button class="chip ' + (INSP_FILTRO ? "" : "on") + '" data-chip="insp" data-val="">Todas</button>' +

    '<div class="grid g3">' + arr.map((i) => {
      const achou = recriaInspiracao(i);
      return '<div class="card" style="overflow:hidden">' +
        '<div style="aspect-ratio:16/10;background:linear-gradient(135deg,var(--acc-soft),var(--bg2));display:grid;place-items:center;font-size:52px">' + i.emoji + "</div>" +
        '<div class="pad"><b style="font-size:15px;letter-spacing:-.02em">' + esc(i.titulo) + "</b>" +
        '<p class="hint" style="margin:5px 0 9px">' + esc(i.desc) + "</p>" +
        '<div class="chips" style="margin-bottom:10px">' +
        '<span class="tag">' + STYLES[i.estilo].emoji + " " + STYLES[i.estilo].label + "</span>" +
        '<span class="tag">' + OCCASIONS[i.ocasiao].emoji + " " + OCCASIONS[i.ocasiao].label + "</span>" +
        '<span class="tag">' + CLIMAS[i.clima].emoji + " " + CLIMAS[i.clima].label + "</span></div>" +
        (achou ? '<div class="tag good" style="margin-bottom:8px">✓ dá para montar com o que você tem</div>'
          : '<div class="tag warn" style="margin-bottom:8px">falta peça parecida no armário</div>') +
        '<button class="btn ' + (achou ? "pri" : "") + ' block sm" data-act="recriar" data-id="' + i.id + '">✨ Criar algo parecido com minhas roupas</button>' +
        "</div></div>";
    }).join("") + "</div>";
}
/* procura no guarda-roupa peças parecidas com a receita da inspiração */
function recriaInspiracao(insp) {
  const ctx = { ocasiao: insp.ocasiao, estilo: insp.estilo, clima: insp.clima };
  const escolhidas = {};
  let faltou = false;
  Object.keys(insp.receita).forEach((slot) => {
    const req = insp.receita[slot];
    const cands = itens().filter((i) => slotVisual(i) === slot && (slot !== "top" || slotOf(i) !== "full"));
    if (!cands.length) { if (slot !== "acc") faltou = true; return; }
    const scored = cands.map((i) => {
      let s = pontuaItem(i, ctx);
      if (req.cats && req.cats.includes(i.cat)) s += 40;
      if (req.colors && (req.colors.includes(i.cor) || req.colors.includes(i.cor2))) s += 35;
      return { i, s };
    }).sort((a, b) => b.s - a.s);
    escolhidas[slot] = scored[0].i;
  });
  const its = Object.values(escolhidas);
  if (faltou || its.length < 3) return null;
  return { its, ctx };
}

        }).join("") + "</div></div>";
    }).join("") : vazio("🧳", "Nenhuma mala montada", "Preencha o destino e a duração acima para o LookLab separar as peças."));
}
function geraMala(destino, dias, tipo, clima) {
  const usados = new Set(); const looksV = [];
  const ocasioes = tipo === "praia" ? ["praia", "passeio", "restaurante"] : tipo === "escola" ? ["escola", "passeio"] : ["passeio", "shopping", "restaurante", "família"];
  for (let d = 0; d < dias; d++) {
    const oc = ocasioes[d % ocasioes.length];
    const g = geraLooks({ ocasiao: oc, clima, evitar: usados }, 1)[0];
    if (!g) break;
    g.its.forEach((i) => { if (slotOf(i) !== "shoes" && slotOf(i) !== "outer") usados.add(i.id); });
    looksV.push({ dia: d + 1, ids: g.its.map((i) => i.id), ocasiao: oc });
  }
  if (!looksV.length) { toast("Cadastre mais peças para montar a mala."); return; }
  // uma peça mais arrumada para imprevistos
  const arrumada = itens().filter((i) => dressyDoItem(i) >= 2 && !looksV.some((L) => L.ids.includes(i.id)))[0];
  if (arrumada) looksV[looksV.length - 1].ids = [...new Set(looksV[looksV.length - 1].ids.concat([arrumada.id]))];
  P().viagens = P().viagens || [];
  P().viagens.push({ id: uid(), destino: destino || "Viagem", dias, tipo, clima, criado: hoje(), looks: looksV });
  save(); toast("Mala montada!"); render();
}

      '<div class="li"><span class="em">' + (i.foto ? '<img src="' + i.foto + '" alt="">' : emojiOf(i)) + '</span>' +
      '<span class="t"><b>' + esc(i.nome) + "</b><span>" + CATS[i.cat].label + " · " + corLabel(i.cor) + "</span></span>" +

    '<button class="btn" data-act="planejarEsse" data-id="' + l.id + '">📅 Planejar</button>' +
    '<button class="btn sm danger" data-act="delLook" data-id="' + l.id + '">Excluir</button></div>' +
    "</div></div>" +
    '<div class="card pad"><div class="sec" style="margin:0 0 12px"><h3>Avaliação</h3><p>nota geral ' + av.geral + "/100</p></div>" + scoresHTML(av) +
    (usos.length ? '<div class="sec" style="margin:18px 0 8px"><h3>Histórico de uso</h3></div><div class="chips">' +
      usos.slice(0, 12).map((d) => '<span class="tag">' + dataCurta(d) + "</span>").join("") + "</div>" : "") +
    "</div></div>";
}
function variacaoDe(l) {
  const its = l.itens.map(item).filter(Boolean);
  const trocavel = its.filter((i) => slotOf(i) !== "shoes");
  const alvo = trocavel[Math.floor(Math.random() * trocavel.length)] || its[0];
  const ctx = { ocasiao: l.ocasiao, clima: l.clima, estilo: l.estilo };
  const cands = itens().filter((i) => i.id !== alvo.id && slotVisual(i) === slotVisual(alvo));
  if (!cands.length) { toast("Não há outra peça desse tipo para trocar."); return null; }
  const outras = its.filter((i) => i.id !== alvo.id);
  const melhor = cands.map((c) => ({ c, s: avaliaLook(outras.concat([c]), ctx).geral + pontuaItem(c, ctx) * 0.25 + Math.random() * 6 }))
    .sort((a, b) => b.s - a.s)[0].c;
  carregaLookNoBuilder({ id: null, nome: l.nome + " (variação)", ocasiao: l.ocasiao, estilo: l.estilo, clima: l.clima, itens: outras.map((i) => i.id).concat([melhor.id]) });
  BUILDER.editId = null;
  toast("Troquei " + primeiraMinuscula(alvo.nome) + " por " + primeiraMinuscula(melhor.nome) + ".");
  ir("criar");
}
</script>

/* foto: reduz para 420px e sugere a cor predominante */
function processaFoto(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const M = 360, sc = Math.min(1, M / Math.max(img.width, img.height));   // cabe no armazenamento do navegador
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      const cx = c.getContext("2d");
      cx.drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.7);
      cb(dataUrl, corPredominante(cx, c.width, c.height));
    };
    img.onerror = () => cb(null, null);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function corPredominante(cx, w, h) {
  // amostra o miolo da imagem (evita fundo nas bordas)
  const x0 = Math.round(w * 0.2), y0 = Math.round(h * 0.2);
  const d = cx.getImageData(x0, y0, Math.max(1, Math.round(w * 0.6)), Math.max(1, Math.round(h * 0.6))).data;
  const votos = {};
  for (let i = 0; i < d.length; i += 16) {
    if (d[i + 3] < 128) continue;
    const k = corMaisProxima(d[i], d[i + 1], d[i + 2]);
    votos[k] = (votos[k] || 0) + 1;
  }
  return Object.keys(votos).sort((a, b) => votos[b] - votos[a])[0] || null;
}
function corMaisProxima(r, g, b) {
  const [h, s, l] = rgb2hsl(r, g, b);
  let best = "preto", bd = 1e9;
  COLOR_KEYS.forEach((k) => {
    const [H, S, L] = COLOR_HSL[k];
    const dh = Math.min(Math.abs(h - H), 360 - Math.abs(h - H)) / 180;
    const peso = Math.min(s, S) / 100;               // matiz importa pouco em cor lavada
    const d = (dh * dh) * (2.2 * peso) + Math.pow((s - S) / 100, 2) * 0.8 + Math.pow((l - L) / 100, 2) * 1.5;
    if (d < bd) { bd = d; best = k; }
  });
  return best;
}

<script>
"use strict";
/* =====================================================================
   Contas — login local com e-mail e senha.
   Tudo fica NESTE aparelho: a senha nunca é guardada, só a derivação
   PBKDF2-SHA256 (210 mil rodadas) com sal aleatório por conta.
   Isso tranca o app no aparelho; não é login de servidor, não sincroniza
   entre aparelhos e não há recuperação de senha por e-mail.
   ===================================================================== */
const ITER = 210000;
let CONTAS = { contas: [], sessao: "", ui: { theme: "auto" } };
let AUTH = { modo: "entrar", erro: "", ok: "", ocupado: false };

function carregaContas() {
  try {
    const raw = localStorage.getItem(KEY_CONTAS);
    if (raw) CONTAS = JSON.parse(raw);
  } catch (e) { /* ignora e recomeça */ }
  CONTAS = CONTAS || {};
  CONTAS.contas = CONTAS.contas || [];
  CONTAS.ui = CONTAS.ui || { theme: "auto" };
  CONTAS.sessao = CONTAS.sessao || "";
}
function salvaContas() {
  try { localStorage.setItem(KEY_CONTAS, JSON.stringify(CONTAS)); }
  catch (e) { toast("Não foi possível salvar a conta (armazenamento cheio)."); }
}
const contaAtual = () => CONTAS.contas.find((c) => c.id === CONTAS.sessao) || null;
const normEmail = (e) => String(e || "").trim().toLowerCase();
const emailValido = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(normEmail(e));
const achaConta = (e) => CONTAS.contas.find((c) => c.email === normEmail(e));

const b64 = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const deB64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const temCripto = () => !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
async function derivaSenha(senha, saltB64, iter) {
  const chave = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: deB64(saltB64), iterations: iter || ITER, hash: "SHA-256" }, chave, 256);
  return b64(bits);
}
function novoSalt() { return b64(crypto.getRandomValues(new Uint8Array(16))); }
/* comparação em tempo constante, para o tempo de resposta não vazar o quanto acertou */
function igual(a, b) {
  if (a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}

async function criarConta(nome, email, senha, comExemplo) {
  const conta = { id: uid(), nome: (nome || "").trim(), email: normEmail(email), salt: novoSalt(), iter: ITER, criado: hoje() };
  conta.hash = await derivaSenha(senha, conta.salt, conta.iter);
  // a primeira conta do aparelho herda os dados que já existiam antes do login
  let herdado = null;
  if (!CONTAS.contas.length) {
    try {
      const antigo = localStorage.getItem(KEY);
      if (antigo) { const d = JSON.parse(antigo); if (d && d.perfis && d.perfis.length) herdado = d; }
    } catch (e) { /* ignora */ }
  }
  DB = herdado || (comExemplo ? seedDB() : dbVazio(conta.nome || "Eu"));
  DB.ui = DB.ui || { theme: "auto" };
  DB.ui.theme = CONTAS.ui.theme || "auto";
  CONTAS.contas.push(conta);
  CONTAS.sessao = conta.id;
  salvaContas();
  try { localStorage.setItem(KEY_DADOS(conta.id), JSON.stringify(DB)); } catch (e) { /* avisa no save seguinte */ }
  if (herdado) { try { localStorage.removeItem(KEY); } catch (e) { } }
  return { conta, herdado: !!herdado };
}
async function entrar(email, senha) {
  const c = achaConta(email);
  if (!c) return false;
  const h = await derivaSenha(senha, c.salt, c.iter || ITER);
  if (!igual(h, c.hash)) return false;
  CONTAS.sessao = c.id; salvaContas();
  if (!carregaDados(c.id)) { DB = dbVazio(c.nome || "Eu"); save(); }
  DB.ui = DB.ui || { theme: "auto" };
  return true;
}
function sair() {
  CONTAS.sessao = ""; salvaContas();
  DB = null; CHAT = [];
  AUTH = { modo: "entrar", erro: "", ok: "", ocupado: false };
  desenhaAuth();
}
async function trocarSenha(atual, nova) {
  const c = contaAtual(); if (!c) return "Nenhuma conta ativa.";
  const h = await derivaSenha(atual, c.salt, c.iter || ITER);
  if (!igual(h, c.hash)) return "A senha atual não confere.";
  if (String(nova).length < 6) return "A senha nova precisa ter pelo menos 6 caracteres.";
  c.salt = novoSalt(); c.iter = ITER;
  c.hash = await derivaSenha(nova, c.salt, c.iter);
  salvaContas();
  return "";
}
function excluirConta(id) {
  CONTAS.contas = CONTAS.contas.filter((c) => c.id !== id);
  try { localStorage.removeItem(KEY_DADOS(id)); } catch (e) { }
  if (CONTAS.sessao === id) { CONTAS.sessao = ""; DB = null; }
  salvaContas();
}

    : AUTH.ok ? '<div class="ok">' + esc(AUTH.ok) + "</div>" : "";
}
/* mostra o recado sem redesenhar a tela — o que já foi digitado continua lá */
function avisaAuth(erro, ok) {

function desenhaAuth() {
  const el = $("#auth");

  el.classList.add("on");

  if (!temCripto()) {
    el.innerHTML = '<div class="auth"><div class="mark"><img src="assets/logo.png" alt="" />' +
      "<h1>Look<span>Lab</span></h1></div>" +
      '<div class="erro">Este navegador não oferece as funções de segurança necessárias para guardar a senha ' +

    return;
  }

  const cab = '<div class="topo"><button class="iconbtn" id="authTema" title="Alternar tema">' +
    (temaAtual() === "light" ? "☀️" : temaAtual() === "dark" ? "🌙" : "🌗") + "</button></div>" +
    '<div class="mark"><img src="assets/logo.png" alt="" /><h1>Look<span>Lab</span></h1>' +
    "<p>seu estilista digital</p></div>";
  const aviso = '<div id="au-aviso">' + avisoHTML() + "</div>";
  const rodape = '<p class="rodape">A conta e o guarda-roupa ficam <b>neste aparelho</b>. Nada é enviado para servidor nenhum — ' +
    "por isso não dá para entrar do celular e do computador com os mesmos dados, e não existe recuperação de senha por e-mail. " +
    "Faça um backup em <b>Perfil → área dos responsáveis</b>.</p>";

  if (AUTH.modo === "esqueci") {
    el.innerHTML = '<div class="auth">' + cab +
      '<div class="card pad"><b style="font-size:15px">Esqueci minha senha</b>' +
      '<p class="hint" style="margin:8px 0 0;line-height:1.55">Como tudo fica só neste aparelho, o LookLab não tem como enviar ' +
      "um e-mail de recuperação: a senha não está guardada em lugar nenhum, nem aqui. Restam dois caminhos:</p>" +
      '<p class="hint" style="margin:10px 0 0;line-height:1.55"><b>1.</b> Se você exportou um backup, crie uma conta nova e ' +
      "importe o arquivo em <b>Perfil → área dos responsáveis → Importar</b>. Você recupera todo o guarda-roupa.</p>" +
      '<p class="hint" style="margin:8px 0 14px;line-height:1.55"><b>2.</b> Sem backup, o jeito é apagar a conta e começar de novo — ' +
      "o guarda-roupa dela se perde.</p>" +
      (nContas ? '<div class="field"><label>Apagar qual conta?</label><select class="inp" id="au-apagar">' +
        CONTAS.contas.map((c) => '<option value="' + c.id + '">' + esc(c.email) + "</option>").join("") + "</select></div>" +
        '<button class="btn danger block" id="au-apagarBtn" style="margin-top:12px">Apagar conta e recomeçar</button>' : "") +
      '<button class="link" id="au-voltar" style="margin-top:14px">← Voltar para o login</button>' +
      "</div>" + rodape + "</div>";
    $("#authTema").onclick = giraTema;
    $("#au-voltar").onclick = () => { AUTH = { modo: "entrar", erro: "", ok: "", ocupado: false }; desenhaAuth(); };
    const b = $("#au-apagarBtn");
    if (b) b.onclick = () => {

      desenhaAuth();
    };
    return;
  }

  const criando = AUTH.modo === "criar";
  el.innerHTML = '<div class="auth">' + cab +
    '<div class="seg2"><button id="au-tab-entrar" class="' + (criando ? "" : "on") + '">Entrar</button>' +
    '<button id="au-tab-criar" class="' + (criando ? "on" : "") + '">Criar conta</button></div>' +
    aviso +
    '<form id="au-form" autocomplete="on" novalidate>' +
    (criando ? '<div class="field"><label>Seu nome</label><input class="inp" id="au-nome" placeholder="como quer ser chamado(a)" autocomplete="name" /></div>' : "") +
    '<div class="field"><label>E-mail</label><input class="inp" id="au-email" type="email" inputmode="email" autocomplete="' + (criando ? "username" : "username") + '" placeholder="voce@exemplo.com" /></div>' +
