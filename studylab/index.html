<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MindTrack AI</title>
<meta name="description" content="MindTrack: agenda escolar, prioridades inteligentes, revisão espaçada, questões, flashcards, foco e desempenho — tudo em um lugar." />
<meta name="theme-color" content="#0a0b10" />
<meta property="og:title" content="MindTrack AI — estude, pratique, evolua" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon.svg" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div id="boot" class="boot">
  <div class="boot__mark"><svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <defs><linearGradient id="gBoot" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0" stop-color="#5ad7ff"/><stop offset="1" stop-color="#2fa8e8"/>
      </linearGradient></defs>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 22c-8-6-20-5-26 2-8-2-15 3-17 11-7 3-10 12-6 19-5 6-4 15 2 20-2 8 3 15 11 17 2 8 10 13 18 11 5 6 13 7 18 2 5 5 13 4 18-2 8 2 16-3 18-11 8-2 13-9 11-17 6-5 7-14 2-20 4-7 1-16-6-19-2-8-9-13-17-11-6-7-18-8-26-2z" stroke="#3ec9f5" stroke-width="13" opacity="0.18"/>
        <path d="M64 22c-8-6-20-5-26 2-8-2-15 3-17 11-7 3-10 12-6 19-5 6-4 15 2 20-2 8 3 15 11 17 2 8 10 13 18 11 5 6 13 7 18 2 5 5 13 4 18-2 8 2 16-3 18-11 8-2 13-9 11-17 6-5 7-14 2-20 4-7 1-16-6-19-2-8-9-13-17-11-6-7-18-8-26-2z" stroke="url(#gBoot)" stroke-width="5.4"/>
        <path d="M64 24c-4 8-4 14 0 20" stroke="#3ec9f5" stroke-width="4" opacity="0.5"/>
        <path d="M34 76 50 60l12 10 16-20 16 12" stroke="url(#gBoot)" stroke-width="5.4"/>
      </g>
      <g fill="#bfeaff" stroke="#2fa8e8" stroke-width="2.5">
        <circle cx="34" cy="76" r="4.6"/><circle cx="50" cy="60" r="4.6"/><circle cx="62" cy="70" r="4.6"/>
        <circle cx="78" cy="50" r="4.6"/><circle cx="94" cy="62" r="4.6"/>
      </g>
    </svg></div>
  <div class="wordmark boot__name">MindTrack<span> AI</span></div>
  <div class="tagline">Estude<i>.</i> Pratique<i>.</i> Evolua<i>.</i></div>
  <div class="boot__bar"><i></i></div>
</div>

<div id="app" class="app" hidden>
  <!-- ===== Menu lateral ===== -->
  <aside class="side" id="side">
    <div class="side__brand">
      <span class="side__logo"><svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <defs><linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0.4">
        <stop offset="0" stop-color="#5ad7ff"/><stop offset="1" stop-color="#2fa8e8"/>
      </linearGradient></defs>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 22c-8-6-20-5-26 2-8-2-15 3-17 11-7 3-10 12-6 19-5 6-4 15 2 20-2 8 3 15 11 17 2 8 10 13 18 11 5 6 13 7 18 2 5 5 13 4 18-2 8 2 16-3 18-11 8-2 13-9 11-17 6-5 7-14 2-20 4-7 1-16-6-19-2-8-9-13-17-11-6-7-18-8-26-2z" stroke="#3ec9f5" stroke-width="13" opacity="0.18"/>
        <path d="M64 22c-8-6-20-5-26 2-8-2-15 3-17 11-7 3-10 12-6 19-5 6-4 15 2 20-2 8 3 15 11 17 2 8 10 13 18 11 5 6 13 7 18 2 5 5 13 4 18-2 8 2 16-3 18-11 8-2 13-9 11-17 6-5 7-14 2-20 4-7 1-16-6-19-2-8-9-13-17-11-6-7-18-8-26-2z" stroke="url(#gSide)" stroke-width="5.4"/>
        <path d="M64 24c-4 8-4 14 0 20" stroke="#3ec9f5" stroke-width="4" opacity="0.5"/>
        <path d="M34 76 50 60l12 10 16-20 16 12" stroke="url(#gSide)" stroke-width="5.4"/>
      </g>
      <g fill="#bfeaff" stroke="#2fa8e8" stroke-width="2.5">
        <circle cx="34" cy="76" r="4.6"/><circle cx="50" cy="60" r="4.6"/><circle cx="62" cy="70" r="4.6"/>
        <circle cx="78" cy="50" r="4.6"/><circle cx="94" cy="62" r="4.6"/>
      </g>
    </svg></span>
      <span class="side__name">
        <span class="wordmark">MindTrack<span> AI</span></span>
        <span class="tagline tagline--mini">Estude<i>.</i> Pratique<i>.</i> Evolua<i>.</i></span>
      </span>
      <button class="side__close icon-btn" data-close-side aria-label="Fechar menu">✕</button>
    </div>
    <nav class="side__nav" id="sideNav"></nav>
    <div class="side__foot">
      <div class="lvl" id="sideLevel"></div>
    </div>
  </aside>
  <div class="side__scrim" data-close-side hidden></div>

  <!-- ===== Barra superior ===== -->
  <header class="top">
    <button class="icon-btn top__burger" data-open-side aria-label="Abrir menu">☰</button>
    <button class="top__search" data-action="busca">
      <span>🔍</span><span class="top__search-txt">Pesquisar em tudo…</span>
    </button>
    <div class="top__right">
      <button class="pill pill--fire" data-action="streak" id="topStreak" title="Sequência de dias">🔥 <b>0</b></button>
      <button class="icon-btn" data-action="quickadd" title="Adicionar" id="topAdd">➕</button>
      <button class="icon-btn" data-action="notifs" title="Notificações" id="topBell">🔔<i class="dot" hidden></i></button>
      <button class="avatar" data-action="perfil" title="Perfil" id="topAvatar">G</button>
    </div>
  </header>

  <!-- ===== Conteúdo ===== -->
  <main class="main" id="view" tabindex="-1"></main>

  <!-- ===== Navegação inferior (mobile) ===== -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-modal-close></div>
  <div class="modal__box" role="dialog" aria-modal="true">
    <header class="modal__head">
      <h2 id="modalTitle">—</h2>
      <button class="icon-btn" data-modal-close aria-label="Fechar">✕</button>
    </header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
