<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#050608" />
<title>Site bloqueado</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #050608; color: #f3ead7; text-align: center;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .caixa { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .icone {
    width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
    background: #14161d; border: 1px solid #272a35; color: #3ec9f5;
  }
  h1 { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -.01em; }
  p { font-size: 15px; line-height: 1.55; color: #a9a396; }
</style>
</head>
<body>
  <main class="caixa" role="alert">
    <div class="icone" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Site bloqueado</h1>
    <p>O acesso ao MindTrack AI está bloqueado no momento.</p>
  </main>
<script>
  // tira o app antigo guardado no celular (service worker e cache) para nada abrir por fora do bloqueio
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations()
      .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }).catch(function () {});
  } catch (e) {}
</script>
</body>
</html>
