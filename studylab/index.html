<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>StudyLab</title>
<meta name="description" content="StudyLab: agenda escolar, prioridades inteligentes, revisão espaçada, questões, flashcards, foco e desempenho — tudo em um lugar." />
<meta name="theme-color" content="#0b0d16" />
<meta property="og:title" content="StudyLab — estude, pratique, evolua" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon.svg" />
<link rel="stylesheet" href="./css/app.css" />
</head>
<body>
<div id="boot" class="boot">
  <div class="boot__mark"><svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <defs><linearGradient id="gBoot" x1="0" y1="0" x2="1" y2="0.35">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient></defs>
      <g fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="49" y="18" width="30" height="9" rx="4.5"/>
        <path d="M55 27v16.5L28.5 94.5A8.5 8.5 0 0 0 36 107h56a8.5 8.5 0 0 0 7.5-12.5L73 43.5V27"/>
      </g>
      <g fill="none" stroke="url(#gBoot)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 80 41 68v18l23 12z"/><path d="M64 80 87 68v18L64 98z"/>
      </g>
    </svg></div>
  <div class="wordmark boot__name">Study<span>Lab</span></div>
  <div class="tagline">Estude<i>.</i> Pratique<i>.</i> Evolua<i>.</i></div>
  <div class="boot__bar"><i></i></div>
</div>

<div id="app" class="app" hidden>
  <!-- ===== Menu lateral ===== -->
  <aside class="side" id="side">
    <div class="side__brand">
      <span class="side__logo"><svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
      <defs><linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0.35">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset="0.5" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient></defs>
      <g fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="49" y="18" width="30" height="9" rx="4.5"/>
        <path d="M55 27v16.5L28.5 94.5A8.5 8.5 0 0 0 36 107h56a8.5 8.5 0 0 0 7.5-12.5L73 43.5V27"/>
      </g>
      <g fill="none" stroke="url(#gSide)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 80 41 68v18l23 12z"/><path d="M64 80 87 68v18L64 98z"/>
      </g>
    </svg></span>
      <span class="side__name">
        <span class="wordmark">Study<span>Lab</span></span>
        <span class="tagline tagline--mini">Estude<i>.</i> Pratique<i>.</i> Evolua<i>.</i></span>
      </span>
      <button class="side__close icon-btn" data-close-side aria-label="Fechar menu">✕</button>
    </div>
    <nav class="side__nav" id="sideNav"></nav>
    <div class="side__foot">
      <div class="lvl" id="sideLevel"></div>
    </div>
  </aside>
  <div class="side__scrim" data-close-side hidden></div>

  <!-- ===== Barra superior ===== -->
  <header class="top">
    <button class="icon-btn top__burger" data-open-side aria-label="Abrir menu">☰</button>
    <button class="top__search" data-action="busca">
      <span>🔍</span><span class="top__search-txt">Pesquisar em tudo…</span>
    </button>
    <div class="top__right">
      <button class="pill pill--fire" data-action="streak" id="topStreak" title="Sequência de dias">🔥 <b>0</b></button>
      <button class="icon-btn" data-action="quickadd" title="Adicionar" id="topAdd">➕</button>
      <button class="icon-btn" data-action="notifs" title="Notificações" id="topBell">🔔<i class="dot" hidden></i></button>
      <button class="avatar" data-action="perfil" title="Perfil" id="topAvatar">G</button>
    </div>
  </header>

  <!-- ===== Conteúdo ===== -->
  <main class="main" id="view" tabindex="-1"></main>

  <!-- ===== Navegação inferior (mobile) ===== -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-modal-close></div>
  <div class="modal__box" role="dialog" aria-modal="true">
    <header class="modal__head">
      <h2 id="modalTitle">—</h2>
      <button class="icon-btn" data-modal-close aria-label="Fechar">✕</button>
    </header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
