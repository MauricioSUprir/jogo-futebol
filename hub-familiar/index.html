<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0b" />
<title>NEXO — Hub da Família</title>
<link rel="icon" type="image/png" href="assets/nexo-emblem.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="NEXO" />
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --card:#fcfcfb; --text:#0b0b0b; --text2:#52514e; --muted:#898781;
    --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --brand:#0f766e; --brand-soft:#dbeee9;
    --accent:#e08a1e; --accent-soft:#fbecd4;
    --good:#0ca30c; --good-soft:#e3f6e3; --bad:#d03b3b; --bad-soft:#fce8e8;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 10px 30px rgba(11,11,11,.05);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:#0d0d0d; --card:#1a1a19; --text:#fff; --text2:#c3c2b7; --muted:#898781;
      --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
      --brand:#2dd4bf; --brand-soft:#12332a;
      --accent:#f0a742; --accent-soft:#3a2a12;
      --good:#3ecf5f; --good-soft:#12331c; --bad:#e66767; --bad-soft:#3a1414;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 96px}
  .hide{display:none!important}
  .spacer{flex:1}

  /* splash */
  #splash{position:fixed;inset:0;z-index:100;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;
    transition:opacity .5s ease, visibility .5s ease}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash img{width:min(74vw,340px);height:auto;filter:drop-shadow(0 10px 40px rgba(45,212,191,.18));
    animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
  #splash .enter{color:#7de3d0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:9px;opacity:.9;animation:fade 1.4s ease .5s both}
  #splash .enter .d{width:7px;height:7px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 12px #2dd4bf;animation:blink 1.3s infinite}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:.9}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){#splash img,#splash .enter{animation:none}}

  /* avatar */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .av.sm{width:30px;height:30px;font-size:15px}
  .av.md{width:44px;height:44px;font-size:22px}
  .av.lg{width:76px;height:76px;font-size:38px}

  /* ===== login / seleção de perfil ===== */
  .lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;text-align:center}
  .lock .logo{width:64px;height:64px;border-radius:18px;overflow:hidden;background:#000;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
  .lock .logo img{width:100%;height:100%;object-fit:cover}
  .lock h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .lock .fam{margin:2px 0 4px;color:var(--brand);font-weight:700}
  .lock p.sub{margin:0 0 26px;color:var(--muted);font-size:13.5px}
  .people{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;max-width:560px}
  .person{background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;width:98px;padding:6px}
  .person .av{transition:transform .15s}
  .person:hover .av{transform:translateY(-3px) scale(1.04)}
  .person .nm{font-size:13.5px;font-weight:650}
  .person .rl{font-size:11px;color:var(--muted)}
  .person.add .av{background:var(--card);color:var(--muted);border:2px dashed var(--line);box-shadow:none}
  .lock .foot{margin-top:34px;color:var(--muted);font-size:12px}

  /* pin pad */
  .pinwrap{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .pindots{display:flex;gap:12px}
  .pindots .pd{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
  .pindots .pd.on{background:var(--brand);border-color:var(--brand)}
  .pindots.err{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
  .pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);
    font-size:22px;font-weight:600;color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
  .pad button:active{transform:scale(.96)}
  .pad button.ghost{background:transparent;box-shadow:none;border-color:transparent;font-size:15px;color:var(--muted)}

  /* ===== app shell ===== */
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#000;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);flex:none}
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{font-size:19px;margin:0;font-weight:780;letter-spacing:-.02em;white-space:nowrap}
  .brand p{margin:0;font-size:12.5px;color:var(--muted)}
  .me{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 10px;box-shadow:var(--shadow);cursor:pointer}
  .me .nm{font-size:13px;font-weight:650;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hello{margin:2px 0 16px}
  .hello h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .hello p{margin:2px 0 0;color:var(--muted);font-size:13px}

  /* tabs */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:transparent;color:var(--text2);cursor:pointer;padding:9px 15px;border-radius:10px;font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tabs button.active{background:var(--brand);color:#fff}

  /* cards / panels */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid .full{grid-column:1/-1}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
  .panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .panel .ph .ic{font-size:18px}
  .panel h3{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em}
  .panel .cnt{font-size:12px;color:var(--muted);margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:650}

  /* list rows */
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:15px;transition:.12s}
  .chk.on{background:var(--good);border-color:var(--good);color:#fff}
  .li-main{min-width:0;flex:1}
  .li-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .li-t.done{text-decoration:line-through;color:var(--muted);font-weight:500}
  .li-s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:1px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600}
  .tag.mine{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
  .tag.warn{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .tag.late{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;border-radius:8px;flex:none}
  .x:hover{color:var(--bad);background:var(--bad-soft)}

  /* forms */
  .add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .add input[type=text],.add input[type=date],.add input[type=number],.add select,.add textarea{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);
    border-radius:11px;padding:10px 12px;font-size:14px;outline:none}
  .add input:focus,.add select:focus,.add textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .add textarea{resize:vertical;min-height:44px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{filter:brightness(1.05);color:#fff}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .w100{width:100%}
  .fld{display:flex;flex-direction:column;gap:5px;text-align:left}
  .fld label{font-size:12px;color:var(--muted);font-weight:650}

  .empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* meals */
  .meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal .mi{font-size:22px;flex:none;width:30px;text-align:center}
  .meal .mb{flex:1;min-width:0}
  .meal .ml{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .meal .mv{font-size:14.5px;margin-top:2px;white-space:pre-wrap}
  .meal .mv.ph{color:var(--muted);font-style:italic}
  .meal input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:4px}

  .daynav{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .daynav .lbl{font-weight:700;font-size:14.5px}
  .icobtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--text2)}
  .icobtn:hover{color:var(--brand);border-color:var(--brand)}

  /* notes */
  .note{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
  .note .nh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .note .na{font-size:12.5px;font-weight:700}
  .note .nt{font-size:11.5px;color:var(--muted);margin-left:auto}
  .note .nb{font-size:14px;white-space:pre-wrap;word-break:break-word}

  /* dates */
  .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .countpill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--accent-soft);color:var(--accent)}
  .countpill.soon{background:var(--bad-soft);color:var(--bad)}
  .countpill.today{background:var(--good-soft);color:var(--good)}

  /* member manager */
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:var(--text)}
  .emopick{display:flex;gap:6px;flex-wrap:wrap}
  .emopick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
  .emopick button.on{border-color:var(--brand);background:var(--brand-soft)}

  /* modal */
  .ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:440px;max-height:90dvh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:780}
  .modal .msub{margin:0 0 16px;color:var(--muted);font-size:13px}
  .stack{display:flex;flex-direction:column;gap:14px}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div id="splash">
  <img src="assets/nexo-logo.png" alt="NEXO — Hub da Família" />
  <div class="enter"><span class="d"></span>Toque para entrar</div>
</div>

<div id="root"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   CAMADA DE DADOS (Store) — única parte que muda pra ligar num servidor.
   ---------------------------------------------------------------------
   Hoje persiste no próprio aparelho (localStorage). Cada pessoa tem um
   perfil e "entra na sua conta" pra ver as coisas da família. Para
   sincronizar entre celulares, basta trocar load()/save() por chamadas
   de API — o resto do app (telas, listas, contas) não muda.
   ===================================================================== */
  const KEY = "nexo_hub_familiar_v1";
  const Store = {
    load(){
      try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
      return null;
    },
    save(state){
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    }
  };

/* ===================== utilitários ===================== */
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const uid = ()=>"id"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
  const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const MESABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  const TODAY = ymd(new Date());
  function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
  function fmtLong(s){ const d=parseYmd(s); return DIAS[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()]; }
  function fmtShort(s){ const d=parseYmd(s); return d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0"); }
  function relDay(s){
    if(s===TODAY) return "hoje";
    if(s===addDays(TODAY,1)) return "amanhã";
    if(s===addDays(TODAY,-1)) return "ontem";
    return fmtShort(s);
  }
  function greeting(){ const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }
  const cap=(s)=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  function timeAgo(iso){
    const diff=Date.now()-new Date(iso).getTime(), m=Math.floor(diff/60000);
    if(m<1) return "agora"; if(m<60) return m+" min"; const h=Math.floor(m/60);
    if(h<24) return h+"h"; const d=Math.floor(h/24); if(d<7) return d+"d";
    return fmtShort(iso.slice(0,10));
  }

  const COLORS = ["#0f766e","#e0592b","#7c3aed","#2563eb","#db2777","#ca8a04","#0891b2","#16a34a","#dc2626","#4f46e5"];
  const EMOJIS = ["😀","😎","🧒","👦","👧","👩","👨","👵","👴","🐱","🐶","⚽","🎸","🌸","🚀","🦄","🐢","🦊","🍀","⭐"];

/* ===================== estado ===================== */
  let S = Store.load();
  let sessionMemberId = null;   // quem está logado agora
  let tab = "hoje";
  let mealDay = TODAY;          // dia visível no cardápio
  let taskFilter = "todas";

  function persist(){ Store.save(S); }
  function member(id){ return (S&&S.members||[]).find(m=>m.id===id) || null; }
  function me(){ return member(sessionMemberId); }
  function memberName(id){ const m=member(id); return m?m.name:"—"; }

/* ===================== seed / onboarding ===================== */
  function seedContent(firstMemberId){
    // Conteúdo de exemplo (editável) pra família ver o Hub "vivo" no 1º acesso.
    S.tasks = [
      { id:uid(), title:"Tirar o lixo", assignee:firstMemberId, date:TODAY, done:false, createdBy:firstMemberId, createdAt:new Date().toISOString() },
      { id:uid(), title:"Regar as plantas", assignee:null, date:TODAY, done:false, createdBy:firstMemberId, createdAt:new Date().toISOString() },
      { id:uid(), title:"Lavar a louça", assignee:firstMemberId, date:addDays(TODAY,1), done:false, createdBy:firstMemberId, createdAt:new Date().toISOString() },
    ];
    S.shopping = [
      { id:uid(), name:"Leite", qty:"2", done:false, addedBy:firstMemberId, createdAt:new Date().toISOString() },
      { id:uid(), name:"Pão", qty:"", done:false, addedBy:firstMemberId, createdAt:new Date().toISOString() },
      { id:uid(), name:"Frutas", qty:"", done:false, addedBy:firstMemberId, createdAt:new Date().toISOString() },
    ];
    S.meals = {};
    S.meals[TODAY] = { cafe:"Café, pão e frutas", almoco:"Arroz, feijão, frango e salada", jantar:"Sopa" };
    S.notes = [
      { id:uid(), text:"Bem-vindos ao nosso Hub! 💛 Aqui a gente combina as coisas da casa.", author:firstMemberId, createdAt:new Date().toISOString() },
    ];
    S.dates = [];
  }

  function createFamily(famName, first){
    S = { version:1, family:famName.trim()||"Família", members:[], tasks:[], shopping:[], meals:{}, notes:[], dates:[] };
    const m = { id:uid(), name:first.name.trim(), emoji:first.emoji, color:first.color, role:"responsavel", pin:first.pin||"" };
    S.members.push(m);
    seedContent(m.id);
    persist();
    return m.id;
  }

/* ===================== render raiz ===================== */
  function render(){
    if(!S || !S.members || !S.members.length){ renderOnboarding(); return; }
    if(!sessionMemberId || !member(sessionMemberId)){ renderLock(); return; }
    renderApp();
  }

/* ===================== onboarding (1ª vez) ===================== */
  let onbColor = COLORS[0], onbEmoji = EMOJIS[0];
  function renderOnboarding(){
    onbColor = COLORS[0]; onbEmoji = EMOJIS[3];
    $("root").innerHTML = `
      <div class="lock">
        <div class="logo"><img src="assets/nexo-emblem.png" alt="NEXO"/></div>
        <h1>Hub da Família</h1>
        <p class="sub">Vamos começar criando a sua família e o seu perfil.</p>
        <div class="modal" style="box-shadow:var(--shadow)">
          <div class="stack">
            <div class="fld">
              <label>Nome da família</label>
              <input id="ob-fam" class="add" type="text" placeholder="Ex.: Família Suprir" style="width:100%"/>
            </div>
            <div class="fld">
              <label>Seu nome</label>
              <input id="ob-name" type="text" placeholder="Como te chamam em casa" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px"/>
            </div>
            <div class="fld">
              <label>Escolha um avatar</label>
              <div class="emopick" id="ob-emo">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===onbEmoji?'on':''}">${e}</button>`).join("")}</div>
            </div>
            <div class="fld">

  function askPin(m){
    let entered="";
    const wrap=document.createElement("div");
    wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal" style="max-width:340px;text-align:center">
        <span class="av lg" style="background:${m.color};margin:0 auto 10px">${m.emoji||m.name.slice(0,1)}</span>
        <h3 style="text-align:center">${esc(m.name)}</h3>
        <p class="msub" style="text-align:center">Digite seu PIN</p>
        <div class="pinwrap">
          <div class="pindots" id="pd">${[0,1,2,3].map(()=>'<span class="pd"></span>').join("")}</div>
          <div class="pad" id="pad">
            ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
            <button class="ghost" data-act="cancel">voltar</button>
            <button data-n="0">0</button>
            <button class="ghost" data-act="del">⌫</button>
          </div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    const dots=wrap.querySelector("#pd");
    const draw=()=>{[...dots.children].forEach((d,i)=>d.classList.toggle("on",i<entered.length));};
    wrap.querySelector("#pad").addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.act==="cancel"){ wrap.remove(); return; }
      if(b.dataset.act==="del"){ entered=entered.slice(0,-1); draw(); return; }
      if(entered.length>=4) return;
      entered+=b.dataset.n; draw();
      if(entered.length===4){
        if(entered===m.pin){ wrap.remove(); sessionMemberId=m.id; render(); }
        else { dots.classList.add("err"); setTimeout(()=>{dots.classList.remove("err"); entered=""; draw();},400); }
      }
    });
  }

/* ---------- HOJE (resumo do dia) ---------- */
  function nextOccurrence(mmdd_or_date, recurring){
    // devolve {date, days} da próxima ocorrência
    const base=parseYmd(mmdd_or_date);
    let occ=new Date(base);
    if(recurring){
      const now=parseYmd(TODAY);
      occ=new Date(now.getFullYear(),base.getMonth(),base.getDate());
      if(ymd(occ)<TODAY) occ.setFullYear(occ.getFullYear()+1);
    }
    const days=Math.round((occ-parseYmd(TODAY))/86400000);
    return { date:ymd(occ), days };
  }
  function upcomingDates(){
    return (S.dates||[]).map(d=>{ const n=nextOccurrence(d.date, d.type==="aniversario"||d.recurring); return {...d, next:n.date, days:n.days}; })
      .filter(d=>d.days>=0).sort((a,b)=>a.days-b.days);
  }

              <div class="li-s">${m.role==="responsavel"?"responsável":"membro"}${m.pin?' · 🔒 com PIN':''}</div></div>
            ${(isAdmin||m.id===sessionMemberId)?`<button class="btn sm" data-editm="${m.id}">Editar</button>`:""}
            ${(isAdmin&&m.id!==sessionMemberId&&S.members.length>1)?`<button class="x" data-delm="${m.id}" title="Remover">✕</button>`:""}
          </div>`).join("")}
        ${isAdmin?`<div class="rowbtns"><button class="btn pri" id="fm-add">＋ Adicionar membro</button></div>`:`<div class="li-s" style="margin-top:12px">Só o responsável pode adicionar ou remover membros.</div>`}
      </div>

      <div class="panel full">
        <div class="ph"><span class="ic">⚙️</span><h3>Configurações</h3></div>
        <div class="fld" style="margin-bottom:14px">
          <label>Nome da família</label>
          <div class="add" style="margin-top:0">
            <input id="fm-name" type="text" value="${esc(S.family)}" ${isAdmin?'':'disabled'} style="flex:2 1 200px"/>
            ${isAdmin?`<button class="btn" id="fm-rename">Salvar</button>`:""}
          </div>
        </div>
        <div class="rowbtns">
          <button class="btn sm" id="fm-export">⬇ Exportar dados (backup)</button>
          <button class="btn sm" id="fm-import">⬆ Importar backup</button>
          ${isAdmin?`<button class="btn sm danger" id="fm-reset">Apagar tudo</button>`:""}
        </div>
        <input id="fm-file" type="file" accept="application/json" class="hide"/>
        <div class="li-s" style="margin-top:12px">Os dados ficam guardados só neste aparelho. Faça um backup para levar pra outro celular.</div>
      </div>
    </div>`;
  }

/* ===================== wiring (eventos por view) ===================== */
  function wireView(){
    const v=$("view");

    // navegação por botões "ir para aba"
    v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.go; renderApp(); }));

    // toggles compartilhados (hoje + tarefas)
    v.querySelectorAll("[data-toggletask]").forEach(b=>b.addEventListener("click",()=>{ const t=(S.tasks||[]).find(x=>x.id===b.dataset.toggletask); if(t){t.done=!t.done;persist();renderView();} }));
    v.querySelectorAll("[data-deltask]").forEach(b=>b.addEventListener("click",()=>{ S.tasks=S.tasks.filter(x=>x.id!==b.dataset.deltask);persist();renderView(); }));
    v.querySelectorAll("[data-toggleshop]").forEach(b=>b.addEventListener("click",()=>{ const s=(S.shopping||[]).find(x=>x.id===b.dataset.toggleshop); if(s){s.done=!s.done;persist();renderView();} }));
    v.querySelectorAll("[data-delshop]").forEach(b=>b.addEventListener("click",()=>{ S.shopping=S.shopping.filter(x=>x.id!==b.dataset.delshop);persist();renderView(); }));
    v.querySelectorAll("[data-delnote]").forEach(b=>b.addEventListener("click",()=>{ S.notes=S.notes.filter(x=>x.id!==b.dataset.delnote);persist();renderView(); }));
    v.querySelectorAll("[data-deldate]").forEach(b=>b.addEventListener("click",()=>{ S.dates=S.dates.filter(x=>x.id!==b.dataset.deldate);persist();renderView(); }));

    if(tab==="tarefas"){
      v.querySelectorAll("[data-tf]").forEach(b=>b.addEventListener("click",()=>{ taskFilter=b.dataset.tf; renderView(); }));
      const add=()=>{
        const title=$("tk-title").value.trim(); if(!title)return;
        S.tasks.push({ id:uid(), title, assignee:$("tk-who").value||null, date:$("tk-date").value||null, done:false, createdBy:sessionMemberId, createdAt:new Date().toISOString() });
        persist(); renderView();
      };
      $("tk-add").addEventListener("click",add);
      $("tk-title").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
    }

    if(tab==="compras"){
      const add=()=>{
        const name=$("sh-name").value.trim(); if(!name)return;
        S.shopping.push({ id:uid(), name, qty:($("sh-qty").value||"").trim(), done:false, addedBy:sessionMemberId, createdAt:new Date().toISOString() });
        persist(); renderView();
      };
      $("sh-add").addEventListener("click",add);
      $("sh-name").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
      const clr=$("sh-clear"); if(clr) clr.addEventListener("click",()=>{ S.shopping=S.shopping.filter(s=>!s.done); persist(); renderView(); });
    }

    if(tab==="cardapio"){
      $("md-prev").addEventListener("click",()=>{ mealDay=addDays(mealDay,-1); renderView(); });
      $("md-next").addEventListener("click",()=>{ mealDay=addDays(mealDay,1); renderView(); });
      const td=$("md-today"); if(td) td.addEventListener("click",()=>{ mealDay=TODAY; renderView(); });
      $("ml-save").addEventListener("click",()=>{
        if(!S.meals)S.meals={};
        S.meals[mealDay]={ cafe:$("ml-cafe").value.trim(), almoco:$("ml-almoco").value.trim(), jantar:$("ml-jantar").value.trim() };
        persist(); $("ml-ok").textContent="✓ salvo"; setTimeout(()=>{const e=$("ml-ok");if(e)e.textContent="";},1500);
      });
    }

    if(tab==="recados"){
      $("nt-add").addEventListener("click",()=>{
        const text=$("nt-text").value.trim(); if(!text)return;
        S.notes.push({ id:uid(), text, author:sessionMemberId, createdAt:new Date().toISOString() });
        persist(); renderView();
      });
    }

    if(tab==="datas"){
      $("dt-add").addEventListener("click",()=>{
        const title=$("dt-title").value.trim(), date=$("dt-date").value;
        if(!title||!date)return;
        S.dates.push({ id:uid(), title, date, type:$("dt-type").value, recurring:$("dt-type").value==="aniversario" });
        persist(); renderView();
      });
    }

    if(tab==="familia"){
      v.querySelectorAll("[data-editm]").forEach(b=>b.addEventListener("click",()=>openMemberModal(member(b.dataset.editm),false)));
      v.querySelectorAll("[data-delm]").forEach(b=>b.addEventListener("click",()=>{
        const m=member(b.dataset.delm); if(!m)return;
        if(confirm("Remover "+m.name+" da família?")){ S.members=S.members.filter(x=>x.id!==m.id); persist(); renderView(); }
      }));
      const addBtn=$("fm-add"); if(addBtn) addBtn.addEventListener("click",()=>openMemberModal(null,false));
      const rn=$("fm-rename"); if(rn) rn.addEventListener("click",()=>{ const nv=$("fm-name").value.trim(); if(nv){S.family=nv;persist();renderApp();} });
      $("fm-export").addEventListener("click",exportData);
      $("fm-import").addEventListener("click",()=>$("fm-file").click());
      $("fm-file").addEventListener("change",importData);
      const rs=$("fm-reset"); if(rs) rs.addEventListener("click",()=>{
        if(confirm("Isso apaga TODA a família e os dados deste aparelho. Continuar?")){ localStorage.removeItem(KEY); S=null; sessionMemberId=null; render(); }
      });
    }
  }

/* ===================== modal de membro (criar/editar) ===================== */
  function openMemberModal(existing, fromLock){
    const editing=!!existing;
    let em = existing? existing.emoji : EMOJIS[3];
    let col = existing? existing.color : COLORS[S.members.length % COLORS.length];
    const canRole = me() ? me().role==="responsavel" : true; // no lock/onboarding admin implícito
    const wrap=document.createElement("div");
    wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>${editing?"Editar perfil":"Novo perfil"}</h3>
        <p class="msub">${editing?"Atualize as informações do perfil.":"Adicione uma pessoa da família."}</p>
        <div class="stack">
          <div class="fld"><label>Nome</label>
            <input id="mm-name" type="text" value="${editing?esc(existing.name):''}" placeholder="Nome" style="border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px"/></div>
          <div class="fld"><label>Avatar</label><div class="emopick" id="mm-emo">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===em?'on':''}">${e}</button>`).join("")}</div></div>
          <div class="fld"><label>Cor</label><div class="swatches" id="mm-col">${COLORS.map(c=>`<span class="sw ${c===col?'on':''}" data-c="${c}" style="background:${c}"></span>`).join("")}</div></div>
          ${canRole?`<div class="fld"><label>Papel</label>
            <select id="mm-role" style="border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px">
              <option value="membro" ${editing&&existing.role==="membro"?"selected":""}>Membro</option>
              <option value="responsavel" ${editing&&existing.role==="responsavel"?"selected":""}>Responsável</option>
            </select></div>`:""}
          <div class="fld"><label>PIN (opcional, 4 dígitos)</label>
            <input id="mm-pin" type="text" inputmode="numeric" maxlength="4" value="${editing?esc(existing.pin||''):''}" placeholder="deixe vazio pra não usar" style="border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px;letter-spacing:.3em"/></div>
          <div class="rowbtns" style="margin-top:4px">
            <button class="btn pri" id="mm-save">${editing?"Salvar":"Adicionar"}</button>
            <button class="btn" id="mm-cancel">Cancelar</button>
          </div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    wrap.querySelector("#mm-emo").addEventListener("click",e=>{const b=e.target.closest("button[data-e]");if(!b)return;em=b.dataset.e;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));});
    wrap.querySelector("#mm-col").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;col=b.dataset.c;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));});
    wrap.querySelector("#mm-cancel").addEventListener("click",()=>wrap.remove());
    wrap.querySelector("#mm-save").addEventListener("click",()=>{
      const name=wrap.querySelector("#mm-name").value.trim(); if(!name){wrap.querySelector("#mm-name").focus();return;}
      const pin=(wrap.querySelector("#mm-pin").value||"").replace(/\D/g,"").slice(0,4);
      const roleEl=wrap.querySelector("#mm-role");
      const role = roleEl ? roleEl.value : (existing?existing.role:"membro");
      if(editing){ existing.name=name; existing.emoji=em; existing.color=col; existing.pin=pin; existing.role=role; }
      else { const m={ id:uid(), name, emoji:em, color:col, role, pin }; S.members.push(m); }
      persist(); wrap.remove();
      if(fromLock) renderLock(); else if(sessionMemberId) renderApp(); else render();
    });
  }

/* ===================== backup ===================== */
  function exportData(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="hub-familia-"+(S.family||"backup").toLowerCase().replace(/\s+/g,"-")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function importData(e){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const obj=JSON.parse(r.result);
        if(!obj||!Array.isArray(obj.members)) throw new Error("inválido");
        if(confirm("Substituir os dados atuais pelo backup importado?")){ S=obj; sessionMemberId=null; persist(); render(); }
      }catch(err){ alert("Arquivo de backup inválido."); }
    };
    r.readAsText(f);
  }

/* ===================== splash + boot ===================== */
  (function(){
    const sp=$("splash"); if(!sp) return;
    let done=false; const go=()=>{ if(done)return; done=true; sp.classList.add("gone"); setTimeout(()=>sp.remove(),600); };
    sp.addEventListener("click",go);
    sp.addEventListener("touchstart",go,{passive:true});
    setTimeout(go,2600);
  })();

  render();
})();
</script>
