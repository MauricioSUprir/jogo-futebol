<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<title>Hub da Família</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hub da Família" />
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --card:#fcfcfb; --text:#0b0b0b; --text2:#52514e; --muted:#898781;
    --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --brand:#0f766e; --brand-soft:#dbeee9;
    --accent:#e08a1e; --accent-soft:#fbecd4;
    --good:#0ca30c; --good-soft:#e3f6e3; --bad:#d03b3b; --bad-soft:#fce8e8;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 10px 30px rgba(11,11,11,.05);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:#0d0d0d; --card:#1a1a19; --text:#fff; --text2:#c3c2b7; --muted:#898781;
      --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
      --brand:#2dd4bf; --brand-soft:#12332a;
      --accent:#f0a742; --accent-soft:#3a2a12;
      --good:#3ecf5f; --good-soft:#12331c; --bad:#e66767; --bad-soft:#3a1414;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 16px 96px}
  .hide{display:none!important}
  .spacer{flex:1}

  /* splash */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 50% 0%, #12564f 0%, #0a0f0e 72%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;
    transition:opacity .5s ease, visibility .5s ease}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash img{width:min(42vw,150px);height:auto;border-radius:34px;box-shadow:0 22px 60px rgba(45,212,191,.28);
    animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
  #splash .stitle{color:#eafffb;font-size:23px;font-weight:800;letter-spacing:-.02em;animation:fade 1.1s ease .25s both}
  #splash .enter{color:#7de3d0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:9px;opacity:.9;animation:fade 1.4s ease .5s both}
  #splash .enter .d{width:7px;height:7px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 12px #2dd4bf;animation:blink 1.3s infinite}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:.9}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){#splash img,#splash .enter{animation:none}}

  /* avatar */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .av.sm{width:30px;height:30px;font-size:15px}
  .av.md{width:44px;height:44px;font-size:22px}
  .av.lg{width:76px;height:76px;font-size:38px}

  /* ===== login ===== */
  .lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;text-align:center}
  .lock .logo{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#2dd4bf,#0f766e);box-shadow:0 10px 26px rgba(15,118,110,.32);margin-bottom:14px}
  .lock .logo svg{width:60%;height:60%}
  .lock h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .lock .fam{margin:2px 0 4px;color:var(--brand);font-weight:700}
  .lock p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
  .loginform{width:100%;max-width:330px;display:flex;flex-direction:column;gap:11px}
  .loginform input{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;width:100%;box-shadow:var(--shadow)}
  .loginform input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .loginerr{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
  .quick{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .quick button{background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px}
  .quick .av{transition:transform .15s}
  .quick button:hover .av{transform:translateY(-3px) scale(1.05)}
  .quick .nm{font-size:12px;color:var(--text2);font-weight:650}
  .quick .rl{font-size:10.5px;color:var(--muted)}
  .lock .foot{margin-top:30px;color:var(--muted);font-size:12px;max-width:340px}

  /* ===== app shell ===== */
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2dd4bf,#0f766e);box-shadow:0 6px 16px rgba(15,118,110,.3);flex:none}
  .brand .mark svg{width:62%;height:62%}
  .brand h1{font-size:19px;margin:0;font-weight:780;letter-spacing:-.02em;white-space:nowrap}
  .brand p{margin:0;font-size:12.5px;color:var(--muted)}
  .me{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow)}
  .me .nm{font-size:13px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me .role{font-size:11px;color:var(--muted)}

  .hello{margin:2px 0 16px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .hello h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .hello p{margin:2px 0 0;color:var(--muted);font-size:13px}

  /* tabs */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:transparent;color:var(--text2);cursor:pointer;padding:9px 15px;border-radius:10px;font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tabs button.active{background:var(--brand);color:#fff}

  /* cards / panels */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid .full{grid-column:1/-1}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
  .panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .panel .ph .ic{font-size:18px}
  .panel h3{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em}
  .panel .cnt{font-size:12px;color:var(--muted);margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:650}

  /* list rows */
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:15px;transition:.12s}
  .chk.on{background:var(--good);border-color:var(--good);color:#fff}
  .li-main{min-width:0;flex:1}
  .li-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .li-t.done{text-decoration:line-through;color:var(--muted);font-weight:500}
  .li-s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:1px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600}
  .tag.mine{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
  .tag.warn{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .tag.late{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;border-radius:8px;flex:none}
  .x:hover{color:var(--bad);background:var(--bad-soft)}

  /* forms */
  .add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .add input[type=text],.add input[type=date],.add input[type=time],.add input[type=number],.add input[type=email],.add input[type=password],.add select,.add textarea{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);
    border-radius:11px;padding:10px 12px;font-size:14px;outline:none}
  .add input:focus,.add select:focus,.add textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .add textarea{resize:vertical;min-height:44px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{filter:brightness(1.05);color:#fff}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .w100{width:100%}
  .fld{display:flex;flex-direction:column;gap:5px;text-align:left}
  .fld label{font-size:12px;color:var(--muted);font-weight:650}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}

  .empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

  /* meals */
  .meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal .mi{font-size:22px;flex:none;width:30px;text-align:center}
  .meal .mb{flex:1;min-width:0}
  .meal .ml{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .meal .mv{font-size:14.5px;margin-top:2px;white-space:pre-wrap}
  .meal .mv.ph{color:var(--muted);font-style:italic}
  .meal input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:4px}
  .dayblock{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
  .dayblock.today{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 16%,transparent)}
  .dayblock .dh{font-weight:750;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .dayblock .dh .badge{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 8px}

  .daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .daynav .lbl{font-weight:700;font-size:14.5px}
  .icobtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--text2)}
  .icobtn:hover{color:var(--brand);border-color:var(--brand)}

  /* ===== avisos / comunicados ===== */
  .ann{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .ann .ah{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .ann .an{font-weight:750;font-size:13.5px}
  .ann .at{font-size:11.5px;color:var(--muted);margin-left:auto}
  .ann .abody{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-top:6px}
  .ann img.ai{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:10px;display:block;border:1px solid var(--line)}
  .tchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .comments{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:9px}
  .cmt{display:flex;gap:8px;align-items:flex-start}
  .cmt .cb{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px}
  .cmt .cn{font-size:12px;font-weight:750}
  .cmt .ct{font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
  .cmt .cx{font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:1px}
  .cmtbox{display:flex;gap:8px;margin-top:4px}
  .cmtbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;font-size:13.5px;outline:none}
  .cmtbox input:focus{border-color:var(--brand)}
  .targetgrid{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:2px}
  .chkfield{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
  .chkfield input{width:17px;height:17px;accent-color:var(--brand)}
  .filepick{display:flex;align-items:center;gap:12px;margin-top:4px}
  .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}

  /* ===== pontos / placar ===== */
  .pointbadge{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px}
  .money{color:var(--good);font-weight:800}
  .placar-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .placar-row:last-child{border-bottom:0}
  .rank{width:26px;text-align:center;font-weight:800;color:var(--muted);font-size:16px;flex:none}
  .rank.top{color:var(--accent)}
  .pts-big{font-weight:800;font-size:17px;line-height:1.1}
  .pts-sub{font-size:12px;color:var(--muted)}
  .totalbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .totalbar .tb{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .totalbar .tb .k{font-size:12px;color:var(--muted);font-weight:650}
  .totalbar .tb .v{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.02em}

  /* member manager */
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:var(--text)}
  .emopick{display:flex;gap:6px;flex-wrap:wrap}
  .emopick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
  .emopick button.on{border-color:var(--brand);background:var(--brand-soft)}

  /* modal */
  .ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:440px;max-height:90dvh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:780}
  .modal .msub{margin:0 0 16px;color:var(--muted);font-size:13px}
  .stack{display:flex;flex-direction:column;gap:14px}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div id="splash">
  <img src="assets/icon.svg" alt="Hub da Família" />
  <div class="stitle">Hub da Família</div>
  <div class="enter"><span class="d"></span>Toque para entrar</div>
</div>

<div id="root"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   CAMADA DE DADOS (Store) — única parte que muda pra ligar num servidor.
   ---------------------------------------------------------------------
   Hoje persiste no próprio aparelho (localStorage). As 4 contas da família
   entram com e-mail + senha. Para virar login de verdade (sincronizado
   entre celulares), basta trocar load()/save() e a função auth() por
   chamadas de API — o resto do app não muda.
   AVISO: por ser estático, as senhas ficam neste aparelho — não use senhas
   sensíveis aqui; a versão com servidor guarda tudo com segurança.
   ===================================================================== */
  const KEY = "hub_familia_v2";
  const SKEY = "hub_familia_sess";
  const Store = {
    load(){ try{ const raw=localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){} return null; },
    save(state){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  };

/* ===================== utilitários ===================== */
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const uid = ()=>"id"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
  const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  const DIASABREV = ["dom","seg","ter","qua","qui","sex","sáb"];
  const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseYmd(s){ const p=String(s).split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
  const TODAY = ymd(new Date());
  function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
  function mondayOf(s){ const d=parseYmd(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); }
  function fmtLong(s){ const d=parseYmd(s); return DIAS[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()]; }
  function fmtShort(s){ const d=parseYmd(s); return d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0"); }
  function greeting(){ const h=new Date().getHours(); return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"; }
  const cap=(s)=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  function timeAgo(iso){
    const diff=Date.now()-new Date(iso).getTime(), m=Math.floor(diff/60000);
    if(m<1) return "agora"; if(m<60) return m+" min"; const h=Math.floor(m/60);
    if(h<24) return h+"h"; const d=Math.floor(h/24); if(d<7) return d+"d";
    return fmtShort(iso.slice(0,10));
  }
  const BRL = (n)=>"R$ "+(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

  const GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/><path d="M12 12.4c-.8-1-2.5-.5-2.5.8 0 1.2 1.7 2.2 2.5 2.9.8-.7 2.5-1.7 2.5-2.9 0-1.3-1.7-1.8-2.5-.8Z" fill="#fff" stroke="none"/></svg>';
  const COLORS = ["#2563eb","#db2777","#e0592b","#7c3aed","#0891b2","#16a34a","#ca8a04","#dc2626","#0f766e","#4f46e5"];

/* ===================== imagem (redimensiona pra caber) ===================== */
  function readImageResized(file, maxDim, cb){
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.82)); }catch(e){ cb(null); }
    }; img.onerror=()=>cb(null); img.src=r.result; };
    r.readAsDataURL(file);
  }

        ${rows.length?rows.map((r,i)=>`<div class="placar-row">
          <div class="rank ${i<3?'top':''}">${i<3?medals[i]:(i+1)}</div>
          <span class="av md" style="background:${r.m.color}">${r.m.emoji||r.m.name.slice(0,1)}</span>
          <div class="li-main"><div class="li-t">${esc(r.m.name)}</div><div class="pts-sub">${BRL(money(r.pts))}</div></div>
          <div style="text-align:right"><div class="pts-big">${r.pts}</div><div class="pts-sub">pontos</div></div>
        </div>`).join(""):`<div class="empty">Sem membros para pontuar.</div>`}
        <div class="totalbar">
          <div class="tb"><div class="k">Total de pontos</div><div class="v">${totalPts}</div></div>
          <div class="tb"><div class="k">Total em dinheiro</div><div class="v money">${BRL(money(totalPts))}</div></div>
        </div>
      </div>
      ${adminTools}`;
  }

/* ---------- ENCONTROS ---------- */
  function viewEncontros(){
    const admin=isAdmin();
    const list=(S.meetings||[]).slice().filter(m=>m.date>=TODAY || true).sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1);
    const compose = admin ? `
      <div class="panel full">
        <div class="ph"><span class="ic">➕</span><h3>Marcar encontro</h3></div>
        <div class="add">
          <input id="mt-title" type="text" placeholder="Título (ex.: almoço de domingo)" style="flex:2 1 200px"/>
          <input id="mt-date" type="date" value="${TODAY}"/>
          <input id="mt-time" type="time" value="12:00"/>
          <input id="mt-place" type="text" placeholder="Local" style="flex:1 1 140px"/>
          <button class="btn pri" id="mt-add">Marcar</button>
        </div>
        <div class="add" style="margin-top:8px"><input id="mt-note" type="text" placeholder="Observação (opcional)" style="flex:1 1 100%"/></div>
      </div>` : "";
    return `${compose}
      <div class="panel full">
        <div class="ph"><span class="ic">📅</span><h3>Próximos encontros</h3><span class="cnt">${list.length}</span></div>
        ${list.length?`<ul class="list">${list.map(m=>{
          const past=m.date<TODAY;
          return `<li>
            <span style="font-size:22px">${past?'✅':'📌'}</span>
            <div class="li-main"><div class="li-t">${esc(m.title)}</div>
              <div class="li-s"><span class="tag ${past?'':'warn'}">${cap(DIASABREV[parseYmd(m.date).getDay()])} ${fmtShort(m.date)}${m.time?' · '+esc(m.time):''}</span>${m.place?`<span class="tag">📍 ${esc(m.place)}</span>`:''}${m.note?`<span>${esc(m.note)}</span>`:''}</div></div>
            ${admin?`<button class="x" data-delmt="${m.id}" title="Remover">✕</button>`:''}
          </li>`;}).join("")}</ul>`:`<div class="empty">Nenhum encontro marcado.</div>`}
      </div>`;
  }

/* ---------- CONTA / CONTAS ---------- */
  function viewConta(){
    const admin=isAdmin(), u=me();
    if(admin){
      return `
        <div class="panel full">
          <div class="ph"><span class="ic">👪</span><h3>Contas da família</h3><span class="cnt">${S.members.length}</span></div>
          ${S.members.map(m=>`<div class="mrow">
            <span class="av md" style="background:${m.color}">${m.emoji||m.name.slice(0,1)}</span>
            <div class="li-main"><div class="li-t">${esc(m.name)}${m.id===sessionId?' <span class="tag mine">você</span>':''}</div>
              <div class="li-s">${m.role==="admin"?"admin":"membro"} · ${esc(m.email)}</div></div>
            <button class="btn sm" data-editm="${m.id}">Editar</button>
          </div>`).join("")}
          <p class="li-s" style="margin-top:12px">São 4 contas fixas. Você pode mudar nome, e-mail, senha, papel, avatar e cor de cada uma.</p>
        </div>
        <div class="panel full">
          <div class="ph"><span class="ic">⚙️</span><h3>Configurações</h3></div>
          <div class="grid">
            <div class="fld"><label>Nome da família</label>
              <div class="add" style="margin-top:0"><input id="cf-fam" type="text" value="${esc(S.family)}" style="flex:2 1 160px"/><button class="btn" id="cf-fam-save">Salvar</button></div></div>
            <div class="fld"><label>Valor de cada ponto (R$)</label>
              <div class="add" style="margin-top:0"><input id="cf-val" type="number" min="0" step="0.05" value="${S.pointValue}" style="flex:1 1 120px"/><button class="btn" id="cf-val-save">Salvar</button></div></div>
          </div>
          <div class="rowbtns" style="margin-top:16px">
            <button class="btn sm" id="cf-export">⬇ Exportar backup</button>
            <button class="btn sm" id="cf-import">⬆ Importar backup</button>
            <button class="btn sm danger" id="cf-reset">Reiniciar tudo</button>
          </div>
          <input id="cf-file" type="file" accept="application/json" class="hide"/>
          <p class="li-s" style="margin-top:12px">Dados guardados só neste aparelho. Faça backup pra levar pra outro celular. Para login sincronizado entre celulares, dá pra ligar num servidor depois.</p>
        </div>`;
    }
    const pts=memberPoints(u.id);
    return `<div class="panel full">
      <div class="ph"><span class="ic">⚙️</span><h3>Sua conta</h3></div>
      <div class="mrow">
        <span class="av md" style="background:${u.color}">${u.emoji||u.name.slice(0,1)}</span>
        <div class="li-main"><div class="li-t">${esc(u.name)}</div><div class="li-s">membro · ${esc(u.email)}</div></div>
      </div>
      <div class="totalbar">
        <div class="tb"><div class="k">Seus pontos</div><div class="v">${pts}</div></div>
        <div class="tb"><div class="k">Em dinheiro</div><div class="v money">${BRL(money(pts))}</div></div>
      </div>
      <div class="fld" style="margin-top:16px"><label>Trocar sua senha</label>
        <div class="add" style="margin-top:0"><input id="pw-new" type="password" placeholder="Nova senha" style="flex:2 1 160px"/><button class="btn pri" id="pw-save">Salvar</button></div>
      </div>
      <div class="rowbtns"><button class="btn danger" id="me-logout">Sair da conta</button></div>
    </div>`;
  }

/* ===================== wiring ===================== */
  function wireView(){
    const v=$("view");

    if(tab==="avisos"){
      // compositor (admin)
      if(isAdmin()){
        const fileEl=$("an-file"), thumb=$("an-thumb"), rmimg=$("an-rmimg"), pick=$("an-pick");
        if(pick){
          pick.addEventListener("click",()=>fileEl.click());
          fileEl.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; readImageResized(f,1200,(url)=>{ composeImg=url; if(url){ thumb.src=url; thumb.classList.remove("hide"); rmimg.classList.remove("hide"); } }); });
          rmimg.addEventListener("click",()=>{ composeImg=null; fileEl.value=""; thumb.classList.add("hide"); rmimg.classList.add("hide"); });
        }
        const allBox=$("an-all"), tBoxes=()=>[...v.querySelectorAll(".an-t")];
        if(allBox){
          allBox.addEventListener("change",()=>{ if(allBox.checked) tBoxes().forEach(b=>b.checked=false); });
          tBoxes().forEach(b=>b.addEventListener("change",()=>{ if(tBoxes().some(x=>x.checked)) allBox.checked=false; if(!tBoxes().some(x=>x.checked)) allBox.checked=true; }));
        }
        const post=$("an-post");
        if(post) post.addEventListener("click",()=>{
          const text=($("an-text").value||"").trim();
          if(!text && !composeImg){ $("an-text").focus(); return; }
          let targets;
          if(allBox.checked || !tBoxes().some(b=>b.checked)) targets=["all"];
          else targets=tBoxes().filter(b=>b.checked).map(b=>b.value);
          S.announcements.push({ id:uid(), authorId:sessionId, text, image:composeImg||null, targets, createdAt:new Date().toISOString(), comments:[] });
          composeImg=null; persist(); renderView();
        });
      }
      // comentar + apagar
      v.querySelectorAll("[data-cmtsend]").forEach(b=>b.addEventListener("click",()=>sendComment(b.dataset.cmtsend)));
      v.querySelectorAll("[data-cmt]").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") sendComment(inp.dataset.cmt); }));
      v.querySelectorAll("[data-delann]").forEach(b=>b.addEventListener("click",()=>{ if(confirm("Apagar este aviso?")){ S.announcements=S.announcements.filter(a=>a.id!==b.dataset.delann); persist(); renderView(); } }));
    }

    if(tab==="atividades"){
      if(isAdmin()){
        const add=()=>{
          const title=($("ac-title").value||"").trim(); const pts=Math.max(0,parseInt($("ac-points").value,10)||0);
          if(!title) return;
          S.activities.push({ id:uid(), title, points:pts, assignedTo:$("ac-who").value||null, date:$("ac-date").value||TODAY, createdBy:sessionId, createdAt:new Date().toISOString(), done:false, doneBy:null, doneAt:null });
          persist(); renderView();
        };
        const b=$("ac-add"); if(b) b.addEventListener("click",add);
        $("ac-title") && $("ac-title").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
        v.querySelectorAll("[data-delact]").forEach(x=>x.addEventListener("click",()=>{ const id=x.dataset.delact; S.activities=S.activities.filter(a=>a.id!==id); S.pointLog=(S.pointLog||[]).filter(p=>p.activityId!==id); persist(); renderView(); }));
        v.querySelectorAll("[data-reopen]").forEach(x=>x.addEventListener("click",()=>{ const id=x.dataset.reopen; const a=S.activities.find(z=>z.id===id); if(a){ a.done=false; a.doneBy=null; a.doneAt=null; S.pointLog=(S.pointLog||[]).filter(p=>p.activityId!==id); persist(); renderView(); } }));
      } else {
        v.querySelectorAll("[data-done]").forEach(x=>x.addEventListener("click",()=>{
          const a=S.activities.find(z=>z.id===x.dataset.done); if(!a||a.done)return;
          a.done=true; a.doneBy=sessionId; a.doneAt=new Date().toISOString();
          if(a.points>0) S.pointLog.push({ id:uid(), memberId:sessionId, delta:a.points, reason:"Atividade: "+a.title, byId:sessionId, activityId:a.id, createdAt:new Date().toISOString() });
          persist(); renderApp();
        }));
      }
    }

    if(tab==="cardapio"){
      $("wk-prev").addEventListener("click",()=>{ menuWeekStart=addDays(menuWeekStart,-7); renderView(); });
      $("wk-next").addEventListener("click",()=>{ menuWeekStart=addDays(menuWeekStart,7); renderView(); });
      $("wk-this").addEventListener("click",()=>{ menuWeekStart=mondayOf(TODAY); renderView(); });
      if(isAdmin()){
        v.querySelectorAll("input[data-menu]").forEach(inp=>inp.addEventListener("change",()=>{
          const d=inp.dataset.menu, slot=inp.dataset.slot;
          if(!S.menu[d]) S.menu[d]={cafe:"",almoco:"",jantar:""};
          S.menu[d][slot]=inp.value.trim(); persist();
        }));
      }
    }

    if(tab==="placar" && isAdmin()){
      const add=()=>{
        const who=$("aj-who").value; const delta=parseInt($("aj-pts").value,10);
        if(!who || !delta) return;
        S.pointLog.push({ id:uid(), memberId:who, delta, reason:($("aj-reason").value||"").trim()||"Ajuste do admin", byId:sessionId, createdAt:new Date().toISOString() });
        persist(); renderView();
      };
      const b=$("aj-add"); if(b) b.addEventListener("click",add);
      v.querySelectorAll("[data-dellog]").forEach(x=>x.addEventListener("click",()=>{ S.pointLog=S.pointLog.filter(p=>p.id!==x.dataset.dellog); persist(); renderView(); }));
    }

    if(tab==="encontros" && isAdmin()){
      const add=()=>{
        const title=($("mt-title").value||"").trim(); if(!title)return;
        S.meetings.push({ id:uid(), title, date:$("mt-date").value||TODAY, time:$("mt-time").value||"", place:($("mt-place").value||"").trim(), note:($("mt-note").value||"").trim(), createdBy:sessionId });
        persist(); renderView();
      };
      const b=$("mt-add"); if(b) b.addEventListener("click",add);
      v.querySelectorAll("[data-delmt]").forEach(x=>x.addEventListener("click",()=>{ S.meetings=S.meetings.filter(m=>m.id!==x.dataset.delmt); persist(); renderView(); }));
    }

    if(tab==="conta"){
      if(isAdmin()){
        v.querySelectorAll("[data-editm]").forEach(b=>b.addEventListener("click",()=>openAccountModal(member(b.dataset.editm))));
        $("cf-fam-save") && $("cf-fam-save").addEventListener("click",()=>{ const nv=($("cf-fam").value||"").trim(); if(nv){ S.family=nv; persist(); renderApp(); } });
        $("cf-val-save") && $("cf-val-save").addEventListener("click",()=>{ const nv=parseFloat($("cf-val").value); if(nv>=0){ S.pointValue=nv; persist(); renderApp(); } });
        $("cf-export").addEventListener("click",exportData);
        $("cf-import").addEventListener("click",()=>$("cf-file").click());
        $("cf-file").addEventListener("change",importData);
        $("cf-reset").addEventListener("click",()=>{ if(confirm("Reiniciar apaga TUDO (contas, avisos, pontos) e recria as 4 contas padrão. Continuar?")){ localStorage.removeItem(KEY); setSession(null); S=null; seed(); render(); } });
      } else {
        $("pw-save").addEventListener("click",()=>{ const nv=$("pw-new").value; if(!nv){ $("pw-new").focus(); return; } me().password=nv; persist(); $("pw-new").value=""; alert("Senha atualizada."); });
        $("me-logout").addEventListener("click",()=>{ setSession(null); render(); });
      }
    }
  }

  function sendComment(annId){
    const inp=$("view").querySelector(`[data-cmt="${annId}"]`);
    if(!inp) return;
    const text=(inp.value||"").trim(); if(!text) return;
    const a=S.announcements.find(x=>x.id===annId); if(!a) return;
    a.comments=a.comments||[];
    a.comments.push({ id:uid(), authorId:sessionId, text, createdAt:new Date().toISOString() });
    persist(); renderView();
  }

/* ===================== modal de conta (admin edita) ===================== */
  function openAccountModal(mem){
    if(!mem) return;
    let em=mem.emoji, col=mem.color;
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>Editar conta</h3>
        <p class="msub">Ajuste os dados de acesso e o perfil.</p>
        <div class="stack">
          <div class="fld"><label>Nome</label><input id="mm-name" type="text" value="${esc(mem.name)}"/></div>
          <div class="fld"><label>E-mail (login)</label><input id="mm-email" type="email" value="${esc(mem.email)}"/></div>
          <div class="fld"><label>Senha</label><input id="mm-pass" type="text" value="${esc(mem.password)}"/></div>
          <div class="fld"><label>Papel</label>
            <select id="mm-role">
              <option value="membro" ${mem.role==="membro"?"selected":""}>Membro (faz atividades e pontua)</option>
              <option value="admin" ${mem.role==="admin"?"selected":""}>Admin (dita, não pontua)</option>
            </select></div>
          <div class="fld"><label>Avatar</label><div class="emopick" id="mm-emo">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===em?'on':''}">${e}</button>`).join("")}</div></div>
          <div class="fld"><label>Cor</label><div class="swatches" id="mm-col">${COLORS.map(c=>`<span class="sw ${c===col?'on':''}" data-c="${c}" style="background:${c}"></span>`).join("")}</div></div>
          <div class="rowbtns"><button class="btn pri" id="mm-save">Salvar</button><button class="btn" id="mm-cancel">Cancelar</button></div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    wrap.querySelector("#mm-emo").addEventListener("click",e=>{const b=e.target.closest("button[data-e]");if(!b)return;em=b.dataset.e;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));});
    wrap.querySelector("#mm-col").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;col=b.dataset.c;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b));});
    wrap.querySelector("#mm-cancel").addEventListener("click",()=>wrap.remove());
    wrap.querySelector("#mm-save").addEventListener("click",()=>{
      const name=(wrap.querySelector("#mm-name").value||"").trim();
      const email=(wrap.querySelector("#mm-email").value||"").trim().toLowerCase();
      const pass=wrap.querySelector("#mm-pass").value;
      if(!name||!email){ return; }
      if(S.members.some(x=>x.id!==mem.id && x.email.toLowerCase()===email)){ alert("Já existe uma conta com esse e-mail."); return; }
      mem.name=name; mem.email=email; mem.password=pass; mem.role=wrap.querySelector("#mm-role").value; mem.emoji=em; mem.color=col;
      persist(); wrap.remove(); renderApp();
    });
  }

/* ===================== backup ===================== */
  function exportData(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="hub-familia-"+(S.family||"backup").toLowerCase().replace(/\s+/g,"-")+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }
  function importData(e){
    const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const obj=JSON.parse(r.result);
      if(!obj||!Array.isArray(obj.members)) throw new Error("inválido");
      if(confirm("Substituir os dados atuais pelo backup importado?")){ S=obj; setSession(null); persist(); render(); }
    }catch(err){ alert("Arquivo de backup inválido."); } };
    r.readAsText(f);
  }

/* ===================== splash + boot ===================== */
  (function(){
    const sp=$("splash"); if(!sp) return;
    let done=false; const go=()=>{ if(done)return; done=true; sp.classList.add("gone"); setTimeout(()=>sp.remove(),600); };
    sp.addEventListener("click",go);
    sp.addEventListener("touchstart",go,{passive:true});
    setTimeout(go,2600);
  })();

  render();
})();
</script>
</body>
</html>
