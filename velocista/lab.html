<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABORATÓRIOS ESTRELA — visualização</title>
<style>
  html,body { margin:0; height:100%; background:#07080f; overflow:hidden; font-family:system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #info { position:fixed; left:10px; bottom:8px; color:#cfe; font-size:12px; text-shadow:0 0 4px #000; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">?cam=fora|entrada|atrio|cortex|contencao|esteira|acelerador|nucleo|medica|oficina|trajes|fenda|topo · ?noite=1 · ?dome=0 · WASD + arrastar · Shift = rápido</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { construirLab } from './js/lab3d.js';

const q = new URLSearchParams(location.search);
const NOITE = q.get('noite') === '1' ? 1 : 0;
const CX = 76, CZ = 76;          // o centro do campus (2 × 2 quarteirões)
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const cena = new THREE.Scene();
const dia = new THREE.Color(0xbcd8f5), noiteC = new THREE.Color(0x0d1530);
const cor = NOITE ? noiteC : dia;
cena.background = cor; cena.fog = new THREE.Fog(cor, 160, 520);
const camera = new THREE.PerspectiveCamera(62, 1, 0.2, 1400);
const hemi = new THREE.HemisphereLight(NOITE ? 0x2a3a6a : 0xcfe2ff, NOITE ? 0x232a40 : 0x6a6258, NOITE ? 1.15 : 1.05);
const sol = new THREE.DirectionalLight(NOITE ? 0x8aa0e0 : 0xfff4de, NOITE ? 0.6 : 1.7);
sol.position.set(CX + 40, 90, CZ - 70); sol.target.position.set(CX, 0, CZ);
cena.add(hemi, sol, sol.target);

// contexto mínimo: asfalto, laje do quarteirão e céu
const asf = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.MeshLambertMaterial({ color: 0x2b2d33 })); asf.rotation.x = -Math.PI / 2; cena.add(asf);
const laje = new THREE.Mesh(new THREE.BoxGeometry(136, 0.3, 136), new THREE.MeshLambertMaterial({ color: 0xa7a9ad })); laje.position.set(CX, 0.15, CZ); cena.add(laje);
if (NOITE) { const n = 400, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, e = 0.15 + Math.random() * 1.3; p[i * 3] = CX + Math.cos(a) * Math.cos(e) * 600; p[i * 3 + 1] = Math.sin(e) * 600; p[i * 3 + 2] = CZ + Math.sin(a) * Math.cos(e) * 600; } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); cena.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false }))); }

const lab = construirLab(THREE, CX, CZ, { aniso: 8 });
cena.add(lab.grupo);
if (q.get('dome') === '0') lab.cupula.visible = false;

// câmeras predefinidas: [x, y, z, alvoX, alvoY, alvoZ] (coordenadas locais do laboratório)
const L = (u, y, v) => [CX + u, y, CZ + v];
const CAMS = {
  fora: [L(-34, 11, -62), L(2, 9, -27)],
  fora2: [L(46, 9, -46), L(0, 8, -27)],
  fundo: [L(-40, 14, 58), L(0, 8, 27)],
  entrada: [L(0, 1.7, -35), L(0, 4.5, -22)],
  atrio: [L(15, 2.6, -24.5), L(-9, 3.6, -15)],
  atrio2: [L(0, 2.0, -16), L(-12, 3.5, -26)],
  cortex: [L(0, 1.9, -10.5), L(0, 6, 12)],
  cortex2: [L(-10, 2.4, -10), L(6, 9, 6)],
  cortexalto: [L(0, 15.5, -11.5), L(0, 4, 6)],
  contencao: [L(20, 1.8, -11.5), L(20, 2.4, 9)],
  contencao2: [L(15.5, 2.0, 0), L(24, 2.2, -8)],
  esteira: [L(-15.2, 2.0, -11.5), L(-21, 1.8, 8)],
  esteira2: [L(-24.5, 2.4, 10.5), L(-17, 1.4, -4)],
  acelerador: [L(-19, 1.8, 15.4), L(10, 2.6, 20.5)],
  acelerador2: [L(19, 2.0, 24.4), L(-10, 2.8, 19.5)],
  nucleo: [L(0, 2.0, 39.6), L(0, 12, 50)],
  nucleo2: [L(-18, 3.0, 58), L(4, 10, 46)],
  nucleoalto: [L(16, 26, 41), L(-2, 10, 54)],
  corredor: [L(0, 1.8, 27.5), L(0, 2.2, 38)],
  medica: [L(-39, 2.2, -8), L(-56, 1.4, -22)],
  oficina: [L(-38.5, 2.4, 8), L(-55, 1.6, 30)],
  trajes: [L(48, 2.0, -8), L(56, 2.2, -22)],
  fenda: [L(40, 2.2, 10), L(49, 4, 28)],
  saguao: [L(-30, 1.8, 0), L(-50, 3, 0)],
  topo: [L(40, 66, -64), L(0, 26, 0)],
  telhado: [L(-14, 33, -24), L(8, 32, 6)],
  campus: [L(-120, 60, -170), L(0, 40, 10)],
  campus2: [L(150, 30, -120), L(0, 30, 10)],
  torre: [L(-10, 2, -64), L(0, 60, 40)],
  anel: [L(-60, 150, -40), L(0, 120, 50)],
  longe: [L(-380, 40, -520), L(0, 70, 30)],
};
const nome = q.get('cam') || 'fora';
const pos = new THREE.Vector3(), alvo = new THREE.Vector3();
let yaw = 0, pitch = 0;
function ir(n) { const c = CAMS[n] || CAMS.fora; pos.set(...c[0]); alvo.set(...c[1]); const d = alvo.clone().sub(pos); yaw = Math.atan2(d.x, d.z); pitch = Math.asin(d.y / d.length()); }
ir(nome);
const teclas = new Set();
addEventListener('keydown', (e) => teclas.add(e.key.toLowerCase())); addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
let arrasta = false;
cv.addEventListener('pointerdown', () => { arrasta = true; }); addEventListener('pointerup', () => { arrasta = false; });
addEventListener('pointermove', (e) => { if (!arrasta) return; yaw -= e.movementX * 0.004; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.004)); });
function ajusta() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', ajusta); ajusta();

const relogio = new THREE.Clock(); let t = 0, quadros = 0;
function quadro() {
  requestAnimationFrame(quadro);
  const dt = Math.min(relogio.getDelta(), 0.05); t += dt;
  const v = (teclas.has('shift') ? 18 : 6) * dt, fx = Math.sin(yaw), fz = Math.cos(yaw);
  if (teclas.has('w')) { pos.x += fx * v; pos.z += fz * v; } if (teclas.has('s')) { pos.x -= fx * v; pos.z -= fz * v; }
  if (teclas.has('a')) { pos.x += fz * v; pos.z -= fx * v; } if (teclas.has('d')) { pos.x -= fz * v; pos.z += fx * v; }
  if (teclas.has('e')) pos.y += v; if (teclas.has('q')) pos.y -= v;
  camera.position.copy(pos);
  camera.lookAt(pos.x + Math.sin(yaw) * Math.cos(pitch), pos.y + Math.sin(pitch), pos.z + Math.cos(yaw) * Math.cos(pitch));
  lab.atualizar(dt, t, NOITE, camera, { x: pos.x, y: pos.y, z: pos.z });
  renderer.render(cena, camera); quadros++;
  window.__lab.quadros = quadros;
}
window.__lab = { camera, renderer, lab, cena, ir, quadros: 0, ready: true, CAMS, info: () => renderer.info };
quadro();
</script>
</body>
</html>
