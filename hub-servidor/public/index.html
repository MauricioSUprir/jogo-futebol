<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<title>Hub da Família</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hub da Família" />
<style>
  :root{
    color-scheme: light;
    --bg:#f9f9f7; --card:#fcfcfb; --text:#0b0b0b; --text2:#52514e; --muted:#898781;
    --line:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --brand:#0f766e; --brand-soft:#dbeee9;
    --accent:#e08a1e; --accent-soft:#fbecd4;
    --good:#0ca30c; --good-soft:#e3f6e3; --bad:#d03b3b; --bad-soft:#fce8e8;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 10px 30px rgba(11,11,11,.05);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:#0d0d0d; --card:#1a1a19; --text:#fff; --text2:#c3c2b7; --muted:#898781;
      --line:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
      --brand:#2dd4bf; --brand-soft:#12332a;
      --accent:#f0a742; --accent-soft:#3a2a12;
      --good:#3ecf5f; --good-soft:#12331c; --bad:#e66767; --bad-soft:#3a1414;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 18px 120px}
  .hide{display:none!important}
  .spacer{flex:1}
  .backbtn{margin:0 0 18px}
  .menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  @media(max-width:560px){.menugrid{grid-template-columns:repeat(2,1fr)}}
  .menucard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center;color:var(--text)}
  .menucard:hover{border-color:var(--brand);transform:translateY(-2px)}
  .menucard .mi{font-size:27px;line-height:1}
  .menucard .ml{font-size:13.5px;font-weight:750}
  .menucard .md{font-size:11px;color:var(--muted)}
  .sechead{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:6px 2px 12px}
  .alertbar{display:block;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:14px;padding:14px 16px;font-weight:750;font-size:14px;cursor:pointer;margin-bottom:18px}
  .alertbar:hover{filter:brightness(1.03)}

  /* splash */
  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 50% 0%, #12564f 0%, #0a0f0e 72%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;
    transition:opacity .5s ease, visibility .5s ease}
  #splash.gone{opacity:0;visibility:hidden;pointer-events:none}
  #splash img{width:min(42vw,150px);height:auto;border-radius:34px;box-shadow:0 22px 60px rgba(45,212,191,.28);
    animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
  #splash .stitle{color:#eafffb;font-size:23px;font-weight:800;letter-spacing:-.02em;animation:fade 1.1s ease .25s both}
  #splash .enter{color:#7de3d0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:center;gap:9px;opacity:.9;animation:fade 1.4s ease .5s both}
  #splash .enter .d{width:7px;height:7px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 12px #2dd4bf;animation:blink 1.3s infinite}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:.9}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){#splash img,#splash .enter{animation:none}}

  /* avatar */
  .av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .av.sm{width:30px;height:30px;font-size:15px}
  .av.md{width:44px;height:44px;font-size:22px}
  .av.lg{width:76px;height:76px;font-size:38px}

  /* ===== login ===== */
  .lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px;text-align:center}
  .lock .logo{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#2dd4bf,#0f766e);box-shadow:0 10px 26px rgba(15,118,110,.32);margin-bottom:14px}
  .lock .logo svg{width:60%;height:60%}
  .lock h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
  .lock .fam{margin:2px 0 4px;color:var(--brand);font-weight:700}
  .lock p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
  .loginform{width:100%;max-width:330px;display:flex;flex-direction:column;gap:11px}
  .loginform input{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;width:100%;box-shadow:var(--shadow)}
  .loginform input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .loginerr{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
  .lock .foot{margin-top:30px;color:var(--muted);font-size:12px;max-width:340px}

  /* ===== app shell ===== */
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand .mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#2dd4bf,#0f766e);box-shadow:0 6px 16px rgba(15,118,110,.3);flex:none}
  .brand .mark svg{width:62%;height:62%}
  .brand h1{font-size:19px;margin:0;font-weight:780;letter-spacing:-.02em;white-space:nowrap}
  .brand p{margin:0;font-size:12.5px;color:var(--muted)}
  .me{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;box-shadow:var(--shadow)}
  .me .nm{font-size:13px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me .role{font-size:11px;color:var(--muted)}

  .hello{margin:6px 0 20px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .hello h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .hello p{margin:2px 0 0;color:var(--muted);font-size:13px}

  /* tabs */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;scrollbar-width:none;position:sticky;top:8px;z-index:30}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{border:0;background:transparent;color:var(--text2);cursor:pointer;padding:10px 16px;border-radius:10px;font-weight:650;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tabs button.active{background:var(--brand);color:#fff}

  /* cards / panels */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .grid .full{grid-column:1/-1}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}
  .panel .ph{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .panel .ph .ic{font-size:18px}
  .panel h3{font-size:15px;margin:0;font-weight:750;letter-spacing:-.01em}
  .panel .cnt{font-size:12px;color:var(--muted);margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:650}

  /* list rows */
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.list li{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--bg);cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:15px;transition:.12s}
  .chk.on{background:var(--good);border-color:var(--good);color:#fff}
  .li-main{min-width:0;flex:1}
  .li-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .li-t.done{text-decoration:line-through;color:var(--muted);font-weight:500}
  .li-s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:1px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:600}
  .tag.mine{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
  .tag.warn{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .tag.late{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
  .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;border-radius:8px;flex:none}
  .x:hover{color:var(--bad);background:var(--bad-soft)}

  /* forms */
  .add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .add input[type=text],.add input[type=date],.add input[type=time],.add input[type=number],.add input[type=email],.add input[type=password],.add select,.add textarea{
    flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);
    border-radius:11px;padding:10px 12px;font-size:14px;outline:none}
  .add input:focus,.add select:focus,.add textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
  .add textarea{resize:vertical;min-height:44px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{filter:brightness(1.05);color:#fff}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .w100{width:100%}
  .fld{display:flex;flex-direction:column;gap:5px;text-align:left}
  .fld label{font-size:12px;color:var(--muted);font-weight:650}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}

  .empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
  .rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

  /* meals */
  .meal{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal .mi{font-size:22px;flex:none;width:30px;text-align:center}
  .meal .mb{flex:1;min-width:0}
  .meal .ml{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .meal .mv{font-size:14.5px;margin-top:2px;white-space:pre-wrap}
  .meal .mv.ph{color:var(--muted);font-style:italic}
  .meal input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:4px}
  .dayblock{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
  .dayblock.today{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 16%,transparent)}
  .dayblock .dh{font-weight:750;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .dayblock .dh .badge{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 8px}

  .daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .daynav .lbl{font-weight:700;font-size:14.5px}
  .icobtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--text2)}
  .icobtn:hover{color:var(--brand);border-color:var(--brand)}

  /* avisos */
  .ann{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  .ann .ah{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .ann .an{font-weight:750;font-size:13.5px}
  .ann .at{font-size:11px;color:var(--text2);margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:600;white-space:nowrap}
  .ann .abody{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-top:6px}
  .ann img.ai{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:10px;display:block;border:1px solid var(--line)}
  .tchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .comments{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:9px}
  .cmt{display:flex;gap:8px;align-items:flex-start}
  .cmt .cb{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px}
  .cmt .cn{font-size:12px;font-weight:750}
  .cmt .ct{font-size:10.5px;color:var(--text2);margin-left:8px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .cmt .cx{font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:1px}
  .cmtbox{display:flex;gap:8px;margin-top:4px}
  .cmtbox input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 12px;font-size:13.5px;outline:none}
  .cmtbox input:focus{border-color:var(--brand)}
  .targetgrid{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:2px}
  .chkfield{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
  .chkfield input{width:17px;height:17px;accent-color:var(--brand)}
  .filepick{display:flex;align-items:center;gap:12px;margin-top:4px}
  .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}

  /* aprovação de atividades */
  .approve{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
  .ah2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .proofimg{width:100%;max-height:360px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .proofthumb{width:48px;height:48px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;flex:none}
  .zoombox{max-width:96vw;max-height:92vh}
  .zoombox img{max-width:96vw;max-height:92vh;border-radius:12px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}

  /* pontos / placar */
  .pointbadge{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px;white-space:nowrap}
  .pointbadge.neg{background:var(--bad-soft);color:var(--bad)}
  .money{color:var(--good);font-weight:800}
  .txicon{font-size:20px;width:26px;text-align:center;flex:none}
  .profhead{display:flex;gap:16px;align-items:center}
  .profhead .av.lg{width:76px;height:76px;font-size:36px}
  .profname{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .profbio{font-size:13.5px;color:var(--text2);margin-top:8px;white-space:pre-wrap}
  .placar-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
  .placar-row:last-child{border-bottom:0}
  .rank{width:26px;text-align:center;font-weight:800;color:var(--muted);font-size:16px;flex:none}
  .rank.top{color:var(--accent)}
  .pts-big{font-weight:800;font-size:17px;line-height:1.1}
  .pts-sub{font-size:12px;color:var(--muted)}
  .totalbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .totalbar .tb{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .totalbar .tb .k{font-size:12px;color:var(--muted);font-weight:650}
  .totalbar .tb .v{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.02em}

  /* member manager */
  .mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .sw.on{border-color:var(--text)}
  .emopick{display:flex;gap:6px;flex-wrap:wrap}
  .emopick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
  .emopick button.on{border-color:var(--brand);background:var(--brand-soft)}

  /* modal */
  .ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:440px;max-height:90dvh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 4px;font-size:18px;font-weight:780}
  .modal .msub{margin:0 0 16px;color:var(--muted);font-size:13px}
  .stack{display:flex;flex-direction:column;gap:14px}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.22s;z-index:120;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--bad);color:#fff}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:11.5px}
</style>
</head>
<body>
<div id="splash">
  <img src="assets/icon.svg" alt="Hub da Família" />
  <div class="stitle">Hub da Família</div>
  <div class="enter"><span class="d"></span>Toque para entrar</div>
</div>

<div id="root"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ===================== API (fala com o servidor) ===================== */
  async function api(path, opts){
    opts = opts || {};
    const res = await fetch("/api"+path, {
      method: opts.method || "GET",
      headers: opts.body ? { "Content-Type":"application/json" } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    // 401 numa rota normal = sessão expirou -> volta pro login. No próprio /login,
    // 401 é "senha errada" e deve ser tratado por quem chamou (mostra a mensagem).
    if(res.status===401 && path!=="/login"){ S=null; renderLogin(); throw { unauth:true }; }
    let j={}; try{ j=await res.json(); }catch(e){}
    if(!res.ok) throw (j || { error:"erro" });
    return j;
  }

/* ===================== utilitários ===================== */
  const $ = (id)=>document.getElementById(id);
  const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
  function mondayOf(s){ const d=parseYmd(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); }
  function fmtLong(s){ const d=parseYmd(s); return DIAS[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()]; }
  function fmtShort(s){ const d=parseYmd(s); return d.getDate()+"/"+String(d.getMonth()+1).padStart(2,"0"); }

  function readImageResized(file, maxDim, cb){
    const r=new FileReader();
    r.onload=()=>{ const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.82)); }catch(e){ cb(null); }
    }; img.onerror=()=>cb(null); img.src=r.result; };
    r.readAsDataURL(file);
  }

/* ===================== wiring ===================== */
  function wireView(){
    const v=$("view"); if(!v) return;

    // navegação (tela Início)
    v.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.go; renderApp(); reload(true).catch(()=>{}); }));
    // ampliar imagens (fotos de prova, imagens de aviso)
    v.querySelectorAll("[data-zoom]").forEach(el=>el.addEventListener("click",()=>openZoom(el.getAttribute("data-zoom"))));

    if(tab==="compras"){
      const add=async()=>{
        const name=($("sh-name").value||"").trim(); if(!name)return;
        try{ await api("/shopping",{method:"POST",body:{name,qty:($("sh-qty").value||"").trim()}}); await reload(); }
        catch(e){ toast("Erro ao adicionar",true); }
      };
      const b=$("sh-add"); if(b) b.addEventListener("click",add);
      $("sh-name") && $("sh-name").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
      v.querySelectorAll("[data-toggleshop]").forEach(x=>x.addEventListener("click",async()=>{ try{ await api("/shopping/"+x.dataset.toggleshop+"/toggle",{method:"POST"}); await reload(); }catch(e){ toast("Erro",true); } }));
      v.querySelectorAll("[data-delshop]").forEach(x=>x.addEventListener("click",async()=>{ try{ await api("/shopping/"+x.dataset.delshop,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro",true); } }));
      const clr=$("sh-clear"); if(clr) clr.addEventListener("click",async()=>{ try{ await api("/shopping/clear-done",{method:"POST"}); await reload(); }catch(e){ toast("Erro",true); } });
    }

    if(tab==="avisos"){
      if(isAdmin()){
        const fileEl=$("an-file"), thumb=$("an-thumb"), rmimg=$("an-rmimg"), pick=$("an-pick");
        if(pick){
          pick.addEventListener("click",()=>fileEl.click());
          fileEl.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; readImageResized(f,1200,(url)=>{ composeImg=url; if(url){ thumb.src=url; thumb.classList.remove("hide"); rmimg.classList.remove("hide"); } }); });
          rmimg.addEventListener("click",()=>{ composeImg=null; fileEl.value=""; thumb.classList.add("hide"); rmimg.classList.add("hide"); });
        }
        const allBox=$("an-all"), tBoxes=()=>[...v.querySelectorAll(".an-t")];
        if(allBox){
          allBox.addEventListener("change",()=>{ if(allBox.checked) tBoxes().forEach(b=>b.checked=false); });
          tBoxes().forEach(b=>b.addEventListener("change",()=>{ if(tBoxes().some(x=>x.checked)) allBox.checked=false; if(!tBoxes().some(x=>x.checked)) allBox.checked=true; }));
        }
        const post=$("an-post");
        if(post) post.addEventListener("click",async()=>{
          const text=($("an-text").value||"").trim();
          if(!text && !composeImg){ $("an-text").focus(); return; }
          let targets = (allBox.checked || !tBoxes().some(b=>b.checked)) ? ["all"] : tBoxes().filter(b=>b.checked).map(b=>b.value);
          post.disabled=true;
          try{ await api("/announcements",{method:"POST",body:{text,image:composeImg||null,targets}}); composeImg=null; await reload(); toast("Comunicado publicado ✓"); }
          catch(e){ toast("Não deu pra publicar",true); post.disabled=false; }
        });
      }
      v.querySelectorAll("[data-cmtsend]").forEach(b=>b.addEventListener("click",()=>sendComment(b.dataset.cmtsend)));
      v.querySelectorAll("[data-cmt]").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") sendComment(inp.dataset.cmt); }));
      v.querySelectorAll("[data-delann]").forEach(b=>b.addEventListener("click",async()=>{ if(confirm("Apagar esta publicação?")){ try{ await api("/announcements/"+b.dataset.delann,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro ao apagar",true); } } }));
      v.querySelectorAll("[data-delcmt]").forEach(b=>b.addEventListener("click",async()=>{ try{ await api("/comments/"+b.dataset.delcmt,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro",true); } }));
    }

    if(tab==="atividades"){
      if(isAdmin()){
        const add=async()=>{
          const title=($("ac-title").value||"").trim(); const pts=Math.max(0,parseInt($("ac-points").value,10)||0);
          if(!title) return;
          try{ await api("/activities",{method:"POST",body:{title,points:pts,assignedTo:$("ac-who").value||null,date:$("ac-date").value||TODAY}}); await reload(); toast(pts>0?"Atividade criada ✓":"Tarefa criada ✓"); }
          catch(e){ toast("Erro ao criar",true); }
        };
        const b=$("ac-add"); if(b) b.addEventListener("click",add);
        $("ac-title") && $("ac-title").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
        v.querySelectorAll("[data-delact]").forEach(x=>x.addEventListener("click",async()=>{ try{ await api("/activities/"+x.dataset.delact,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro",true); } }));
        v.querySelectorAll("[data-reopen]").forEach(x=>x.addEventListener("click",async()=>{ if(!confirm("Reabrir e estornar os pontos?"))return; try{ await api("/activities/"+x.dataset.reopen+"/reopen",{method:"POST"}); await reload(); toast("Reaberta — pontos estornados"); }catch(e){ toast("Erro",true); } }));
        v.querySelectorAll("[data-approve]").forEach(x=>x.addEventListener("click",async()=>{ x.disabled=true; try{ await api("/activities/"+x.dataset.approve+"/approve",{method:"POST"}); await reload(); toast("Aprovada! Pontos enviados ⭐"); }catch(e){ toast("Erro ao aprovar",true); x.disabled=false; } }));
        v.querySelectorAll("[data-reject]").forEach(x=>x.addEventListener("click",async()=>{ if(!confirm("Reprovar? A atividade é anulada (sem pontos) e volta a ficar disponível."))return; try{ await api("/activities/"+x.dataset.reject+"/reject",{method:"POST"}); await reload(); toast("Reprovada — sem pontos"); }catch(e){ toast("Erro",true); } }));
      } else {
        v.querySelectorAll("[data-done]").forEach(x=>x.addEventListener("click",()=>{
          const act=(S.activities||[]).find(a=>a.id===x.dataset.done);
          if(act) openProofModal(act);
        }));
      }
    }

    if(tab==="cardapio"){
      $("wk-prev").addEventListener("click",()=>{ menuWeekStart=addDays(menuWeekStart,-7); renderView(); });
      $("wk-next").addEventListener("click",()=>{ menuWeekStart=addDays(menuWeekStart,7); renderView(); });
      $("wk-this").addEventListener("click",()=>{ menuWeekStart=mondayOf(TODAY); renderView(); });
      if(isAdmin()){
        v.querySelectorAll("input[data-menu]").forEach(inp=>inp.addEventListener("change",async()=>{
          try{ await api("/menu",{method:"PUT",body:{day:inp.dataset.menu,slot:inp.dataset.slot,value:inp.value.trim()}}); if(!S.menu[inp.dataset.menu])S.menu[inp.dataset.menu]={cafe:"",almoco:"",jantar:""}; S.menu[inp.dataset.menu][inp.dataset.slot]=inp.value.trim(); toast("Cardápio salvo ✓"); }
          catch(e){ toast("Erro ao salvar",true); }
        }));
      }
    }

    if(tab==="placar" && isAdmin()){
      const add=async()=>{
        const who=$("aj-who").value; const delta=parseInt($("aj-pts").value,10);
        if(!who || !delta) return;
        try{ await api("/points",{method:"POST",body:{memberId:who,delta,reason:($("aj-reason").value||"").trim()}}); await reload(); toast("Pontos ajustados ✓"); }
        catch(e){ toast(e.error||"Erro",true); }
      };
      const b=$("aj-add"); if(b) b.addEventListener("click",add);
      v.querySelectorAll("[data-dellog]").forEach(x=>x.addEventListener("click",async()=>{ try{ await api("/points/"+x.dataset.dellog,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro",true); } }));
    }

    if(tab==="encontros" && isAdmin()){
      const add=async()=>{
        const title=($("mt-title").value||"").trim(); if(!title)return;
        try{ await api("/meetings",{method:"POST",body:{title,date:$("mt-date").value||TODAY,time:$("mt-time").value||"",place:($("mt-place").value||"").trim(),note:($("mt-note").value||"").trim()}}); await reload(); toast("Encontro marcado ✓"); }
        catch(e){ toast("Erro",true); }
      };
      const b=$("mt-add"); if(b) b.addEventListener("click",add);
      v.querySelectorAll("[data-delmt]").forEach(x=>x.addEventListener("click",async()=>{ try{ await api("/meetings/"+x.dataset.delmt,{method:"DELETE"}); await reload(); }catch(e){ toast("Erro",true); } }));
    }

    if(tab==="conta"){
      const pfEdit=$("pf-edit"); if(pfEdit) pfEdit.addEventListener("click",()=>openProfileModal(me()));
      const logout=$("me-logout"); if(logout) logout.addEventListener("click",async()=>{ try{ await api("/logout",{method:"POST"}); }catch(e){} S=null; renderLogin(); });
      if(isAdmin()){
        v.querySelectorAll("[data-editm]").forEach(b=>b.addEventListener("click",()=>openAccountModal(member(b.dataset.editm))));
        v.querySelectorAll("[data-extrato]").forEach(b=>b.addEventListener("click",()=>openExtratoModal(member(b.dataset.extrato))));
        $("cf-fam-save") && $("cf-fam-save").addEventListener("click",async()=>{ const nv=($("cf-fam").value||"").trim(); if(!nv)return; try{ await api("/settings",{method:"PUT",body:{family:nv,pointValue:S.pointValue}}); await reload(true); toast("Salvo ✓"); }catch(e){ toast("Erro",true); } });
        $("cf-val-save") && $("cf-val-save").addEventListener("click",async()=>{ const nv=parseFloat($("cf-val").value); if(!(nv>=0))return; try{ await api("/settings",{method:"PUT",body:{family:S.family,pointValue:nv}}); await reload(true); toast("Valor do ponto atualizado ✓"); }catch(e){ toast("Erro",true); } });
      } else {
        $("pw-save").addEventListener("click",async()=>{ const nv=$("pw-new").value; if(!nv){ $("pw-new").focus(); return; } try{ await api("/me/password",{method:"PUT",body:{password:nv}}); $("pw-new").value=""; toast("Senha atualizada ✓"); }catch(e){ toast("Erro",true); } });
        const rd=$("rd-go"); if(rd) rd.addEventListener("click",async()=>{
          const amount=parseFloat(($("rd-amount").value||"").replace(",","."));
          if(!(amount>0)){ $("rd-amount").focus(); return; }
          rd.disabled=true;
          try{ const r=await api("/redeem",{method:"POST",body:{amount}}); await reload(true); toast(`Resgatado ${BRL(r.reais)} (${r.pts} pts) ✓`); }
          catch(e){ toast(e.error==="saldo insuficiente"?"Saldo insuficiente":(e.error==="valor abaixo de 1 ponto"?"Valor muito baixo":"Não deu pra resgatar"),true); rd.disabled=false; }
        });
      }
    }
  }

  async function sendComment(annId){
    const inp=$("view").querySelector(`[data-cmt="${annId}"]`); if(!inp) return;
    const text=(inp.value||"").trim(); if(!text) return;
    inp.value="";
    try{ await api("/comments",{method:"POST",body:{announcementId:annId,text}}); await reload(); }
    catch(e){ toast("Não deu pra comentar",true); }
  }

/* ===================== modal de conta (admin) ===================== */
  // Blocos reutilizados nos modais de perfil/conta.
  function pickersHtml(em, col, photo){
    return `
      <div class="fld"><label>Foto (opcional)</label>
        <div class="filepick">
          <span class="av lg" id="mm-photoprev" style="width:56px;height:56px;font-size:26px;${photo?`background-image:url('${photo}');background-size:cover;background-position:center`:`background:${col}`}">${photo?'':esc(em)}</span>
          <button class="btn sm" id="mm-photobtn" type="button">📷 Escolher foto</button>
          <button class="btn sm danger ${photo?'':'hide'}" id="mm-photorm" type="button">Remover</button>
          <input id="mm-photofile" type="file" accept="image/*" class="hide"/>
        </div></div>
      <div class="fld"><label>Emoji (quando não tem foto)</label><div class="emopick" id="mm-emo">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===em?'on':''}">${e}</button>`).join("")}</div></div>
      <div class="fld"><label>Cor</label><div class="swatches" id="mm-col">${COLORS.map(c=>`<span class="sw ${c===col?'on':''}" data-c="${c}" style="background:${c}"></span>`).join("")}</div></div>
      <div class="grid">
        <div class="fld"><label>Idade</label><input id="mm-age" type="number" min="0" max="120"/></div>
        <div class="fld"><label>Data de aniversário</label><input id="mm-bday" type="date"/></div>
      </div>
      <div class="fld"><label>Sobre (opcional)</label><textarea id="mm-bio" rows="2" placeholder="uma frase sobre você..."></textarea></div>`;
  }

  function wirePickers(wrap, state){
    wrap.querySelector("#mm-emo").addEventListener("click",e=>{const b=e.target.closest("button[data-e]");if(!b)return;state.em=b.dataset.e;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b)); if(!state.photo){const p=wrap.querySelector("#mm-photoprev");p.textContent=state.em;p.style.background=state.col;}});
    wrap.querySelector("#mm-col").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;state.col=b.dataset.c;[...e.currentTarget.children].forEach(c=>c.classList.toggle("on",c===b)); if(!state.photo){wrap.querySelector("#mm-photoprev").style.background=state.col;}});
    const pf=wrap.querySelector("#mm-photofile"), prev=wrap.querySelector("#mm-photoprev"), rm=wrap.querySelector("#mm-photorm");
    wrap.querySelector("#mm-photobtn").addEventListener("click",()=>pf.click());
    pf.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(!f)return;readImageResized(f,256,url=>{if(!url)return;state.photo=url;prev.style.backgroundImage=`url('${url}')`;prev.style.backgroundSize="cover";prev.style.backgroundPosition="center";prev.textContent="";rm.classList.remove("hide");});});
    rm.addEventListener("click",()=>{state.photo=null;prev.style.backgroundImage="";prev.style.background=state.col;prev.textContent=state.em;rm.classList.add("hide");pf.value="";});
  }

  function openAccountModal(mem){
    if(!mem) return;
    const state={ em:mem.emoji, col:mem.color, photo:mem.photo||null };
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>Editar conta</h3>
        <p class="msub">Dados de acesso e perfil. Deixe a senha em branco pra não trocar.</p>
        <div class="stack">
          <div class="fld"><label>Nome</label><input id="mm-name" type="text" value="${esc(mem.name)}"/></div>
          <div class="fld"><label>E-mail (login)</label><input id="mm-email" type="email" value="${esc(mem.email)}"/></div>
          <div class="fld"><label>Nova senha (opcional)</label><input id="mm-pass" type="text" placeholder="deixe em branco pra manter"/></div>
          <div class="fld"><label>Papel</label>
            <select id="mm-role">
              <option value="membro" ${mem.role==="membro"?"selected":""}>Membro (faz atividades e pontua)</option>
              <option value="admin" ${mem.role==="admin"?"selected":""}>Admin (dita, não pontua)</option>
            </select></div>
          ${pickersHtml(state.em, state.col, state.photo)}
          <div class="rowbtns"><button class="btn pri" id="mm-save">Salvar</button><button class="btn" id="mm-cancel">Cancelar</button></div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    wrap.querySelector("#mm-age").value = (mem.age??"");
    wrap.querySelector("#mm-bday").value = (mem.birthday||"");
    wrap.querySelector("#mm-bio").value = (mem.bio||"");
    wirePickers(wrap, state);
    wrap.querySelector("#mm-cancel").addEventListener("click",()=>wrap.remove());
    wrap.querySelector("#mm-save").addEventListener("click",async()=>{
      const name=(wrap.querySelector("#mm-name").value||"").trim();
      const email=(wrap.querySelector("#mm-email").value||"").trim().toLowerCase();
      const pass=wrap.querySelector("#mm-pass").value;
      if(!name||!email){ return; }
      const body={ name, email, role:wrap.querySelector("#mm-role").value, emoji:state.em, color:state.col, photo:state.photo,
        age:wrap.querySelector("#mm-age").value||null, birthday:wrap.querySelector("#mm-bday").value||null, bio:(wrap.querySelector("#mm-bio").value||"").trim()||null };
      if(pass) body.password=pass;
      try{ await api("/members/"+mem.id,{method:"PUT",body}); wrap.remove(); await reload(true); toast("Conta atualizada ✓"); }
      catch(e){ toast(e.error==="e-mail já usado"?"Esse e-mail já está em uso":"Erro ao salvar",true); }
    });
  }

  function openProfileModal(mem){
    if(!mem) return;
    const state={ em:mem.emoji, col:mem.color, photo:mem.photo||null };
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>Editar meu perfil</h3>
        <p class="msub">Deixe do seu jeito. 🎨</p>
        <div class="stack">
          <div class="fld"><label>Nome</label><input id="mm-name" type="text" value="${esc(mem.name)}"/></div>
          ${pickersHtml(state.em, state.col, state.photo)}
          <div class="rowbtns"><button class="btn pri" id="mm-save">Salvar</button><button class="btn" id="mm-cancel">Cancelar</button></div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    wrap.querySelector("#mm-age").value = (mem.age??"");
    wrap.querySelector("#mm-bday").value = (mem.birthday||"");
    wrap.querySelector("#mm-bio").value = (mem.bio||"");
    wirePickers(wrap, state);
    wrap.querySelector("#mm-cancel").addEventListener("click",()=>wrap.remove());
    wrap.querySelector("#mm-save").addEventListener("click",async()=>{
      const name=(wrap.querySelector("#mm-name").value||"").trim(); if(!name){ wrap.querySelector("#mm-name").focus(); return; }
      const body={ name, emoji:state.em, color:state.col, photo:state.photo,
        age:wrap.querySelector("#mm-age").value||null, birthday:wrap.querySelector("#mm-bday").value||null, bio:(wrap.querySelector("#mm-bio").value||"").trim()||null };
      try{ await api("/me/profile",{method:"PUT",body}); wrap.remove(); await reload(true); toast("Perfil atualizado ✓"); }
      catch(e){ toast("Erro ao salvar",true); }
    });
  }

  // Ampliar uma imagem em tela cheia.
  function openZoom(src){
    if(!src) return;
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`<div class="zoombox"><img src="${src}" alt="imagem"/></div>`;
    wrap.addEventListener("click",()=>wrap.remove());
    $("modal-root").appendChild(wrap);
  }

  // Filho conclui atividade: precisa enviar uma FOTO.
  function openProofModal(act){
    if(!act) return;
    let proof=null;
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>Concluir: ${esc(act.title)}</h3>
        <p class="msub">Envie uma <b>foto</b> da atividade feita. Um adulto vai aprovar pra você ${act.points>0?`ganhar os <b>${act.points} pontos</b> (${BRL(money(act.points))})`:'confirmar'}.</p>
        <div class="stack">
          <img class="proofimg hide" id="pr-thumb" alt="prévia da foto"/>
          <div class="rowbtns" style="margin-top:0">
            <button class="btn" id="pr-pick" type="button">📷 Tirar / escolher foto</button>
            <input id="pr-file" type="file" accept="image/*" capture="environment" class="hide"/>
          </div>
          <div class="rowbtns"><button class="btn pri" id="pr-send" disabled>Enviar para aprovação</button><button class="btn" id="pr-cancel">Cancelar</button></div>
        </div>
      </div>`;
    $("modal-root").appendChild(wrap);
    const file=wrap.querySelector("#pr-file"), thumb=wrap.querySelector("#pr-thumb"), send=wrap.querySelector("#pr-send");
    wrap.querySelector("#pr-pick").addEventListener("click",()=>file.click());
    file.addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; readImageResized(f,1400,url=>{ if(!url){toast("Não deu pra ler a foto",true);return;} proof=url; thumb.src=url; thumb.classList.remove("hide"); send.disabled=false; }); });
    wrap.querySelector("#pr-cancel").addEventListener("click",()=>wrap.remove());
    send.addEventListener("click",async()=>{
      if(!proof){ toast("Escolha uma foto primeiro",true); return; }
      send.disabled=true;
      try{ await api("/activities/"+act.id+"/done",{method:"POST",body:{proof}}); wrap.remove(); await reload(true); toast("Enviado! Aguarde um adulto aprovar ✅"); }
      catch(e){ toast(e.error==="imagem obrigatória"?"A foto é obrigatória":"Não deu pra enviar",true); send.disabled=false; }
    });
  }

  function openExtratoModal(mem){
    if(!mem) return;
    const pts=memberPoints(mem.id);
    const wrap=document.createElement("div"); wrap.className="ov";
    wrap.innerHTML=`
      <div class="modal">
        <h3>Extrato de ${esc(mem.name)}</h3>
        <p class="msub">Saldo: <b>${pts} pts</b> · <span class="money">${BRL(money(pts))}</span></p>
        ${txHtml(mem.id)}
        <div class="rowbtns"><button class="btn" id="mm-close">Fechar</button></div>
      </div>`;
    $("modal-root").appendChild(wrap);
    wrap.querySelector("#mm-close").addEventListener("click",()=>wrap.remove());
  }

/* ===================== splash + boot ===================== */
  (function(){
    const sp=$("splash"); if(!sp) return;
    let done=false; const go=()=>{ if(done)return; done=true; sp.classList.add("gone"); setTimeout(()=>sp.remove(),600); };
    sp.addEventListener("click",go);
    sp.addEventListener("touchstart",go,{passive:true});
    setTimeout(go,2600);
  })();

  (async function boot(){
    try{ await reload(true); }
    catch(e){ renderLogin(); }
  })();
})();
</script>
</body>
</html>
