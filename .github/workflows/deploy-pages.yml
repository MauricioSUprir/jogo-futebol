name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar site do Pages
        run: |
          # Total Match continua na raiz do site.
          rm -rf _site
          mkdir -p _site
          cp -r legacy-total-match/. _site/
          # App de Finanças de Casa fica em /financas-casa/
          mkdir -p _site/financas-casa
          cp -r financas-casa/. _site/financas-casa/
          # Hub da Família fica em /hub-familiar/
          mkdir -p _site/hub-familiar
          cp -r hub-familiar/. _site/hub-familiar/
      - uses: actions/upload-pages-artifact@v3
        with:
          # Raiz = jogo Total Match. Subpasta /financas-casa/ = app de finanças.
          # O CreateFlow (raiz do repo) é hospedado à parte (Railway), não pelo Pages.
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
