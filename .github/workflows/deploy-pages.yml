name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  # A bateria do GOLAÇO só precisa rodar quando o que ela testa mudou. Compara o golaco/, o legacy-total-match/
  # (o teste-rostos-reais lê as fotos do TM) e o golaco-testes.yml com os do último deploy aprovado (o último run
  # com sucesso deste arquivo: ou passou nos testes, ou pulou por estar igual ao aprovado antes dele). Iguais =
  # pula os testes e publica em ~3 min (mudança só no THE FLASH, no TM fora da pasta etc.). Na dúvida (sem run
  # aprovado, erro do git, execução manual), roda.
  mudancas:
    runs-on: ubuntu-latest
    outputs:
      golaco: ${{ steps.compara.outputs.golaco }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: compara
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          testar=true
          if [ "${{ github.event_name }}" = "push" ]; then
            BOM=$(gh run list --workflow deploy-pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || true)
            arvores() { for p in golaco legacy-total-match .github/workflows/golaco-testes.yml; do git rev-parse "$1:$p" 2>/dev/null || echo "falta"; done; }
            if [ -n "$BOM" ] && git cat-file -e "$BOM^{commit}" 2>/dev/null && [ "$(arvores HEAD)" = "$(arvores "$BOM")" ]; then
              testar=false
              echo "O que os testes do GOLAÇO cobrem está igual ao do deploy aprovado $BOM: pula a bateria."
            fi
          fi
          echo "golaco=$testar" >> "$GITHUB_OUTPUT"
  # GOLAÇO (golaco/): a bateria de testes roda antes de publicar; se algum reprovar, o golaco NOVO não vai
  # para o site — continua no ar o golaco do último deploy aprovado — e os outros projetos publicam normalmente. É o mesmo arquivo do CI do PR (golaco-testes.yml), em partes paralelas (Node em 4
  # máquinas, navegador em 3); deploy: true = no navegador só os testes marcados para o deploy.
  testes-golaco:
    needs: mudancas
    # se a comparação falhar, roda (a saída vazia não é 'false')
    if: ${{ !cancelled() && needs.mudancas.outputs.golaco != 'false' }}
    uses: ./.github/workflows/golaco-testes.yml
    with:
      deploy: true
  deploy:
    needs: [mudancas, testes-golaco]
    # roda mesmo com os testes do golaco reprovados ou pulados (o golaco é que fica na última versão aprovada)
    if: ${{ !cancelled() }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar site do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Total Match continua na raiz do site.
          rm -rf _site
          mkdir -p _site
          cp -r legacy-total-match/. _site/
          # ferramentas do Total Match (geradores, capas originais) não vão para o site
          rm -rf _site/ferramentas
          # App de Finanças de Casa fica em /financas-casa/
          mkdir -p _site/financas-casa
          cp -r financas-casa/. _site/financas-casa/
          # LookLab (estilista digital) fica em /looklab/
          mkdir -p _site/looklab
          cp -r looklab/. _site/looklab/
          # StudyLab fica em /studylab/
          mkdir -p _site/studylab
          cp -r studylab/. _site/studylab/
          # KATSEYE Central fica em /katseye-central/
          mkdir -p _site/katseye-central
          cp -r katseye-central/. _site/katseye-central/
          # Jezero (sobrevivência em Marte) fica em /marte/
          mkdir -p _site/marte
          cp -r marte/. _site/marte/
          rm -rf _site/marte/tools
          # GOLAÇO (futebol 3D) fica em /futebol3d/
          mkdir -p _site/futebol3d
          cp -r futebol3d/. _site/futebol3d/
          rm -rf _site/futebol3d/tools
          # GOLAÇO novo (futebol 3D, projeto do zero) fica em /golaco/
          mkdir -p _site/golaco
          if [ "${{ needs.testes-golaco.result }}" = "success" ]; then
            cp -r golaco/. _site/golaco/
          else
            # testes do golaco reprovados ou pulados (igual ao aprovado): publica o golaco do último deploy que deu certo
            # (o mesmo que já estava no ar)
            BOM=$(gh run list --workflow deploy-pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha')
            if [ -z "$BOM" ]; then echo "Nenhum deploy aprovado encontrado para o golaco"; exit 1; fi
            echo "Testes do golaco ${{ needs.testes-golaco.result }}: golaco fica na versão de $BOM"
            mkdir -p _site_golaco_tmp && git archive "$BOM" golaco | tar -x -C _site_golaco_tmp
            cp -r _site_golaco_tmp/golaco/. _site/golaco/
            rm -rf _site_golaco_tmp
          fi
          rm -rf _site/golaco/tools
          # Céu do Rio (simulador de voo) fica em /aviao/
          mkdir -p _site/aviao
          cp -r aviao/. _site/aviao/
          rm -rf _site/aviao/tools
          # RELÂMPAGO (corrida 3D em supervelocidade) fica em /velocista/
          mkdir -p _site/velocista
          cp -r velocista/. _site/velocista/
          rm -rf _site/velocista/tools
          # THE FLASH: versão do deploy, para o jogo se atualizar sozinho (velocista/js/atualizar.js)
          echo "{\"v\": \"${GITHUB_SHA}\"}" > _site/velocista/versao.json
          # LANCE A LANCE (simulador de partidas) fica em /simulador/
          mkdir -p _site/simulador
          cp -r simulador/. _site/simulador/
          rm -rf _site/simulador/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          # Raiz = jogo Total Match.
          # Subpastas: /financas-casa/, /looklab/, /studylab/, /katseye-central/, /marte/, /aviao/, /futebol3d/, /golaco/, /velocista/ e /simulador/.
          # O CreateFlow (raiz do repo) é hospedado à parte (Railway), não pelo Pages.
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
