name: GOLAÇO — testes
# Roda a bateria do GOLAÇO (golaco/) em todo PR que mexe no jogo, para o PR já mostrar se
# passa antes do merge. O deploy (deploy-pages.yml, job testes-golaco) chama ESTE arquivo
# (workflow_call com deploy: true) e bloqueia a publicação se algo reprovar.
# Em partes paralelas (dono, 15/10: "diminuir o tempo"; os mesmos testes, a mesma amostra):
# os testes em Node em 4 máquinas (rodar-testes.mjs --parte i --de 4) e os de navegador em 3
# (rodar-navegador.mjs --parte i --de 3; a lista deles fica no rodar-navegador.mjs). A divisão
# é pelo tempo medido no CI (golaco/tools/lib/tempos-ci.mjs). O job "testes" (o nome que o PR
# mostra) só passa se todas as partes passaram.
on:
  pull_request:
    paths:
      - 'golaco/**'
      - '.github/workflows/golaco-testes.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: 'Navegador só com os testes marcados para o deploy (rodar-navegador.mjs --deploy)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  node:
    name: node ${{ matrix.parte }} de 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes em Node (lógica do jogo), parte ${{ matrix.parte }} de 4
        run: node golaco/tools/rodar-testes.mjs --parte ${{ matrix.parte }} --de 4
  navegador:
    name: navegador ${{ matrix.parte }} de 3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium) para os testes no navegador
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Testes no navegador, parte ${{ matrix.parte }} de 3
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node golaco/tools/rodar-navegador.mjs --parte ${{ matrix.parte }} --de 3 ${{ inputs.deploy && '--deploy' || '' }}
  testes:
    needs: [node, navegador]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todas as partes passaram
        run: |
          echo "node (4 partes): ${{ needs.node.result }} · navegador (3 partes): ${{ needs.navegador.result }}"
          test "${{ needs.node.result }}" = success
          test "${{ needs.navegador.result }}" = success
