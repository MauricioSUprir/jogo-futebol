# Mantém o servidor do MindTrack AI (Render, plano grátis) acordado.
# O plano grátis do Render dorme depois de 15 min sem chamadas e leva ~30–50 s para
# acordar. Este robô chama o /saude a cada 10 min das 6h à meia-noite de Brasília
# (09h–03h UTC). De madrugada ele deixa dormir de propósito: as 750 horas grátis do
# Render por mês são divididas entre TODOS os serviços grátis da conta.
# Para manter acordado 24 h, troque os dois horários por '*/10 * * * *'.
name: MindTrack — mantém o servidor acordado

on:
  schedule:
    - cron: '*/10 9-23 * * *'
    - cron: '*/10 0-2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: mindtrack-acordar
  cancel-in-progress: true

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cutuca o servidor
        run: |
          for tentativa in 1 2 3; do
            if curl -fsS --max-time 70 https://mindtrack-servidor.onrender.com/saude -o /dev/null; then
              echo "Servidor acordado (tentativa $tentativa)."
              exit 0
            fi
            sleep 15
          done
          # não falha o job: um servidor fora do ar não deve encher o e-mail de avisos
          echo "::warning::O servidor do MindTrack não respondeu em 3 tentativas."
